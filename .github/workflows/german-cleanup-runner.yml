name: German cleanup diagnostic runner

on:
  push:
    branches: [fix/german-seo-cleanup]
    paths:
      - .german-cleanup-run2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/german-seo-cleanup
          fetch-depth: 0

      - name: Apply patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/german-cleanup.py > /tmp/german-cleanup.log 2>&1
          code=$?
          cat /tmp/german-cleanup.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit patch or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.patch.outputs.exit_code }}" != "0" ]; then
            cp /tmp/german-cleanup.log .german-cleanup-status.txt
            git add .german-cleanup-status.txt
            git commit -m "chore: record German cleanup failure"
            git push origin HEAD:fix/german-seo-cleanup
            exit 1
          fi
          git diff --check
          rm -f .german-cleanup-status.txt .german-cleanup-run2
          git add -A
          git commit -m "Apply German SEO cleanup patch"
          git push origin HEAD:fix/german-seo-cleanup

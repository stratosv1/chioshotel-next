name: German SEO cleanup branch

on:
  push:
    branches: [fix/german-seo-cleanup]
    paths:
      - .german-cleanup-trigger

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/german-seo-cleanup
          fetch-depth: 0

      - name: Apply German SEO and localization fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:140]!r}")
              write(path, text.replace(old, new, 1))
              print(f"updated {path}")

          # Legacy redirects: exact one-to-one mappings only.
          replace_once(
              "proxy.ts",
              '  "/chios-rooms/double-triple-rooms": "/chios-rooms/standard-double-room/",\n',
              '  "/chios-rooms/double-triple-rooms": "/chios-rooms/standard-double-room/",\n'
              '  "/de/uncategorized-de/economy-zimmer-auf-chios":\n'
              '    "/de/zimmer-chios/economy-zimmer-auf-chios/",\n'
              '  "/de/uncategorized-de/standard-doppelzimmer-auf-chios":\n'
              '    "/de/zimmer-chios/standard-doppelzimmer-auf-chios/",\n'
              '  "/de/uncategorized-de/familienapartments-in-chios":\n'
              '    "/de/zimmer-chios/familienapartments-in-chios/",\n'
              '  "/de/zimmer-chios": "/de/chios-zimmer/",\n',
          )
          replace_once(
              "proxy.ts",
              '  "/de/chios-ist-die-beste-insel-griechenlands": "/de/chios/",\n  "/de/chios.html": "/de/chios/",',
              '  "/de/chios-ist-die-beste-insel-griechenlands": "/de/chios-insel/",\n  "/de/chios.html": "/de/chios-insel/",',
          )

          # Preserve the historical Kambos intent by redirecting to the dedicated Kambos landing page.
          replace_once(
              "next.config.ts",
              '        "source":  "/de/chios-insel/kambos-auf-chios",\n        "destination":  "/de/chios-insel",',
              '        "source":  "/de/chios-insel/kambos-auf-chios",\n        "destination":  "/de/chios/kampos-chios/",',
          )

          # Structured-data parent must be the actual canonical German rooms hub.
          replace_once(
              "content/room-detail-schema.ts",
              '    roomsBreadcrumbPath: "/de/zimmer-chios/",',
              '    roomsBreadcrumbPath: "/de/chios-zimmer/",',
          )

          # Natural German CTA wording.
          replace_once(
              "components/rooms/RoomsCategoryPage.tsx",
              '    "economy-double": "Economy Double Rooms ansehen",',
              '    "economy-double": "Economy-Doppelzimmer ansehen",',
          )

          # Contact H1 alignment with German search/contact intent.
          replace_once(
              "components/contact/ContactPage.tsx",
              'const heroTitleByLocale: Partial<Record<string, string>> = {\n  el: "Επικοινωνία με το Voulamandis House στη Χίο",\n  tr: "Voulamandis House ile İletişim – Sakız Adası",\n};',
              'const heroTitleByLocale: Partial<Record<string, string>> = {\n  el: "Επικοινωνία με το Voulamandis House στη Χίο",\n  de: "Kontakt zum Voulamandis House auf Chios",\n  tr: "Voulamandis House ile İletişim – Sakız Adası",\n};',
          )

          # German footer microcopy and accessibility label.
          replace_once(
              "components/VoulamandisFooterTailwind.tsx",
              '  const locationLabel = language === "tr" ? "Kambos, Sakız Adası" : language === "el" ? "Κάμπος, Χίος" : "Kampos, Chios";\n  const footerTagline = language === "tr" ? "Sakız Adası odaları & daireleri · Doğrudan konaklama" : language === "el" ? "Δωμάτια & διαμερίσματα στη Χίο · Απευθείας διαμονή" : "Chios rooms & apartments · Direct stay";\n  const footerNavLabel = language === "tr" ? "Alt bilgi menüsü" : language === "el" ? "Πλοήγηση υποσέλιδου" : "Footer navigation";',
              '  const locationLabel = language === "tr" ? "Kambos, Sakız Adası" : language === "el" ? "Κάμπος, Χίος" : language === "de" ? "Kambos, Chios" : "Kampos, Chios";\n  const footerTagline = language === "tr" ? "Sakız Adası odaları & daireleri · Doğrudan konaklama" : language === "el" ? "Δωμάτια & διαμερίσματα στη Χίο · Απευθείας διαμονή" : language === "de" ? "Zimmer & Apartments auf Chios · Direkt buchen" : "Chios rooms & apartments · Direct stay";\n  const footerNavLabel = language === "tr" ? "Alt bilgi menüsü" : language === "el" ? "Πλοήγηση υποσέλιδου" : language === "de" ? "Fußzeilennavigation" : "Footer navigation";',
          )

          # Localize the few inherited English homepage fragments at render time, without duplicating German content data.
          home_path = "components/home/HomePageTailwindV3.tsx"
          home = read(home_path)
          old_home_fn = '''function localizeInheritedTurkishCopy(data: HomePageData): HomePageData {
  if (data.seo.canonicalPath !== "/tr/") {
    return data;
  }

  return {
    ...data,
    intro: {
      ...data.intro,
      right: {
        ...data.intro.right,
        cards: data.intro.right.cards.map((card) =>
          card.title.includes("Room Wizard")
            ? { ...card, title: "🧭 Oda Asistanı" }
            : card,
        ),
      },
    },
    location: {
      ...data.location,
      infoCard: {
        ...data.location.infoCard,
        addressLines: ["Mayor Kalvokoresi 117", "Kambos, Sakız Adası 82100"],
        emailLabel: "E-posta:",
      },
    },
    roomsPreview: {
      ...data.roomsPreview,
      primaryCta: {
        ...data.roomsPreview.primaryCta,
        label: "Oda Asistanı",
      },
      rooms: data.roomsPreview.rooms.map((room) => ({
        ...room,
        liveBadge: "CANLI",
      })),
    },
  };
}
'''
          new_home_fn = '''function localizeInheritedCopy(data: HomePageData): HomePageData {
  if (data.seo.canonicalPath === "/tr/") {

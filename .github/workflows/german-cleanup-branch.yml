'''
          if wizard.count(old_name) != 1:
              raise SystemExit("RoomWizardTailwind.tsx: room-name localizer did not match")
          wizard = wizard.replace(old_name, new_name, 1)

          old_type = '''function localizeRoomType(type: string, copy: WizardCopy) {

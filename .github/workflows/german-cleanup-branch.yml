              '"/de/uncategorized-de/economy-zimmer-auf-chios"',
              '"/de/uncategorized-de/standard-doppelzimmer-auf-chios"',
              '"/de/uncategorized-de/familienapartments-in-chios"',
              '"/de/zimmer-chios": "/de/chios-zimmer/"',
              '"/de/chios-ist-die-beste-insel-griechenlands": "/de/chios-insel/"',
              '"/de/chios.html": "/de/chios-insel/"',
          ]
          for value in required_proxy:
              if value not in proxy:
                  raise SystemExit(f"missing proxy fix: {value}")

          if '"destination":  "/de/chios/kampos-chios/"' not in read("next.config.ts"):
              raise SystemExit("Kambos legacy redirect is not targeted to the dedicated landing page")
          if 'roomsBreadcrumbPath: "/de/chios-zimmer/"' not in read("content/room-detail-schema.ts"):
              raise SystemExit("German room breadcrumb is not canonical")
          if 'de: "Kontakt zum Voulamandis House auf Chios"' not in read("components/contact/ContactPage.tsx"):
              raise SystemExit("German contact H1 override missing")
          if 'Zimmer & Apartments auf Chios · Direkt buchen' not in read("components/VoulamandisFooterTailwind.tsx"):
              raise SystemExit("German footer tagline missing")
          wizard_final = read(wizard_path)
          for expected in [
              'const deCopy: WizardCopy',
              'de: deCopy',
              '"Finden Sie das passende Zimmer"',
              '"Doppelbett"',
              '"Kochnische"',
              '"Wischen"',
              '"Foto"',
          ]:
              if expected not in wizard_final:
                  raise SystemExit(f"German wizard signal missing: {expected}")

          print("All targeted German cleanup assertions passed")
          PY

      - name: Diff check
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GSC routing QA
        run: npm run qa:gsc

      - name: SEO intent QA
        run: npm run qa:seo

      - name: Room language parity audit when available
        shell: bash
        run: |
          if [ -f scripts/audit-room-language-parity.cjs ]; then
            node scripts/audit-room-language-parity.cjs
          else
            echo "No room-language parity script present; skipping."
          fi

      - name: Production build
        run: npm run build

      - name: Remove temporary workflow artifacts and commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .connector-trigger.txt .connector-action-triggered .german-cleanup-trigger
          git rm -f .github/workflows/german-cleanup-branch.yml
          git rm -f .github/workflows/test-connector-trigger.yml || true
          git rm -f .github/workflows/apply-german-seo-cleanup.yml || true
          git rm -f .github/workflows/trigger-german-seo-cleanup.yml || true
          git add -A
          git status --short
          git commit -m "Fix German legacy URLs and language signals"
          git push origin HEAD:fix/german-seo-cleanup

name: Content Freshness

# After each production deploy, records which pages' visible text changed
# (data/content-freshness.json), commits the new dates and announces only the
# changed URLs to IndexNow. The dates feed sitemap <lastmod> and JSON-LD
# dateModified on the next deploy. Live data (sea conditions, prices) is
# ignored, so it never counts as an edit.

on:
  deployment_status:
  schedule:
    - cron: "40 3 * * *" # daily safety net (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-freshness
  cancel-in-progress: false

jobs:
  freshness:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Let the CDN settle
        if: github.event_name == 'deployment_status'
        run: sleep 60

      - name: Fingerprint live pages
        run: node scripts/content-freshness.mjs --changed-out=changed.txt

      - name: Commit updated dates
        id: commit
        run: |
          if git diff --quiet -- data/content-freshness.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(grep -c . changed.txt || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-freshness.json
          git commit -m "Content freshness: ${count:-0} page(s) changed"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Announce changed pages to IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow-submit.mjs changed.txt

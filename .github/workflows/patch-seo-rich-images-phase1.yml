name: Patch SEO Rich Images Phase 1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.number == 52
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/el-rich-snippets-images
          fetch-depth: 0

      - name: Apply integration patch
        run: node scripts/patch-seo-rich-images-phase1.cjs

      - name: Validate source
        run: |
          git diff --check
          grep -q 'resolveSeoDynamicTokens' lib/seo.ts
          grep -q 'SearchImageGallery path={ownerData.seo.canonicalPath}' components/rooms/RoomsCategoryPage.tsx
          grep -q 'SearchImageGallery path={data.seo.canonicalPath}' components/rooms/RoomDetailPage.tsx
          grep -q '{{currentYear}}' lib/seo-snippet-overrides.ts
          test -f app/image-sitemap.xml/route.ts
          test -f lib/seo-image-registry.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/seo.ts lib/seo-snippet-overrides.ts components/rooms/RoomsCategoryPage.tsx components/rooms/RoomDetailPage.tsx
          git rm scripts/patch-seo-rich-images-phase1.cjs .github/workflows/patch-seo-rich-images-phase1.yml
          git commit -m "Integrate search image galleries and dynamic SEO tokens"
          git restore .
          git clean -fd
          git fetch origin seo/el-rich-snippets-images
          git rebase origin/seo/el-rich-snippets-images
          git push origin HEAD:seo/el-rich-snippets-images

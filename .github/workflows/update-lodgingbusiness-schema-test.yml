name: Update LodgingBusiness schema regression test

on:
  push:
    branches:
      - fix/lodgingbusiness-inlanguage-warning

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/lodgingbusiness-inlanguage-warning
          fetch-depth: 0

      - name: Update rendered schema assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/qa-rendered-home-schema.cjs')
          text = path.read_text(encoding='utf-8')
          old = '    assert(lodging.inLanguage === "el", "LodgingBusiness must have inLanguage=el.");'
          new = '    assert(!("inLanguage" in lodging), "LodgingBusiness must not declare inLanguage.");'

          if old not in text:
              raise SystemExit('Old LodgingBusiness inLanguage assertion not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SEO QA
        run: npm run qa:seo

      - name: Build application
        run: npm run build

      - name: Validate rendered Greek homepage JSON-LD
        run: node scripts/qa-rendered-home-schema.cjs

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/update-lodgingbusiness-schema-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa-rendered-home-schema.cjs .github/workflows/update-lodgingbusiness-schema-test.yml
          git commit -m "Update LodgingBusiness schema regression test"
          git push origin HEAD:fix/lodgingbusiness-inlanguage-warning

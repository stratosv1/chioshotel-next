name: AI Room Finder Desktop Carousel Controls

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/add-ai-room-desktop-carousel-controls.cjs
      - .github/workflows/ai-room-desktop-carousel-controls.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/ai-room-desktop-carousel-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout follow-up branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-room-desktop-carousel-controls
          fetch-depth: 0

      - name: Apply desktop carousel controls
        run: node scripts/add-ai-room-desktop-carousel-controls.cjs

      - name: Validate source
        run: |
          git diff --check
          grep -q 'CAROUSEL_PREVIOUS' components/ai/AiRoomChatPreview.tsx
          grep -q 'CAROUSEL_NEXT' components/ai/AiRoomChatPreview.tsx
          grep -q 'aria-controls="ai-room-carousel-track"' components/ai/AiRoomChatPreview.tsx
          grep -q 'event.key === "ArrowLeft"' components/ai/AiRoomChatPreview.tsx
          grep -q 'event.key === "ArrowRight"' components/ai/AiRoomChatPreview.tsx
          grep -q 'sm:flex' components/ai/AiRoomChatPreview.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ai/AiRoomChatPreview.tsx
          git rm scripts/add-ai-room-desktop-carousel-controls.cjs .github/workflows/ai-room-desktop-carousel-controls.yml
          git commit -m "Improve desktop AI room carousel navigation"
          git restore .
          git clean -fd
          git push origin HEAD:fix/ai-room-desktop-carousel-controls

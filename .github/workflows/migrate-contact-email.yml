name: Migrate contact email to Gmail

on:
  push:
    branches:
      - agent/replace-contact-email-gmail

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace public and fallback contact email
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "info@" + "chioshotel.gr"
          new = "chioshotel@gmail.com"

          email_files = [
              Path("app/pl/layout.tsx"),
              Path("content/home.ts"),
              Path("content/contact.ts"),
              Path("content/welcome.ts"),
              Path("lib/structured-data.ts"),
              Path("components/rooms/RoomWizard.tsx"),
              Path("components/rooms/RoomWizardTailwind.tsx"),
              Path("components/rooms/GreekRoomWizardTailwind.tsx"),
          ]

          for path in email_files:
              text = path.read_text(encoding="utf-8-sig")
              if old not in text:
                  raise SystemExit(f"Expected old email not found in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          obsolete_hydrator = Path("components/contact/ContactEmailHydrator.tsx")
          if obsolete_hydrator.exists():
              obsolete_hydrator.unlink()

          replacements = {
              Path("app/api/contact/route.ts"): [
                  (
                      'const contactTo = process.env.CONTACT_TO || smtpUser;',
                      'const contactTo = process.env.CONTACT_TO || "chioshotel@gmail.com";',
                  ),
              ],
              Path("app/api/ai-assistant/request-email/route.ts"): [
                  (
                      'const contactTo = process.env.CONTACT_TO || process.env.RECEPTION_EMAIL || smtpUser;',
                      'const contactTo = process.env.CONTACT_TO || process.env.RECEPTION_EMAIL || "chioshotel@gmail.com";',
                  ),
              ],
              Path("app/api/ai-assistant/no-availability-request/route.ts"): [
                  (
                      'const contactTo = process.env.CONTACT_TO || process.env.RECEPTION_EMAIL || smtpUser;',
                      'const contactTo = process.env.CONTACT_TO || process.env.RECEPTION_EMAIL || "chioshotel@gmail.com";',
                  ),
              ],
              Path("app/api/beds24/booking/route.ts"): [
                  (
                      'const contactTo = process.env.BEDS24_NOTIFY_TO || process.env.CONTACT_TO || smtpUser;',
                      'const contactTo = process.env.BEDS24_NOTIFY_TO || process.env.CONTACT_TO || "chioshotel@gmail.com";',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8-sig")
              for source, replacement in pairs:
                  if source not in text:
                      raise SystemExit(f"Expected recipient fallback not found in {path}")
                  text = text.replace(source, replacement)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/migrate-contact-email.yml")
          if workflow.exists():
              workflow.unlink()
          PY

          if git grep -n 'info@chioshotel\.gr' -- . ':!package-lock.json'; then
            echo 'Old contact email still exists in tracked files.'
            exit 1
          fi

          git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace contact email with Gmail"
          git push origin HEAD:agent/replace-contact-email-gmail

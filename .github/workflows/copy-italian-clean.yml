name: Copy verified Italian SEO cleanup

on:
  push:
    branches: [fix/italian-seo-language-signals-clean]
    paths:
      - .it-clean-copy-trigger

permissions:
  contents: write

jobs:
  copy-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-seo-language-signals-clean
          fetch-depth: 0

      - name: Copy only audited Italian files from verified branch
        shell: bash
        run: |
          git fetch origin fix/italian-seo-language-signals:refs/remotes/origin/fix/italian-seo-language-signals
          git checkout origin/fix/italian-seo-language-signals -- \
            components/VoulamandisFooterTailwind.tsx \
            components/contact/ContactPage.tsx \
            components/rooms/RoomDetailPage.tsx \
            components/rooms/RoomWizardTailwind.tsx \
            components/rooms/RoomsCategoryPage.tsx \
            content/family-travel.ts \
            content/home.ts \
            content/room-detail-schema.ts \
            content/rooms.ts

      - name: Targeted Italian assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8-sig")

          wizard = read("components/rooms/RoomWizardTailwind.tsx")
          assert "it: enCopy" not in wizard
          for value in ["const itCopy: WizardCopy", "it: itCopy", "Camera $1", "Appartamento $1", "Angolo cottura", "Letto matrimoniale", "Ciao! Mi chiamo", 'isItalianCopy(copy) ? "foto"', 'isItalianCopy(copy) ? "Scorri"']:
              assert value in wizard, value

          schema = read("content/room-detail-schema.ts")
          assert 'roomsBreadcrumbPath: "/it/camere-a-chios/"' in schema
          assert schema.count('it: "La camera') >= 7
          assert schema.count('it: "L’appartamento') >= 3

          home = read("content/home.ts")
          a = home.index("export const homePageIt: HomePageData = {")
          b = home.index("export const homePageEs: HomePageData = {", a)
          it_home = home[a:b]
          for bad in ["Room Wizard", "🏡 Apt", "Codice sconto live", "Offerta live", 'title: "Hotel e appartamenti a Chios, nel cuore di Kambos"']:
              assert bad not in it_home, bad
          assert it_home.count('liveBadge: "IN DIRETTA"') == 4
          assert 'title: "Camere e appartamenti a Chios, nel cuore di Kambos"' in it_home
          assert 'label: "Trova la tua camera"' in it_home

          rooms = read("content/rooms.ts")
          a = rooms.index("export const roomsCategoryIt: RoomsCategoryPageData = {")
          b = rooms.index("export const roomsCategoryEs: RoomsCategoryPageData = {", a)
          it_rooms = rooms[a:b]
          assert "Room Wizard" not in it_rooms
          assert "Miglior rapporto qualità-prezzo" in it_rooms
          assert "assistente per trovare la camera" in it_rooms

          assert "Camere & appartamenti a Chios · Prenotazione diretta" in read("components/VoulamandisFooterTailwind.tsx")
          assert "Navigazione a piè di pagina" in read("components/VoulamandisFooterTailwind.tsx")
          assert '"economy-double": "Vedi le camere doppie economiche"' in read("components/rooms/RoomsCategoryPage.tsx")
          assert 'it: "Contatta Voulamandis House a Chios"' in read("components/contact/ContactPage.tsx")

          detail = read("components/rooms/RoomDetailPage.tsx")
          for value in [
              'Layout: { fr: "Disposition", it: "Disposizione"',
              'Desk: { fr: "Bureau", it: "Scrivania"',
              '"Courtyard access": { fr: "Accès à la cour", it: "Accesso al cortile"',
              '"Terrace access": { fr: "Accès à la terrasse", it: "Accesso alla terrazza"',
              '"Balcony view": { fr: "Vue depuis le balcon", it: "Vista dal balcone"',
          ]:
              assert value in detail, value

          family = read("content/family-travel.ts")
          a = family.index('  it: {\n    locale: "it",')
          b = family.index('  es: {\n    locale: "es",', a)
          it_family = family[a:b]
          assert it_family.count("alt:") >= 8
          assert "Vacanze in famiglia a Chios con bambini" in it_family
          assert "Il tranquillo giardino del Voulamandis House" in it_family

          route_map = read("lib/url-map.ts")
          for path in [
              "/it/",
              "/it/camere-a-chios/",
              "/it/stanze-a-chios/camera-doppia-economica-chios/",
              "/it/stanze-a-chios/camere-doppie-standard-chios/",
              "/it/stanze-a-chios/appartamenti-familiari-a-chios/",
              "/it/prezzi-hotel-chios/",
              "/it/contattaci-voulamandis-house/",
          ]:
              assert path in route_map, path
          print("Clean Italian targeted assertions passed")
          PY

      - name: Diff check
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GSC routing QA
        run: npm run qa:gsc

      - name: SEO intent QA
        run: npm run qa:seo

      - name: Production build
        run: npm run build

      - name: Commit only verified Italian files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .it-clean-copy-trigger .github/workflows/copy-italian-clean.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Fix Italian SEO and language signals"
          git push origin HEAD:fix/italian-seo-language-signals-clean

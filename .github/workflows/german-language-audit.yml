name: German language audit diagnostic

on:
  push:
    branches: [fix/german-seo-cleanup]
    paths:
      - .german-language-trigger

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/german-seo-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          set +e
          node scripts/audit-room-language-parity.cjs > .german-language-audit.txt 2>&1
          echo "exit_code=$?" >> .german-language-audit.txt
          cat .german-language-audit.txt
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .german-language-audit.txt
          git commit -m "chore: record German language audit"
          git push origin HEAD:fix/german-seo-cleanup

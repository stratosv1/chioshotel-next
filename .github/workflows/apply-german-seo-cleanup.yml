          kambos_component = Path("components/chios/LocalizedKamposLandingPage.tsx").read_text(encoding="utf-8-sig")
          if 'whyEyebrow: "Urlaub in einem anderen Rhythmus"' not in kambos_component or 'whyTitle: "Ruhe, Charakter und kurze Wege"' not in kambos_component:

'''
          if text.count(old_helpers) != 1:
              raise SystemExit(f"RoomWizardTailwind.tsx: helper block match count {text.count(old_helpers)}")
          text = text.replace(old_helpers, new_helpers, 1)

          old_photo = '  const photoLabel = isPolishCopy(copy) ? "zdjęcie" : isTurkishCopy(copy) ? "fotoğraf" : "photo";'
          new_photo = '  const photoLabel = isPolishCopy(copy) ? "zdjęcie" : isGermanCopy(copy) ? "Foto" : isTurkishCopy(copy) ? "fotoğraf" : "photo";'
          if text.count(old_photo) != 1:
              raise SystemExit("RoomWizardTailwind.tsx: photo label marker missing")
          text = text.replace(old_photo, new_photo, 1)

          old_beds = '''  const polish = isPolishCopy(copy);\n  const turkish = isTurkishCopy(copy);\n  const roomName = localizeRoomName(room.name, copy);\n  const doubleBed = polish ? "Podwójne" : turkish ? "Çift kişilik" : "Double";\n  const singleBed = polish ? "Pojedyncze" : turkish ? "Tek kişilik" : "Single";\n  const sofaBed = polish ? "Sofa" : turkish ? "Çekyat" : "Sofa";'''
          new_beds = '''  const polish = isPolishCopy(copy);\n  const german = isGermanCopy(copy);\n  const turkish = isTurkishCopy(copy);\n  const roomName = localizeRoomName(room.name, copy);\n  const doubleBed = polish ? "Podwójne" : german ? "Doppelbett" : turkish ? "Çift kişilik" : "Double";\n  const singleBed = polish ? "Pojedyncze" : german ? "Einzelbett" : turkish ? "Tek kişilik" : "Single";\n  const sofaBed = polish ? "Sofa" : german ? "Schlafsofa" : turkish ? "Çekyat" : "Sofa";'''
          if text.count(old_beds) != 1:
              raise SystemExit("RoomWizardTailwind.tsx: bed label block missing")
          text = text.replace(old_beds, new_beds, 1)

          old_swipe = '  const swipeLabel = isPolishCopy(copy) ? "Przesuń" : isTurkishCopy(copy) ? "Kaydırın" : "Swipe";'
          new_swipe = '  const swipeLabel = isPolishCopy(copy) ? "Przesuń" : isGermanCopy(copy) ? "Wischen" : isTurkishCopy(copy) ? "Kaydırın" : "Swipe";'

      - name: Install dependencies
        run: npm ci

      - name: Run GSC routing QA
        run: npm run qa:gsc

      - name: Run SEO intent QA
        run: npm run qa:seo

      - name: Production build
        run: npm run build

      - name: Commit verified German cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-german-seo-cleanup.yml
          git add proxy.ts next.config.ts content/room-detail-schema.ts content/home.ts components/rooms/RoomsCategoryPage.tsx components/contact/ContactPage.tsx components/VoulamandisFooterTailwind.tsx components/rooms/RoomWizardTailwind.tsx
          git status --short
          git commit -m "Fix German legacy URLs and language signals"
          git push origin HEAD:main

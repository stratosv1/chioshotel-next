name: Temporary Final Booking Contract Cleanup

on:
  push:
    branches: [booking-core-central-source]
    paths: [.github/workflows/tmp-final-booking-contract-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: booking-core-central-source
          fetch-depth: 0
      - name: Enforce canonical booking contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          ai = Path('app/api/ai-assistant/route.ts')
          s = ai.read_text()
          replacements = {
            'guests must be between 1 and 10.': 'guests must be between 1 and 5.',
            'maximum: 10': 'maximum: 5',
            'decision.guests <= 10': 'decision.guests <= 5',
            'search.guests <= 10': 'search.guests <= 5',
            'const originalTotal = Number(room.originalTotal ?? room.totalPrice ?? room.price ?? room.roomTotal ?? 0);\n      const directTotal = Number(room.directTotal ?? 0);\n      const saving = Number(room.saving ?? (originalTotal - directTotal));\n      const directDiscountPercent = Number(room.directDiscountPercent ?? 0);': 'const originalTotal = Number(room.originalTotal);\n      const directTotal = Number(room.directTotal);\n      const saving = Number(room.saving);\n      const directDiscountPercent = Number(room.directDiscountPercent);',
            'if (!meta || !Number.isFinite(originalTotal) || originalTotal <= 0 || !Number.isFinite(directTotal) || directTotal <= 0) return null;': 'if (!meta || !Number.isFinite(originalTotal) || originalTotal <= 0 || !Number.isFinite(directTotal) || directTotal <= 0 || !Number.isFinite(saving) || saving < 0 || !Number.isFinite(directDiscountPercent) || directDiscountPercent < 0) return null;',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'AI replacement not found: {old[:80]}')
            s = s.replace(old, new)
          ai.write_text(s)

          live = Path('components/home/liveDirectRequestUtils.ts')
          s = live.read_text()
          old = '''  const original = Number(raw.originalTotal || 0);\n  const direct = Number(raw.directTotal || 0);\n  if (!Number.isFinite(original) || original <= 0 || !Number.isFinite(direct) || direct <= 0) return null;\n\n  return {\n    original: Math.round(original * 100) / 100,\n    direct: Math.round(direct * 100) / 100,\n    price: Math.round(direct * 100) / 100,\n    saving: Number(raw.saving || original - direct),\n    discountPercent: Number(raw.directDiscountPercent || 0),\n    guestNote: raw.guestNote || null,\n  };'''
          new = '''  const original = Number(raw.originalTotal);\n  const direct = Number(raw.directTotal);\n  const saving = Number(raw.saving);\n  const discountPercent = Number(raw.directDiscountPercent);\n  if (!Number.isFinite(original) || original <= 0 || !Number.isFinite(direct) || direct <= 0 || !Number.isFinite(saving) || saving < 0 || !Number.isFinite(discountPercent) || discountPercent < 0) return null;\n\n  return {\n    original: Math.round(original * 100) / 100,\n    direct: Math.round(direct * 100) / 100,\n    price: Math.round(direct * 100) / 100,\n    saving: Math.round(saving * 100) / 100,\n    discountPercent,\n    guestNote: raw.guestNote || null,\n  };'''
          if old not in s:
            raise SystemExit('LiveDirectRequest canonical block not found')
          live.write_text(s.replace(old,new))

          deals = Path('app/api/deals/route.ts')
          s = deals.read_text()
          old = '''    const [roomRows, quoteRows] = await Promise.all([\n      sql`\n        select room_number, room_id::text as room_id, unit_id::text as unit_id,'''
          new = '''    const [inventoryRows, roomRows, quoteRows] = await Promise.all([\n      sql`\n        select * from booking_core.inventory_status(${firstDate}::date, ${addDays(lastDate, 1)}::date)\n      `,\n      sql`\n        select room_number, room_id::text as room_id, unit_id::text as unit_id,'''
          if old not in s:
            raise SystemExit('Deals Promise.all start not found')
          s = s.replace(old,new)
          old2 = '''    const rooms = (roomRows as any[]).map((row) => ({'''
          new2 = '''    const inventory = (inventoryRows as any[])?.[0];\n    if (!inventory || String(inventory.status) !== "READY") {\n      throw new Error(`Booking inventory is not ready: ${String(inventory?.status || "DATA_UNAVAILABLE")}`);\n    }\n\n    const rooms = (roomRows as any[]).map((row) => ({'''
          if old2 not in s:
            raise SystemExit('Deals rooms block not found')
          deals.write_text(s.replace(old2,new2))
          PY
          git diff --check
          git diff -- app/api/ai-assistant/route.ts components/home/liveDirectRequestUtils.ts app/api/deals/route.ts
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "stratosv1"
          git config user.email "44983464+stratosv1@users.noreply.github.com"
          git add app/api/ai-assistant/route.ts components/home/liveDirectRequestUtils.ts app/api/deals/route.ts
          git commit -m "Enforce canonical Neon booking contracts"
          git push origin booking-core-central-source

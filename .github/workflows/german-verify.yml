name: Verify German SEO cleanup

on:
  push:
    branches: [fix/german-seo-cleanup]
    paths:
      - .german-verify-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/german-seo-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: GSC routing QA
        id: gsc
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run qa:gsc

      - name: SEO intent QA
        id: seo
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run qa:seo

      - name: Room language parity audit
        id: language
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if [ -f scripts/audit-room-language-parity.cjs ]; then
            node scripts/audit-room-language-parity.cjs
          else
            echo "No room-language parity script present."
          fi

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record verification result
        if: always()
        shell: bash
        run: |
          cat > .german-verify-status.txt <<EOF
          install=${{ steps.install.outcome }}
          gsc=${{ steps.gsc.outcome }}
          seo=${{ steps.seo.outcome }}
          language=${{ steps.language.outcome }}
          build=${{ steps.build.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .german-verify-status.txt
          git commit -m "chore: record German cleanup verification"
          git push origin HEAD:fix/german-seo-cleanup

name: Fix Rooms Wizard Desktop and Romantic Image

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/fix-rooms-wizard-desktop-and-romantic-image.cjs
      - .github/workflows/fix-rooms-wizard-desktop-and-romantic-image.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/rooms-wizard-desktop-and-romantic-image'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/rooms-wizard-desktop-and-romantic-image
          fetch-depth: 0

      - name: Apply hotfix
        run: node scripts/fix-rooms-wizard-desktop-and-romantic-image.cjs

      - name: Validate source
        run: |
          git diff --check
          grep -q 'w-\[min(1180px,100%)\]' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'resultsCarouselRef' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'Προηγούμενη πρόταση' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'Επόμενη πρόταση' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'lg:w-\[calc(50%-0.5rem)\]' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q '/images/kampos/kambos-chios.jpg' content/romantic-stay.ts
          ! grep -q '/images/activities/kampos-chios.webp' content/romantic-stay.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/rooms/GreekRoomWizardTailwind.tsx content/romantic-stay.ts
          git rm scripts/fix-rooms-wizard-desktop-and-romantic-image.cjs .github/workflows/fix-rooms-wizard-desktop-and-romantic-image.yml
          git commit -m "Fix desktop room wizard and romantic Kambos image"
          git restore .
          git clean -fd
          git fetch origin fix/rooms-wizard-desktop-and-romantic-image
          git rebase origin/fix/rooms-wizard-desktop-and-romantic-image
          git push origin HEAD:fix/rooms-wizard-desktop-and-romantic-image

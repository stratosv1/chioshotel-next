name: Patch SEO Destination Images Phase 3

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.number == 52
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/el-rich-snippets-images
          fetch-depth: 0

      - name: Apply destination patch
        run: node scripts/patch-seo-destination-images-phase3.cjs

      - name: Validate source
        run: |
          git diff --check
          grep -q 'SearchImageGallery path={data.seo.canonicalPath}' components/landing/GreekAccommodationPage.tsx
          grep -q 'SearchImageGallery path={data.seo.canonicalPath}' components/chios/GreekKamposLandingPageElegant.tsx
          grep -q 'buildSeoImageObjectSchemas' content/diamoni-sti-xio-schema.ts
          grep -q 'buildKamposWebPageSchema' content/kampos-chios-schema.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated destination changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/landing/GreekAccommodationPage.tsx components/chios/GreekKamposLandingPageElegant.tsx content/diamoni-sti-xio-schema.ts content/kampos-chios-schema.ts
          git rm scripts/patch-seo-destination-images-phase3.cjs .github/workflows/patch-seo-destination-images-phase3.yml
          git commit -m "Add search image galleries to Greek destination landings"
          git restore .
          git clean -fd
          git fetch origin seo/el-rich-snippets-images
          git rebase origin/seo/el-rich-snippets-images
          git push origin HEAD:seo/el-rich-snippets-images

name: Trigger German SEO cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-german-seo-cleanup.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger one-shot cleanup workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '\n# Triggered by one-shot launcher\n' >> .github/workflows/apply-german-seo-cleanup.yml
          git rm .github/workflows/trigger-german-seo-cleanup.yml
          git add .github/workflows/apply-german-seo-cleanup.yml
          git commit -m "Trigger German SEO cleanup workflow"
          git push origin HEAD:main

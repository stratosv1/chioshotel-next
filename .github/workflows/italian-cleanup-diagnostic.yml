name: Italian cleanup diagnostic

on:
  push:
    branches: [fix/italian-seo-language-signals]
    paths:
      - .it-diagnostic-trigger

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-seo-language-signals
          fetch-depth: 0
      - name: Run patch and capture result
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/run-italian-seo-cleanup.py > .italian-cleanup-status.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .italian-cleanup-status.txt
          cat .italian-cleanup-status.txt
          exit 0
      - name: Commit diagnostic and any patch changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record Italian cleanup diagnostic"
          git push origin HEAD:fix/italian-seo-language-signals

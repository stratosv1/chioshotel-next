name: Temporary Booking Core Deploy Check

on:
  push:
    branches: [booking-core-central-source]
    paths: [.github/workflows/tmp-booking-core-deploy-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed booking_core_snapshot
        shell: bash
        run: |
          node <<'NODE'
          const url = new URL('https://script.google.com/macros/s/AKfycbzSK2Y12vl4RZJvbbcxIkzAl4un93fQManKZ96BGyLsp-vv6j9NQboYnwnc6GtUvOBj/exec');
          url.searchParams.set('action', 'booking_core_snapshot');
          url.searchParams.set('_ts', String(Date.now()));
          const response = await fetch(url, { redirect: 'follow', headers: { accept: 'application/json' } });
          const text = await response.text();
          console.log('HTTP_STATUS=' + response.status);
          console.log('BODY=' + text.slice(0, 2000));
          if (!response.ok) process.exit(2);
          let payload;
          try { payload = JSON.parse(text); } catch { process.exit(3); }
          if (payload?.type !== 'booking_core_snapshot' || Number(payload?.schemaVersion) !== 1) process.exit(4);
          console.log('DEPLOYED_CONTRACT_OK=true');
          console.log('OK=' + String(payload?.ok));
          console.log('REFRESH_STATE=' + String(payload?.refreshState || ''));
          console.log('DATA_UPDATED_AT=' + String(payload?.dataUpdatedAt || ''));
          console.log('COUNT=' + String(payload?.count || 0));
          NODE

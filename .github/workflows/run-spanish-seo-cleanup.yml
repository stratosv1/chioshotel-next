name: Run Spanish SEO cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-spanish-seo-cleanup.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Spanish cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/spanish-seo-language-signals
          fetch-depth: 0

      - name: Run patch and capture result
        shell: bash
        run: |
          set +e
          output=$(python3 scripts/apply-spanish-seo-cleanup.py 2>&1)
          code=$?
          git reset --hard HEAD
          printf '%s\nexit_code=%s\n' "$output" "$code" > .spanish-cleanup-status.txt
          cat .spanish-cleanup-status.txt

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .spanish-cleanup-status.txt
          git commit -m "chore: record Spanish cleanup diagnostic"
          git push origin HEAD:fix/spanish-seo-language-signals


name: Commit clean Spanish SEO branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-spanish-seo-cleanup.yml

permissions:
  contents: write

jobs:
  commit-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean Spanish branch
        uses: actions/checkout@v4
        with:
          ref: fix/spanish-seo-language-signals-clean-2
          fetch-depth: 0

      - name: Copy only verified Spanish files
        shell: bash
        run: |
          git fetch origin fix/spanish-seo-language-signals
          git checkout 652fa3d225ee1f48650b861da425119a4b290684 -- \
            components/VoulamandisFooterTailwind.tsx \
            components/contact/ContactPage.tsx \
            components/home/LiveDirectRequest.tsx \
            components/rooms/RoomDetailPage.tsx \
            components/rooms/RoomWizardTailwind.tsx \
            components/rooms/RoomsCategoryPage.tsx \
            content/family-travel.ts \
            content/home.ts \
            content/room-detail-schema.ts
          git diff --cached --check
          printf '%s\n' \
            components/VoulamandisFooterTailwind.tsx \
            components/contact/ContactPage.tsx \
            components/home/LiveDirectRequest.tsx \
            components/rooms/RoomDetailPage.tsx \
            components/rooms/RoomWizardTailwind.tsx \
            components/rooms/RoomsCategoryPage.tsx \
            content/family-travel.ts \
            content/home.ts \
            content/room-detail-schema.ts | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Spanish changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .spanish-clean-status.txt
          git add \
            components/VoulamandisFooterTailwind.tsx \
            components/contact/ContactPage.tsx \
            components/home/LiveDirectRequest.tsx \
            components/rooms/RoomDetailPage.tsx \
            components/rooms/RoomWizardTailwind.tsx \
            components/rooms/RoomsCategoryPage.tsx \
            content/family-travel.ts \
            content/home.ts \
            content/room-detail-schema.ts
          git commit -m "Fix Spanish SEO and language signals"
          git push origin HEAD:fix/spanish-seo-language-signals-clean-2

# clean commit trigger 2026-07-29

name: Run Spanish SEO cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-spanish-seo-cleanup.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Spanish cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/spanish-seo-language-signals
          fetch-depth: 0

      - name: Adjust patcher for duplicated helper block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-spanish-seo-cleanup.py')
          s = p.read_text(encoding='utf-8')
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly 1 occurrence, found {count}")\n    return text.replace(old, new, 1)'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if label == "RoomWizard: Spanish tag flag" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly 1 occurrence, found {count}")\n    return text.replace(old, new, 1)'''
          if old not in s:
              raise SystemExit('replace_once block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run patch and capture result
        shell: bash
        run: |
          set +e
          output=$(python3 scripts/apply-spanish-seo-cleanup.py 2>&1)
          code=$?
          git reset --hard HEAD
          printf '%s\nexit_code=%s\n' "$output" "$code" > .spanish-cleanup-status.txt
          cat .spanish-cleanup-status.txt

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .spanish-cleanup-status.txt
          git commit -m "chore: record Spanish cleanup diagnostic"
          git push origin HEAD:fix/spanish-seo-language-signals


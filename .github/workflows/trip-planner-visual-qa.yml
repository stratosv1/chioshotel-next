name: Trip Planner Visual QA

on:
  push:
    branches:
      - agent/beach-master-dataset
    paths:
      - ".github/workflows/trip-planner-visual-qa.yml"
      - "scripts/capture-trip-planner-visual.mjs"
      - "components/trip-planner/**"
      - "content/trip-planner/**"
      - "app/trip-planner/**"
      - "app/api/trip-planner/**"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright for visual QA
        run: |
          npm install --no-save @playwright/test@1.54.2
          npx playwright install --with-deps chromium

      - name: Start Next.js dev server
        run: |
          npm run dev > /tmp/trip-planner-visual-next.log 2>&1 &
          echo $! > /tmp/trip-planner-visual-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/trip-planner/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/trip-planner-visual-next.log
          exit 1

      - name: Capture mobile and desktop planner states
        run: node scripts/capture-trip-planner-visual.mjs

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-planner-visual-qa
          path: |
            artifacts/trip-planner-visual
            /tmp/trip-planner-visual-next.log

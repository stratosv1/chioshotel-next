name: Locate Italian cleanup targets

on:
  push:
    branches: [fix/italian-seo-language-signals]
    paths:
      - .it-locate-trigger

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-seo-language-signals
          fetch-depth: 0
      - name: Locate audited strings
        shell: bash
        run: |
          {
            echo '### Activities in Chios'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Activities in Chios' . || true
            echo '### Explore local traditions'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Explore local traditions' . || true
            echo '### Kampos base'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Kampos base' . || true
            echo '### Beach lover experience'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Beach lover experience' . || true
            echo '### Peaceful mornings'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Peaceful mornings' . || true
            echo '### Why it matters'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Why it matters' . || true
            echo '### Family holidays alt'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'Family holidays in Chios with children enjoying a sunny island day' . || true
            echo '### peaceful garden alt'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'The peaceful garden of Voulamandis House in Kambos Chios' . || true
            echo '### it locale nearby'; grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'vacanze-in-famiglia-a-chios\|chios-per-amanti-del-mare\|attivita-a-chios\|kampos-chios' content components app lib | head -n 250 || true
          } > .italian-audit-locations.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .italian-audit-locations.txt
          git commit -m 'chore: record Italian cleanup locations'
          git push origin HEAD:fix/italian-seo-language-signals

name: Fix LodgingBusiness inLanguage

on:
  push:
    branches:
      - fix/lodgingbusiness-inlanguage-warning

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/lodgingbusiness-inlanguage-warning
          fetch-depth: 0

      - name: Remove unsupported LodgingBusiness inLanguage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/structured-data.ts')
          text = path.read_text(encoding='utf-8')

          old_language = '  const language = getGlobalSchemaLanguage(options.path);\n  const labels = getLocalizedSchemaLabels(options.path);'
          new_language = '  const labels = getLocalizedSchemaLabels(options.path);'
          old_property = '    inLanguage: language,\n'

          if old_language not in text:
              raise SystemExit('Expected LodgingBusiness language declaration not found')
          if old_property not in text:
              raise SystemExit('Expected LodgingBusiness inLanguage property not found')

          text = text.replace(old_language, new_language, 1)
          text = text.replace(old_property, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify language properties remain on content schemas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('lib/structured-data.ts').read_text(encoding='utf-8')
          start = text.index('export function buildHotelSchema(')
          end = text.index('export function buildWebsiteSchema()', start)
          hotel = text[start:end]

          if 'inLanguage:' in hotel:
              raise SystemExit('LodgingBusiness still contains inLanguage')
          if 'inLanguage: ["en", "el", "fr", "de", "it", "es", "tr"]' not in text:
              raise SystemExit('WebSite inLanguage was removed unexpectedly')
          if 'inLanguage: getLanguageForPath(pagePath)' not in text:
              raise SystemExit('ImageObject inLanguage was removed unexpectedly')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structured data
        run: npm run qa:structured-data --if-present

      - name: Run SEO QA
        run: npm run qa:seo

      - name: Build application
        run: npm run build

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-lodgingbusiness-inlanguage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/structured-data.ts .github/workflows/fix-lodgingbusiness-inlanguage.yml
          git commit -m "Remove unsupported LodgingBusiness inLanguage"
          git push origin HEAD:fix/lodgingbusiness-inlanguage-warning

# Trigger the one-time cleanup after the workflow file exists on the branch.

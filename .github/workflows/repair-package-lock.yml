name: Repair package lock once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-package-lock.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair only the missing lockfile dependency
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'xlsx@^0.18.5'
          git checkout -- package.json

          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const beforeRoot = before.packages?.[''] || {};
          const afterRoot = after.packages?.[''] || {};

          if (afterRoot.dependencies?.xlsx !== '^0.18.5') {
            throw new Error('xlsx is still missing from the root lockfile dependencies');
          }
          if (!after.packages?.['node_modules/xlsx']) {
            throw new Error('xlsx package entry is missing from package-lock.json');
          }

          const directNames = new Set([
            ...Object.keys(beforeRoot.dependencies || {}),
            ...Object.keys(beforeRoot.devDependencies || {}),
          ]);
          for (const name of directNames) {
            const key = `node_modules/${name}`;
            const oldVersion = before.packages?.[key]?.version;
            const newVersion = after.packages?.[key]?.version;
            if (oldVersion !== newVersion) {
              throw new Error(`Unexpected direct dependency version change: ${name} ${oldVersion} -> ${newVersion}`);
            }
          }

          console.log('Lockfile repair guard passed; existing direct dependency versions are unchanged.');
          NODE

          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          git diff --stat -- package-lock.json

      - name: Commit repaired lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-package-lock.yml
          git add package-lock.json
          git commit -m "Repair package lock and restore npm ci"
          git push origin HEAD:main

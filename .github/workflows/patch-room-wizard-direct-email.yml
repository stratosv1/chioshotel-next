name: Patch Room Wizard Direct Email

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.number == 51
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/room-wizard-direct-email
          fetch-depth: 0

      - name: Apply direct email patch
        run: node scripts/patch-room-wizard-direct-email.cjs

      - name: Validate source
        run: |
          git diff --check
          grep -q 'source: "room-wizard"' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'Αποστολή…' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'Το αίτημα στάλθηκε στην υποδοχή' components/rooms/GreekRoomWizardTailwind.tsx
          grep -q 'replyTo: isLikelyEmail(guestEmail)' app/api/ai-assistant/summary-email/route.ts
          ! grep -q 'mailto:chioshotel@gmail.com' components/rooms/GreekRoomWizardTailwind.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/rooms/GreekRoomWizardTailwind.tsx app/api/ai-assistant/summary-email/route.ts
          git commit -m "Send Room Wizard enquiries directly by email"
          git restore .
          git clean -fd
          git fetch origin fix/room-wizard-direct-email
          git rebase origin/fix/room-wizard-direct-email
          git push origin HEAD:fix/room-wizard-direct-email

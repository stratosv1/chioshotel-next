name: Patch rooms schema alignment

on:
  push:
    branches:
      - fix/rooms-schema-alignment
    paths:
      - .github/workflows/patch-rooms-schema-alignment.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rooms-schema-alignment
          fetch-depth: 0

      - name: Align visible and structured image signals
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceRequired(path, before, after) {
            const current = fs.readFileSync(path, 'utf8');
            if (!current.includes(before)) {
              throw new Error(`Expected text not found in ${path}`);
            }
            fs.writeFileSync(path, current.replace(before, after));
          }

          const roomsPath = 'content/rooms.ts';
          const rooms = fs.readFileSync(roomsPath, 'utf8');
          const greekStart = rooms.indexOf('export const roomsCategoryEl: RoomsCategoryPageData = {');
          const greekEnd = rooms.indexOf('export const roomsCategoryFr: RoomsCategoryPageData = {', greekStart);
          if (greekStart === -1 || greekEnd === -1) {
            throw new Error('Greek rooms category section was not found');
          }
          const greekSection = rooms.slice(greekStart, greekEnd);
          const oldOgImage = '    ogImage:\n      "/images/rooms/chios-hotels-family-apartments.webp",';
          const newOgImage = '    ogImage:\n      "/images/rooms/received_1753964631359257.webp",';
          if (!greekSection.includes(oldOgImage)) {
            throw new Error('Greek rooms og:image source was not found');
          }
          fs.writeFileSync(
            roomsPath,
            rooms.slice(0, greekStart) + greekSection.replace(oldOgImage, newOgImage) + rooms.slice(greekEnd),
          );

          const registryPath = 'lib/seo-image-registry.ts';
          const registry = fs.readFileSync(registryPath, 'utf8');
          const setStart = registry.indexOf('    path: "/el/domatia-xios/",');
          const setEnd = registry.indexOf('    path: "/el/diamoni-sti-xio/",', setStart);
          if (setStart === -1 || setEnd === -1) {
            throw new Error('Greek rooms image set was not found');
          }
          const setSection = registry.slice(setStart, setEnd);
          const apartmentTenBlock = `      {
        src: "/images/rooms/DSC07899.webp",
        alt: "Οικογενειακό διαμέρισμα 10 στο Voulamandis House στη Χίο",
        caption: "Οικογενειακό διαμέρισμα 10",
      },
`;
          if (!setSection.includes(apartmentTenBlock)) {
            throw new Error('Non-visible apartment 10 image block was not found');
          }
          fs.writeFileSync(
            registryPath,
            registry.slice(0, setStart) + setSection.replace(apartmentTenBlock, '') + registry.slice(setEnd),
          );

          replaceRequired(
            'content/rooms-schema.ts',
            'function getRoomCardSchemaId(card: RoomCategoryCard): string {\n  return schemaId(card.href, card.id);\n}',
            'function getRoomCardSchemaId(card: RoomCategoryCard): string {\n  return schemaId(card.href, card.id);\n}',
          );
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SEO QA
        run: npm run qa:seo

      - name: Build application
        run: npm run build

      - name: Verify schema source alignment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const schema = fs.readFileSync('content/rooms-schema.ts', 'utf8');
          const rooms = fs.readFileSync('content/rooms.ts', 'utf8');
          const registry = fs.readFileSync('lib/seo-image-registry.ts', 'utf8');

          if (!schema.includes('schemaId(card.href, card.id)')) throw new Error('Unique room category IDs missing');
          if (!schema.includes('seoSnippetOverrides.get(canonicalPath)')) throw new Error('Schema SEO copy is not aligned');
          if (!schema.includes('Δωμάτια και διαμερίσματα στο Voulamandis House')) throw new Error('Natural primary image caption missing');

          const greekStart = rooms.indexOf('export const roomsCategoryEl: RoomsCategoryPageData = {');
          const greekEnd = rooms.indexOf('export const roomsCategoryFr: RoomsCategoryPageData = {', greekStart);
          const greekSection = rooms.slice(greekStart, greekEnd);
          if (!greekSection.includes('/images/rooms/received_1753964631359257.webp')) throw new Error('Greek rooms OG image is not visible card image');
          if (greekSection.includes('/images/rooms/chios-hotels-family-apartments.webp')) throw new Error('Old Greek rooms OG image remains');

          const setStart = registry.indexOf('    path: "/el/domatia-xios/",');
          const setEnd = registry.indexOf('    path: "/el/diamoni-sti-xio/",', setStart);
          const setSection = registry.slice(setStart, setEnd);
          if (setSection.includes('/images/rooms/DSC07899.webp')) throw new Error('Non-visible apartment 10 image remains in general rooms set');
          NODE

      - name: Remove one-time workflow and commit validated changes
        shell: bash
        run: |
          rm .github/workflows/patch-rooms-schema-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/rooms.ts content/rooms-schema.ts lib/seo-image-registry.ts .github/workflows/patch-rooms-schema-alignment.yml
          git commit -m "Finish rooms schema and image alignment"
          git push origin HEAD:fix/rooms-schema-alignment

name: Vendor Trip Planner Beach Images

on:
  push:
    branches:
      - agent/beach-master-dataset
    paths:
      - .github/workflows/vendor-trip-planner-beach-images.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beach-master-dataset
          fetch-depth: 0

      - name: Download and normalize verified high-resolution Chios.gr beach photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/beaches

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          download_image() {
            local url="$1"
            local output="$2"
            local temp="${output%.jpg}.source.jpg"
            echo "Downloading $url -> $output"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "Mozilla/5.0 (compatible; ChiosTripPlanner/1.0)" \
              "$url" -o "$temp"
            file "$temp"
            bytes=$(wc -c < "$temp")
            if [ "$bytes" -lt 20000 ]; then
              echo "Downloaded image is unexpectedly small: $bytes bytes ($temp)"
              exit 1
            fi

            # Normalize odd/progressive source JPEGs into browser-safe sRGB JPEGs.
            convert "$temp" -auto-orient -strip -colorspace sRGB \
              -sampling-factor 4:2:0 -quality 90 "$output"
            rm -f "$temp"
            file "$output"
          }

          download_image "https://www.chios.gr/images/beaches-pages/elinta/elinta-1.jpg" "public/images/beaches/elinta-beach-chios.jpg"
          download_image "https://www.chios.gr/images/beaches-pages/thgani/tigani-1.jpg" "public/images/beaches/tigani-beach-chios.jpg"
          download_image "https://www.chios.gr/images/beaches-pages/managros/managros-1.jpg" "public/images/beaches/managros-beach-chios.jpg"
          download_image "https://www.chios.gr/images/beaches-pages/limnos/limnos-1.jpg" "public/images/beaches/limnos-volissos-beach-chios.jpg"
          download_image "https://www.chios.gr/images/beaches-pages/agia-markella/agia-markella-1.jpg" "public/images/beaches/agia-markella-beach-chios.jpg"
          download_image "https://www.chios.gr/images/beaches-pages/traxili/traxili-1.jpg" "public/images/beaches/trachili-west-beach-chios.jpg"

      - name: Point Trip Planner to local high-resolution photos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("content/trip-planner/media.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"https://www.chios.gr/images/beaches-pages/thgani/tigani-1.jpg"': '"/images/beaches/tigani-beach-chios.jpg"',
              '"https://www.chios.gr/images/beaches-pages/managros/managros-1.jpg"': '"/images/beaches/managros-beach-chios.jpg"',
              '"https://www.chios.gr/images/beaches-pages/limnos/limnos-1.jpg"': '"/images/beaches/limnos-volissos-beach-chios.jpg"',
              '"https://www.chios.gr/images/beaches-pages/agia-markella/agia-markella-1.jpg"': '"/images/beaches/agia-markella-beach-chios.jpg"',
              '"https://www.chios.gr/images/beaches-pages/traxili/traxili-1.jpg"': '"/images/beaches/trachili-west-beach-chios.jpg"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit local beach photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/beaches content/trip-planner/media.ts
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "normalize high resolution trip planner beach photos"
          git push origin HEAD:agent/beach-master-dataset

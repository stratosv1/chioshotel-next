name: Temporary Booking Core Original URL Check

on:
  push:
    branches: [booking-core-central-source]
    paths: [.github/workflows/tmp-booking-core-original-url-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose booked rows without reference prices
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://script.google.com/macros/s/AKfycbzSK2Y12vl4RZJvbbcxIkzAl4un93fQManKZ96BGyLsp-vv6j9NQboYnwnc6GtUvOBj/exec';
          const url = new URL(base);
          url.searchParams.set('action','bookings');
          url.searchParams.set('_ts', String(Date.now()));
          const response = await fetch(url, { redirect:'follow', headers:{accept:'application/json'} });
          const payload = await response.json();
          const rows = Array.isArray(payload?.data) ? payload.data : [];
          const missing = rows.filter(r => !(Number(r.price) > 0));
          const byRoom = {};
          const byUnit = {};
          for (const r of missing) {
            const rk = String(r.roomId || '');
            const uk = `${r.roomId}:${r.unitId}`;
            byRoom[rk] = (byRoom[rk] || 0) + 1;
            byUnit[uk] = (byUnit[uk] || 0) + 1;
          }
          const dates = missing.map(r => String(r.date || '')).filter(Boolean).sort();
          console.log('BOOKED_ROWS=' + rows.length);
          console.log('MISSING_PRICE=' + missing.length);
          console.log('BY_ROOM=' + JSON.stringify(byRoom));
          console.log('BY_UNIT=' + JSON.stringify(byUnit));
          console.log('MIN_DATE=' + (dates[0] || ''));
          console.log('MAX_DATE=' + (dates.at(-1) || ''));
          console.log('SAMPLE=' + JSON.stringify(missing.slice(0,20).map(r => ({date:r.date,roomId:r.roomId,unitId:r.unitId,bookingTotal:r.bookingTotal,roomChargeTotal:r.roomChargeTotal,reason:r.reason,status:r.status}))));
          NODE

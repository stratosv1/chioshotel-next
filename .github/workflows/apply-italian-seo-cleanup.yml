name: Apply Italian SEO cleanup

on:
  push:
    branches: [fix/italian-seo-language-signals]
    paths:
      - .it-cleanup-trigger

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/italian-seo-language-signals
          fetch-depth: 0

      - name: Apply audited Italian fixes
        run: python3 scripts/apply-italian-seo-cleanup.py

      - name: Diff check
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GSC routing QA
        run: npm run qa:gsc

      - name: SEO intent QA
        run: npm run qa:seo

      - name: Production build
        run: npm run build

      - name: Remove temporary audit tooling and commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .it-cleanup-trigger \
            .it-locate-trigger \
            .italian-audit-locations.txt \
            scripts/apply-italian-seo-cleanup.py \
            .github/workflows/italian-locate.yml \
            .github/workflows/apply-italian-seo-cleanup.yml
          git add -A
          git status --short
          git commit -m "Fix Italian SEO and language signals"
          git push origin HEAD:fix/italian-seo-language-signals

name: AI Room Finder QA

on:
  push:
    branches: [main]
    paths:
      - 'app/ai-assistant/**'
      - 'app/api/ai-assistant/interpret/**'
      - 'app/api/ai-room-finder/**'
      - 'components/ai/RoomFinderProduction.tsx'
      - 'components/ai/room-finder-*.ts'
      - 'components/ai/room-finder-*.tsx'
      - 'components/ai/use-room-finder.ts'
      - 'lib/ai-assistant/room-finder-*.ts'
      - 'scripts/qa-room-finder-flow.cjs'
      - 'scripts/qa-room-finder-mobile-chat.cjs'
      - 'scripts/qa-room-finder-interpreter.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-concierge-qa.yml'
  pull_request:
    paths:
      - 'app/ai-assistant/**'
      - 'app/api/ai-assistant/interpret/**'
      - 'app/api/ai-room-finder/**'
      - 'components/ai/RoomFinderProduction.tsx'
      - 'components/ai/room-finder-*.ts'
      - 'components/ai/room-finder-*.tsx'
      - 'components/ai/use-room-finder.ts'
      - 'lib/ai-assistant/room-finder-*.ts'
      - 'scripts/qa-room-finder-flow.cjs'
      - 'scripts/qa-room-finder-mobile-chat.cjs'
      - 'scripts/qa-room-finder-interpreter.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-concierge-qa.yml'
  workflow_dispatch:
    inputs:
      run_live_ai:
        description: 'Run live OpenAI interpreter regression suite'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ai-room-finder-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-room-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic Room Finder flow QA
        run: npm run qa:room-finder-flow
      - name: Android and iOS chat runtime QA
        run: npm run qa:room-finder-mobile
      - name: Verify the production entry point stays canonical
        run: |
          grep -q 'RoomFinderProduction' app/ai-assistant/page.tsx
          test -f components/ai/RoomFinderProduction.tsx
          test ! -f components/ai/ConversationalRoomSalesEnhanced.tsx

  live-interpreter:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_ai == true
    needs: deterministic-room-finder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Live semantic interpreter regression QA
        env:
          AI_QA_BASE_URL: https://chioshotel.gr
          AI_QA_TIMEOUT_MS: 30000
        run: npm run qa:room-finder-interpreter

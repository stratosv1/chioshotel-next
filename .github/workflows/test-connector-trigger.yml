name: Test connector trigger
on:
  push:
    branches: [fix/german-seo-cleanup]
permissions:
  contents: write
jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo triggered > .connector-action-triggered
          git add .connector-action-triggered
          git commit -m "test: connector action triggered" || exit 0
          git push origin HEAD:fix/german-seo-cleanup

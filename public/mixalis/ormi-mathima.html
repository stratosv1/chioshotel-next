<!doctype html>
<html lang="el" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ορμή: το μάθημα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+Mono:wght@500;700&display=swap">
<style>
/* Το μάθημα της ορμής: μία διαφάνεια τη φορά. Κείμενο καθηγητή, ζωντανός «πάγκος» με κινούμενο σχέδιο και χειριστήρια, κάρτες εξήγησης. */
:root {
  --bg: #f4f1ea; --paper: #fffdf8; --ink: #1d2433; --muted: #5d6475; --line: #ddd6c8; --soft: #f8f5ee;
  --accent: #c9822f; --accent2: #8a5a1c; --teal: #1f6f5c;
  --v: #1f6fd1; --F: #d9342b; --p: #1f9d55; --K: #d9821c; --Q: #e2571e;
  --b1: #7b5ea7; --b2: #e0a526; --b3: #4f8a83; --bench: #f7f4ec; --grid: #e7e1d4; --ok: #1f9d55; --bad: #c0392b;
  --display: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.62;
  padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wrap { width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 12px; }
.topline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--accent2); letter-spacing: .02em; }
.brand span { color: var(--muted); font-weight: 500; }
.counter { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.secs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.secs button { all: unset; cursor: pointer; flex: 1 0 auto; min-width: 74px; display: flex; flex-direction: column; gap: 5px;
  font-family: var(--display); font-size: 12.5px; font-weight: 700; color: var(--muted); }
.secs button .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.secs button .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.secs button[aria-current="true"] { color: var(--ink); }
.secs button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.slide { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 26px 30px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 560px; }
.kicker { font-family: var(--display); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.14; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: clamp(30px, 4.4vw, 48px); }
h2 { font-size: clamp(23px, 3vw, 33px); }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.lead { font-size: 18.5px; max-width: 46em; }
.lead + .lead { margin-top: -6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 16px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { font-size: 16px; }
.card.tip { border-left: 5px solid var(--teal); }
.card.trap { border-left: 5px solid var(--F); }
.card.trap h3 { color: var(--F); }
.card.key { border-left: 5px solid var(--accent); }
.card ul, .card ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 5px; }
.formula { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 18px; font-weight: 700; padding: 8px 16px; border-radius: 12px; border: 2px solid var(--accent); color: var(--accent2); background: #fff; align-self: flex-start; }
.formula.big { font-size: 24px; padding: 12px 22px; }
.m { font-family: var(--mono); font-weight: 500; font-size: .94em; white-space: nowrap; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 2px; }
.fr > span:last-child { border-top: 1.6px solid currentColor; padding-top: 1px; }
.c-v { color: var(--v); font-weight: 700; } .c-F { color: var(--F); font-weight: 700; } .c-p { color: var(--p); font-weight: 700; } .c-K { color: var(--K); font-weight: 700; } .c-a { color: var(--accent2); font-weight: 700; }
.bench { background: var(--bench); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.cv { display: block; width: 100%; height: auto; touch-action: manipulation; }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); background: #fbf9f3; font-family: var(--display); font-size: 14px; }
.ctrl { display: flex; align-items: center; gap: 8px; min-width: 250px; flex: 1 1 260px; }
.ctrl label { flex-shrink: 0; }
.ctrl label { font-weight: 700; white-space: nowrap; }
.ctrl input[type=range] { flex: 1; accent-color: var(--accent); min-width: 80px; }
.ctrl output { font-family: var(--mono); font-size: 13.5px; min-width: 70px; text-align: right; flex-shrink: 0; }
.vec { position: relative; display: inline-block; }
.vec::after { content: "→"; position: absolute; left: 0; right: 0; top: -0.72em; font-size: 0.6em; text-align: center; line-height: 1; font-weight: 700; }
.btn { all: unset; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { background: var(--accent2); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.motion { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; padding: 8px 12px 0; font-family: var(--display); font-size: 13px; }
.motion .mbtn { padding: 4px 11px; font-size: 13px; }
.motion .mlbl { color: var(--muted); font-weight: 700; margin-left: 6px; }
.readout { font-family: var(--mono); font-size: 14px; padding: 10px 16px; border-top: 1px dashed var(--line); background: #fff; line-height: 1.7; }
.readout b { font-weight: 700; }
.steps-reveal { display: flex; flex-direction: column; gap: 8px; }
.steps-reveal .st { display: none; padding: 9px 12px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
.steps-reveal .st.on { display: block; animation: pop .35s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.quiz { display: flex; flex-direction: column; gap: 14px; }
.qitem { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.qitem .qtext { font-weight: 600; }
.qopts { display: grid; gap: 7px; }
.qopts button { all: unset; cursor: pointer; padding: 9px 13px; border-radius: 11px; background: #fff; border: 1.5px solid var(--line); font-size: 16px; }
.qopts button:hover { border-color: var(--accent); }
.qopts button.right { border-color: var(--ok); background: #e9f7ef; }
.qopts button.wrong { border-color: var(--bad); background: #fbecea; }
.qfb { display: none; font-size: 15.5px; padding: 9px 12px; border-radius: 11px; background: #fff; border-left: 4px solid var(--teal); }
.qfb.on { display: block; animation: pop .3s ease; }
.score { font-family: var(--display); font-weight: 700; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; background: #fff; border-radius: 12px; overflow: hidden; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: middle; }
table.t th { font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--soft); }
.acc { border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: hidden; }
.acc + .acc { margin-top: 8px; }
.acc > button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: baseline; width: 100%; box-sizing: border-box; padding: 11px 14px; font-family: var(--display); font-weight: 700; font-size: 15.5px; }
.acc > button .n { color: var(--accent); min-width: 2.2em; }
.acc > button .chev { margin-left: auto; color: var(--muted); }
.acc > .body { display: none; padding: 4px 16px 14px; border-top: 1px dashed var(--line); font-size: 16px; }
.acc.open > .body { display: flex; flex-direction: column; gap: 10px; }
.mapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.mapgrid button { all: unset; cursor: pointer; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.mapgrid button:hover { border-color: var(--accent); background: #fff; }
.mapgrid b { font-family: var(--display); color: var(--accent2); }
.mapgrid span { font-size: 14.5px; color: var(--muted); }
.navbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.navbar .btn { padding: 10px 20px; font-size: 15px; }
.hint { font-family: var(--display); font-size: 13px; color: var(--muted); text-align: center; }
.tag { display: inline-block; font-family: var(--display); font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #efe7da; color: var(--accent2); }
.pill-ok { color: var(--ok); font-weight: 700; } .pill-bad { color: var(--bad); font-weight: 700; }
.sysbox { display: flex; flex-wrap: wrap; gap: 8px; }
.sysbox label { display: inline-flex; gap: 6px; align-items: center; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; font-family: var(--display); font-weight: 700; cursor: pointer; }
html, body { overflow-x: hidden; }
.tscroll { overflow-x: auto; max-width: 100%; }
.cvwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.rotate-tip { display: none; }
@media (max-width: 640px) and (orientation: portrait) {
  .cv { min-width: 620px; }
  .rotate-tip { display: block; font-family: var(--display); font-size: 12.5px; color: var(--muted); padding: 6px 12px 0; }
}
@media (max-width: 640px) {
  .hint { display: none; }
  table.t { font-size: 13.5px; }
  table.t th, table.t td { padding: 6px 6px; }
  body { padding: 10px; font-size: 16px; }
  .slide { padding: 18px 16px; border-radius: 16px; min-height: 0; }
  .lead { font-size: 17px; }
  .formula.big { font-size: 19px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div class="brand">Ορμή <span>· Κεφάλαιο 2 σχολικού βιβλίου · Φυσική Προσανατολισμού Β΄ Λυκείου</span></div>
    <div class="counter" id="counter"></div>
  </div>
  <nav class="secs" id="secs" aria-label="Ενότητες"></nav>
  <main class="slide" id="slide" aria-live="polite"></main>
  <div class="navbar">
    <button class="btn" id="prev">← Πίσω</button>
    <span class="hint">Βελάκια ← → του πληκτρολογίου για αλλαγή διαφάνειας</span>
    <button class="btn pri" id="next">Επόμενο →</button>
  </div>
</div>
<script>
"use strict";
/* ============ ΕΡΓΑΛΕΙΑ ============ */
const COL = { v: "#1f6fd1", F: "#d9342b", p: "#1f9d55", K: "#d9821c", Q: "#e2571e", ink: "#1d2433", mute: "#5d6475", line: "#ddd6c8",
  grid: "#e7e1d4", b1: "#7b5ea7", b2: "#e0a526", b3: "#4f8a83", ground: "#b9a98f", wall: "#8b7d6b", acc: "#c9822f", white: "#ffffff" };
const SL = [];
let SCOPE = [];
const onCleanup = (fn) => SCOPE.push(fn);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function fmt(x, d = 2) {
  if (!isFinite(x)) return "—";
  const r = Math.round(x * Math.pow(10, d)) / Math.pow(10, d);
  let s = r.toFixed(d);
  if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  if (s === "-0") s = "0";
  return s.replace("-", "−").replace(".", ",");
}
function sgn(x, d = 2) { return (x > 0 ? "+" : "") + fmt(x, d); }
function el(tag, attrs = {}, html = "") {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  if (html) e.innerHTML = html;
  return e;
}
const frac = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const vec = (s) => `<span class="vec">${s}</span>`; // βελάκι διανύσματος πάνω από το γράμμα

/* Μέγεθος σώματος από τη μάζα του: ίσες μάζες = ίσα σώματα, βαρύτερο = μεγαλύτερο (σε όλο το μάθημα). */
const bodySize = (m) => ({ w: Math.round(34 + 30 * Math.sqrt(m)), h: Math.round(18 + 10 * Math.sqrt(m)) });

/* Παύση και αργή κίνηση: κοινές για όλα τα σχέδια (κουμπιά πάνω από κάθε κινούμενο σχέδιο, ή το πλήκτρο Space). */
const MOTION = { paused: false, speed: 1 };
let LAST_HOST = null;
function motionBar(host) {
  if (!host || host.querySelector(":scope > .motion")) return;
  const bar = el("div", { class: "motion", role: "group", "aria-label": "Έλεγχος κίνησης" });
  const pb = el("button", { type: "button", class: "btn mbtn" });
  pb.addEventListener("click", () => { MOTION.paused = !MOTION.paused; syncMotion(); });
  bar.appendChild(pb);
  bar.appendChild(el("span", { class: "mlbl" }, "Ταχύτητα:"));
  [[1, "1×"], [0.5, "½×"], [0.25, "¼×"]].forEach(([v, l]) => {
    const b = el("button", { type: "button", class: "btn mbtn", "data-speed": String(v) }, l);
    b.addEventListener("click", () => { MOTION.speed = v; MOTION.paused = false; syncMotion(); });
    bar.appendChild(b);
  });
  host.insertBefore(bar, host.firstChild); syncMotion();
  bar.insertAdjacentElement("afterend", el("div", { class: "rotate-tip" }, "📱 Γύρνα το κινητό οριζόντια για μεγαλύτερο σχέδιο, ή σύρε το σχέδιο δεξιά–αριστερά."));
}
function syncMotion() {
  document.querySelectorAll(".motion").forEach((bar) => {
    const pb = bar.querySelector(".mbtn"); pb.textContent = MOTION.paused ? "▶ Συνέχεια" : "❚❚ Παύση"; pb.classList.toggle("pri", MOTION.paused);
    bar.querySelectorAll("[data-speed]").forEach((b) => b.setAttribute("aria-pressed", String(parseFloat(b.dataset.speed) === MOTION.speed)));
  });
}
/* Βρόχος κίνησης που σταματά μόνος του όταν φεύγεις από τη διαφάνεια. Σέβεται την παύση και την ταχύτητα. */
function animate(step) {
  let alive = true, last = performance.now();
  motionBar(LAST_HOST);
  function f(t) { if (!alive) return; const raw = Math.min(0.05, (t - last) / 1000); last = t; step(MOTION.paused ? 0 : raw * MOTION.speed, t / 1000); requestAnimationFrame(f); }
  requestAnimationFrame(f);
  onCleanup(() => (alive = false));
}

/* Καμβάς με λογικές διαστάσεις W×H που κλιμακώνεται στο πλάτος της οθόνης. */
function canvas(host, W = 900, H = 320) {
  const cv = el("canvas", { class: "cv", role: "img" });
  cv.style.aspectRatio = `${W} / ${H}`;
  const wrap = el("div", { class: "cvwrap" }); wrap.appendChild(cv); host.appendChild(wrap); LAST_HOST = host;
  const ctx = cv.getContext("2d");
  const g = { cv, ctx, W, H, redraw: null };
  /* Αλλάζει το μέγεθος μόνο όταν χρειάζεται (η αλλαγή σβήνει τον καμβά) και ξανασχεδιάζει τα στατικά σχέδια. */
  function fit() {
    const w = cv.clientWidth || W, dpr = window.devicePixelRatio || 1, nw = Math.round(w * dpr), nh = Math.round((w * H / W) * dpr);
    if (cv.width === nw && cv.height === nh) return;
    cv.width = nw; cv.height = nh;
    ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0);
    if (g.redraw) g.redraw();
  }
  fit();
  const ro = new ResizeObserver(fit); ro.observe(cv); onCleanup(() => ro.disconnect());
  g.clear = () => { ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0); ctx.clearRect(0, 0, W, H); };
  g.pos = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * W / r.width }; };
  return g;
}
function txt(ctx, s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 600} ${o.size || 15}px ${o.mono ? '"Noto Sans Mono", monospace' : 'Commissioner, system-ui, sans-serif'}`;
  ctx.fillStyle = o.color || COL.ink; ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "middle";
  const size = o.size || 15, family = o.mono ? '"Noto Sans Mono", monospace' : 'Commissioner, system-ui, sans-serif';
  const bigF = `${o.weight || 600} ${size}px ${family}`, subF = `${o.weight || 600} ${Math.round(size * 0.72)}px ${family}`;
  // «_xyz» = δείκτης: χωρίζω το κείμενο σε κανονικά κομμάτια και δείκτες
  const parts = String(s).split(/(_[^\s=+·,:()/]+)/).filter((q) => q !== "").map((q) => (q[0] === "_" ? { t: q.slice(1), sub: true } : { t: q, sub: false }));
  const widths = parts.map((q) => { ctx.font = q.sub ? subF : bigF; return ctx.measureText(q.t).width; });
  const w = widths.reduce((a, b) => a + b, 0);
  const x0 = o.align === "center" ? x - w / 2 : o.align === "right" ? x - w : x;
  if (o.bg) { const h = size + 8; ctx.fillStyle = o.bg; roundRect(ctx, x0 - 5, y - h / 2, w + 10, h, 6); ctx.fill(); }
  ctx.fillStyle = o.color || COL.ink; ctx.textAlign = "left";
  let cx = x0;
  parts.forEach((q, i) => { ctx.font = q.sub ? subF : bigF; ctx.fillText(q.t, cx, q.sub ? y + size * 0.28 : y); cx += widths[i]; });
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* Βέλος από (x1,y1) σε (x2,y2). Αν το μήκος είναι σχεδόν μηδέν δεν σχεδιάζεται. */
function arrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  if (L < 2) return;
  const w = o.w || 4, hd = Math.min(o.head || 13, L * 0.6), ux = dx / L, uy = dy / L;
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hd * 0.8, y2 - uy * hd * 0.8); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hd - uy * hd * 0.5, y2 - uy * hd + ux * hd * 0.5);
  ctx.lineTo(x2 - ux * hd + uy * hd * 0.5, y2 - uy * hd - ux * hd * 0.5); ctx.closePath(); ctx.fill();
  if (o.label) {
    const lx = o.lx !== undefined ? o.lx : (x1 + x2) / 2 + (o.ox || 0), ly = o.ly !== undefined ? o.ly : (y1 + y2) / 2 + (o.oy !== undefined ? o.oy : -15);
    txt(ctx, o.label, lx, ly, { color, size: o.size || 15, weight: 700, align: "center", bg: o.bg === false ? null : "rgba(255,253,248,.88)" });
  }
  ctx.restore();
}
function ground(ctx, y, x0 = 0, x1 = 900, o = {}) {
  ctx.save(); ctx.strokeStyle = o.color || COL.ground; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.lineWidth = 1.4; ctx.strokeStyle = o.hatch || "#d6cbb7";

  const V = (m1 * u1 + m2 * u2) / (m1 + m2);
  return [V - (e * m2 * (u1 - u2)) / (m1 + m2), V + (e * m1 * (u1 - u2)) / (m1 + m2)];
}

/* ============ ΠΛΟΗΓΗΣΗ ============ */
const root = document.getElementById("slide"), secsEl = document.getElementById("secs"), counter = document.getElementById("counter");
let cur = 0;
const secBtns = SECS.map((s) => {
  const bt = el("button", { type: "button" }, `<span class="bar"><i></i></span><span>${s.name}</span>`);
  bt.addEventListener("click", () => goSec(s.id)); secsEl.appendChild(bt); return bt;
});
function goSec(id) { const i = SL.findIndex((s) => s.sec === id); if (i >= 0) show(i, true); }
function show(i, scroll) {
  cur = clamp(i, 0, SL.length - 1);
  SCOPE.forEach((f) => { try { f(); } catch (e) {} }); SCOPE = []; MOTION.paused = false; LAST_HOST = null;
  root.innerHTML = "";
  try { SL[cur].build(root); } catch (e) { root.innerHTML = `<p>Σφάλμα στη διαφάνεια: ${e.message}</p>`; console.error(e); }
  counter.textContent = `Διαφάνεια ${cur + 1} / ${SL.length} · ${SL[cur].title}`;
  SECS.forEach((s, k) => {
    const idx = SL.map((x, j) => [x, j]).filter(([x]) => x.sec === s.id).map(([, j]) => j);
    const done = idx.filter((j) => j <= cur).length, frac = idx.length ? done / idx.length : 0;
    secBtns[k].querySelector("i").style.width = (frac * 100).toFixed(0) + "%";
    secBtns[k].setAttribute("aria-current", String(SL[cur].sec === s.id));
  });
  document.getElementById("prev").disabled = cur === 0; document.getElementById("prev").style.opacity = cur === 0 ? 0.4 : 1;
  const nx = document.getElementById("next"); nx.textContent = cur === SL.length - 1 ? "Τέλος ✓" : "Επόμενο →";
  try { history.replaceState(null, "", "#d" + (cur + 1)); } catch (e) {}
  try { localStorage.setItem("ormi-mathima-slide", String(cur)); } catch (e) {}
  postHeight();
  setTimeout(postHeight, 300);
  if (scroll) {
    if (window.parent !== window) { try { parent.postMessage({ type: "ormi-mathima-top" }, "*"); } catch (e) {} }
    else window.scrollTo({ top: 0, behavior: "smooth" });
  }
}
document.getElementById("prev").addEventListener("click", () => show(cur - 1, true));
document.getElementById("next").addEventListener("click", () => show(cur + 1, true));
document.addEventListener("keydown", (e) => {
  if (e.key === " " && !(e.target && /INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))) { e.preventDefault(); MOTION.paused = !MOTION.paused; syncMotion(); return; }
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== "range") return;
  if (e.key === "ArrowRight" && !(e.target && e.target.type === "range")) show(cur + 1, true);
  if (e.key === "ArrowLeft" && !(e.target && e.target.type === "range")) show(cur - 1, true);
});
window.addEventListener("message", (e) => { if (e.data === "ormi-mathima-ping") postHeight(); });
window.addEventListener("resize", postHeight);
new ResizeObserver(postHeight).observe(document.body);
let start = 0;
const hm = /^#d(\d+)$/.exec(location.hash || "");
if (hm) start = parseInt(hm[1], 10) - 1; else { try { const v = parseInt(localStorage.getItem("ormi-mathima-slide") || "0", 10); if (v >= 0) start = v; } catch (e) {} }
show(isFinite(start) ? start : 0, false);
</script>

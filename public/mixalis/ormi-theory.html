<!doctype html>
<html lang="el" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ορμή και κρούσεις: η θεωρία</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+Mono:wght@500&display=swap">
<style>
/* One slide at a time: text column beside a live canvas "bench" with optional controls; stacks on phones. */
:root {
  --bg: #f4f1ea; --paper: #fffdf8; --ink: #1d2433; --muted: #5d6475; --line: #ddd6c8;
  --accent: #1f6f5c; --v: #1f6fd1; --F: #d9342b; --p: #1f9d55; --K: #d9821c; --Q: #e2571e;
  --b1: #9fb3c8; --b2: #f2c46d; --wood: #c8a27a; --edge: #4a5568;
  --bench: #f7f4ec; --grid: #e7e1d4; --ok: #1f9d55; --bad: #c0392b;
  --display: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --paper: #1a1f2a; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2c3343; --accent: #5fd0ae;
    --v: #6aa6ff; --F: #ff7a6e; --p: #45cf8c; --K: #f3a64a; --Q: #ff8a5c; --b1: #5d7187; --b2: #b8914a; --wood: #9b7a57; --edge: #c9d1df;
    --bench: #151a24; --grid: #222a38; --ok: #45cf8c; --bad: #ff7a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --paper: #1a1f2a; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2c3343; --accent: #5fd0ae;
  --v: #6aa6ff; --F: #ff7a6e; --p: #45cf8c; --K: #f3a64a; --Q: #ff8a5c; --b1: #5d7187; --b2: #b8914a; --wood: #9b7a57; --edge: #c9d1df;
  --bench: #151a24; --grid: #222a38; --ok: #45cf8c; --bad: #ff7a6e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.top { width: 100%; max-width: 1160px; display: flex; flex-direction: column; gap: 10px; }
.topline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; letter-spacing: 0.02em; font-size: 15px; color: var(--accent); }
.brand span { color: var(--muted); font-weight: 500; }
.counter { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chapters button {
  all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0;
  font-family: var(--display); font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.chapters button .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.chapters button .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s; }
.chapters button[aria-current="true"] { color: var(--ink); }
.chapters button .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapters button:focus-visible { outline: 3px solid var(--K); outline-offset: 3px; border-radius: 4px; }
.stage {
  width: 100%; max-width: 1160px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); min-height: 580px; overflow: hidden;
}
.text { padding: 32px 32px 26px; display: flex; flex-direction: column; gap: 13px; min-width: 0; }
.kicker { font-family: var(--display); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 4.2vw, 46px); }
h2 { font-size: clamp(23px, 2.8vw, 32px); }
.text p { margin: 0; max-width: 35em; }
.text p.lead { font-size: 19px; }
.formula {
  align-self: flex-start; font-family: var(--mono); font-size: 17px; padding: 7px 14px; border-radius: 10px;
  border: 1.5px solid var(--accent); color: var(--accent);
}
.note { font-size: 15px; color: var(--muted); border-left: 3px solid var(--K); padding-left: 12px; }
.trap { font-size: 15px; border-left: 3px solid var(--F); padding-left: 12px; }
.trap b:first-child { color: var(--F); font-family: var(--display); }
.q { font-family: var(--display); font-weight: 700; color: var(--K); }
.vec { position: relative; display: inline-block; }
.vec::after { content: "→"; position: absolute; left: 0; right: 0; top: -0.78em; font-size: 0.62em; text-align: center; line-height: 1; }
.formula .vec::after { top: -0.62em; }
.c-v { color: var(--v); font-weight: 600; } .c-F { color: var(--F); font-weight: 600; } .c-p { color: var(--p); font-weight: 600; } .c-K { color: var(--K); font-weight: 600; }
ol.steps, ul.recap { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 7px; }
.bench { background: var(--bench); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.cwrap { position: relative; flex: 1; min-height: 360px; }
.cwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption { font-family: var(--display); font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 40px; }
.caption:empty { display: none; }
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; border-top: 1px solid var(--line); font-family: var(--display); }
.mbar span { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 6px; }
.mbar button { font-family: var(--display); font-weight: 700; font-size: 13.5px; border-radius: 999px; padding: 6px 13px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.mbar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mbar button.pause { border-color: var(--accent); color: var(--accent); min-width: 108px; }
.mbar button.pause[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.mbar button:focus-visible { outline: 3px solid var(--K); outline-offset: 2px; }
.knobs { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 10px; font-family: var(--display); }
.knobs[hidden], .mbar[hidden] { display: none; }
.knob { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; font-size: 14px; }
.knob label { font-weight: 700; color: var(--ink); }
.knob output { font-family: var(--mono); font-size: 14px; color: var(--accent); }
.knob input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13px; font-weight: 700; color: var(--muted); align-self: center; margin-right: 4px; }
.chips button, .replay {
  font-family: var(--display); font-weight: 700; font-size: 13.5px; border-radius: 999px; padding: 6px 13px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips button:focus-visible, .replay:focus-visible, .opt:focus-visible { outline: 3px solid var(--K); outline-offset: 2px; }
/* quiz */
.quiz { display: flex; flex-direction: column; gap: 10px; }
.quiz .qhead { font-family: var(--display); font-size: 13px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }
.quiz .qtext { font-size: 18px; font-weight: 600; }
.opt {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; width: 100%;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 16px; line-height: 1.45; background: var(--paper);
}
.opt .lt { font-family: var(--display); font-weight: 800; color: var(--muted); min-width: 1.2em; }
.opt:hover { border-color: var(--accent); }
.opt[data-state="right"] { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--paper)); }
.opt[data-state="wrong"] { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--paper)); }
.opt[disabled] { cursor: default; }
.explain { font-size: 15px; border-radius: 12px; padding: 10px 14px; background: var(--bench); border: 1px solid var(--line); }
.explain b { font-family: var(--display); }
.qnav { display: flex; gap: 8px; flex-wrap: wrap; }
.qnav button { font-family: var(--display); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 7px 16px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--paper); }
.qnav button.ghost { background: transparent; color: var(--accent); }
.controls { width: 100%; max-width: 1160px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.controls > button {
  font-family: var(--display); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 10px 20px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.controls > button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.controls > button:disabled { opacity: 0.4; cursor: default; }
.controls > button:focus-visible, .dots button:focus-visible { outline: 3px solid var(--K); outline-offset: 2px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: none; background: var(--line); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--accent); width: 24px; border-radius: 6px; }
.dots button.quizdot { background: color-mix(in srgb, var(--K) 55%, var(--line)); }
.dots button.quizdot[aria-current="true"] { background: var(--K); }
@media (max-width: 860px) {
  .dots { order: 3; flex-basis: 100%; }
  .controls { justify-content: space-between; }
  .stage { grid-template-columns: 1fr; min-height: 0; }
  .text { padding: 22px 20px 18px; }
  .bench { border-left: none; border-top: 1px solid var(--line); }
  .cwrap { flex: none; height: 64vw; min-height: 270px; max-height: 430px; }
  body { font-size: 16px; }
  .text p.lead { font-size: 17px; }
  .controls > button { padding: 9px 14px; }
  .chapters button { font-size: 11px; }
}
@media (max-width: 480px) { .chapters button .lbl .long { display: none; } }
</style>
</head>
<body>

<div class="top">
  <div class="topline">
    <div class="brand">Ορμή και κρούσεις <span>· η θεωρία, βήμα βήμα</span></div>
    <div class="counter" id="counter" aria-live="polite">1 / 1</div>
  </div>
  <nav class="chapters" id="chapters" aria-label="Κεφάλαια"></nav>
</div>

<main class="stage" id="stage">
  <section class="text" id="text"></section>
  <div class="bench">
    <div class="caption" id="caption"></div>
    <div class="cwrap"><canvas id="cv" aria-label="Κινούμενο σχέδιο της διαφάνειας"></canvas></div>
    <div class="mbar" id="mbar"><button type="button" class="pause" id="mpause" aria-pressed="false">❚❚ Παύση</button><span>Ταχύτητα:</span><button type="button" data-sp="1" aria-pressed="true">1×</button><button type="button" data-sp="0.5" aria-pressed="false">½×</button><button type="button" data-sp="0.25" aria-pressed="false">¼×</button></div>
    <div class="knobs" id="knobs" hidden></div>
  </div>
</main>

<nav class="controls" aria-label="Πλοήγηση διαφανειών">
  <button id="prev" type="button">← Πίσω</button>
  <div class="dots" id="dots"></div>
  <button id="next" type="button" class="primary">Επόμενο →</button>
</nav>

<script>
/* ═══════════════════════════ CONTENT ═══════════════════════════ */
const CHAPTERS = [
  { id: "A", name: "Α. Ορμή", long: "Τι είναι η ορμή" },
  { id: "B", name: "Β. Δύναμη", long: "Δύναμη και μεταβολή ορμής" },
  { id: "C", name: "Γ. ΑΔΟ", long: "Αρχή διατήρησης της ορμής" },
  { id: "D", name: "Δ. Κρούσεις", long: "Κρούσεις και ενέργεια" },
];

const SLIDES = [
  /* ─────────────── Α. ΟΡΜΗ ─────────────── */
  { ch: "A", kicker: "Ξεκινάμε", title: "Ορμή και κρούσεις", h1: true, scene: "hook", caption: "Μια μπάλα σταματά, η άλλη φεύγει. Γιατί;", html: `
    <p class="lead">Στο μπιλιάρδο η λευκή μπάλα χτυπά κατευθείαν την κόκκινη και σταματά επιτόπου, ενώ η κόκκινη ξεκινά με την ταχύτητα που είχε η λευκή.</p>
    <p>Είναι σαν κάτι να μεταφέρθηκε από τη μία μπάλα στην άλλη. Αυτό το μέγεθος το λέμε <b>ορμή</b>. Σε αυτή την παρουσίαση θα δούμε τι είναι η ορμή, πώς μεταβάλλεται και γιατί σε κάθε κρούση η ολική ορμή μένει ίδια.</p>
    <p class="note">Για να προχωρήσεις, πάτα «Επόμενο», τα βέλη του πληκτρολογίου ή σύρε το δάχτυλο στην οθόνη. Όπου υπάρχουν κουμπιά και μπάρες, άλλαξε τις τιμές και παρατήρησε τι γίνεται. Με το «Παύση» σταματάς την κίνηση για να τη μελετήσεις.</p>` },

  { ch: "A", kicker: "Η ερώτηση", title: "Ποιο σώμα σταματά πιο δύσκολα;", scene: "stopit", caption: "Παίζουν ρόλο και η μάζα και η ταχύτητα", html: `
    <p class="lead">Ποιο σταματάς πιο δύσκολα: ένα φορτηγό που κινείται αργά ή μια μπάλα που έρχεται γρήγορα; Ένα πλοίο που μπαίνει στο λιμάνι ή μια σφαίρα όπλου;</p>
    <p>Ήδη από τον 17ο αιώνα οι επιστήμονες κατέληξαν ότι το πόσο δύσκολα σταματά ένα σώμα εξαρτάται <b>και από τη μάζα και από την ταχύτητά του</b>.</p>
    <p>Δες το σχέδιο: η μπάλα ποδοσφαίρου και η σφαίρα έχουν σχεδόν την ίδια ορμή! Ένα πετρελαιοφόρο που κινείται μόλις με 16 km/h έχει ορμή εκατοντάδες εκατομμύρια φορές μεγαλύτερη.</p>
    <p class="note"><span class="q">Σκέψου:</span> αφού έχουν την ίδια ορμή, γιατί η σφαίρα τραυματίζει και η μπάλα όχι; (Θα το δούμε στη διαφάνεια για την κινητική ενέργεια.)</p>` },

  { ch: "A", kicker: "Ο ορισμός", title: "Ορμή = μάζα × ταχύτητα", scene: "define", caption: "Άλλαξε τη μάζα και την ταχύτητα: το πράσινο βέλος είναι η ορμή",
    knobs: [{ id: "m", label: "μάζα m", min: 0.5, max: 8, step: 0.5, value: 4, unit: "kg" }, { id: "v", label: "ταχύτητα υ", min: -8, max: 8, step: 0.5, value: 4, unit: "m/s" }], html: `
    <div class="formula"><span class='vec'>p</span> = m · <span class='vec'>υ</span></div>
    <p class="lead">Η ορμή είναι <b>διάνυσμα</b>: έχει την ίδια κατεύθυνση με την ταχύτητα.</p>
    <p>Μονάδα στο S.I.: <b>1 kg·m/s</b>. Ισοδύναμα <b>1 N·s</b>, γιατί 1 N = 1 kg·m/s².</p>
    <p>Στις ασκήσεις ορίζουμε πρώτα <b>θετική φορά</b> (εδώ προς τα δεξιά). Μια ορμή με την αντίθετη φορά τη γράφουμε με «−».</p>
    <p class="note">Μετακίνησε τις μπάρες: αν διπλασιάσεις τη μάζα, διπλασιάζεται και η ορμή. Αν η ταχύτητα γίνει αρνητική, το βέλος της ορμής αλλάζει φορά.</p>` },

  { ch: "A", kicker: "Πολλά σώματα", title: "Η ορμή του συστήματος: προσθέτουμε τις ορμές με πρόσημο (+ ή −), ανάλογα με τη φορά", scene: "system", caption: "Δύο πατινέρ, 80 kg και 60 kg, με 5 m/s",
    chips: [{ id: "mode", label: "Κινούνται:", options: [["same", "ίδια φορά"], ["opp", "αντίθετη φορά"], ["perp", "κάθετα"]], value: "same" }], html: `
    <p class="lead">Η ορμή ενός συστήματος είναι το <b>διανυσματικό άθροισμα</b> των ορμών των σωμάτων του.</p>
    <div class="formula"><span class='vec'>p</span>ολ = <span class='vec'>p</span>₁ + <span class='vec'>p</span>₂ + …</div>
    <p>Δύο πατινέρ (80 kg και 60 kg) κινούνται και οι δύο με 5 m/s, άρα έχουν ορμές 400 και 300 kg·m/s. Η ολική ορμή όμως εξαρτάται από τις κατευθύνσεις τους:</p>
    <p>με την ίδια φορά: <b>700</b> · με αντίθετη φορά: <b>100</b> · σε κάθετες διευθύνσεις: <b>500</b> kg·m/s (από το Πυθαγόρειο θεώρημα: √(400² + 300²)).</p>
    <p class="note">Είναι λυμένη άσκηση του Σαββάλα. Πάτα τα κουμπιά κάτω από το σχέδιο.</p>` },

  /* ─────────────── Β. ΔΥΝΑΜΗ ─────────────── */
  { ch: "B", kicker: "Αλλαγή", title: "Η μεταβολή της ορμής Δp", scene: "dp", caption: "Μπάλα 0,1 kg χτυπά κάθετα τον τοίχο με 20 m/s",
    knobs: [{ id: "vb", label: "ταχύτητα επιστροφής υ′", min: 0, max: 20, step: 1, value: 12, unit: "m/s" }], html: `
    <div class="formula">Δ<span class='vec'>p</span> = <span class='vec'>p</span>τελ − <span class='vec'>p</span>αρχ</div>
    <p class="lead">Η τελική ορμή μείον την αρχική, <b>με τα πρόσημά τους</b>.</p>
    <p>Η μπάλα φτάνει με +20 m/s (p = +2 kg·m/s) και επιστρέφει με 12 m/s (p′ = −1,2 kg·m/s). Άρα Δp = −1,2 − 2 = <b>−3,2 kg·m/s</b>.</p>
    <p>Επειδή η μπάλα άλλαξε φορά, τα μέτρα <b>προστίθενται</b>: |Δp| = m(υ + υ′). Αν σταματήσει στον τοίχο (υ′ = 0): |Δp| = mυ. Αν επιστρέψει με ταχύτητα ίδιου μέτρου: |Δp| = 2mυ.</p>
    <p class="trap"><b>Παγίδα:</b> το πιο συχνό λάθος είναι να γράψεις 1,2 − 2 = −0,8, δηλαδή να ξεχάσεις το «−» της ορμής επιστροφής.</p>` },

  { ch: "B", kicker: "Ο νόμος", title: "Δύναμη = ρυθμός μεταβολής της ορμής", scene: "kick", caption: "Κλωτσιά: μπάλα 0,425 kg, 23 m/s, χρόνος επαφής 0,008 s", html: `
    <p class="lead">Ξεκινάμε από τον θεμελιώδη νόμο της Μηχανικής (2ο νόμο του Νεύτωνα) και τον ορισμό της επιτάχυνσης:</p>
    <p>ΣF = m·α και α = (υτελ − υαρχ)/Δt ⇒ ΣF = (mυτελ − mυαρχ)/Δt</p>
    <div class="formula">Σ<span class='vec'>F</span> = Δ<span class='vec'>p</span> / Δt</div>
    <p>Αυτή είναι η <b>γενικότερη διατύπωση του 2ου νόμου</b>: για να μεταβληθεί η ορμή ενός σώματος, πρέπει να ασκείται σε αυτό συνισταμένη δύναμη.</p>
    <p>Η δύναμη έχει την κατεύθυνση της <b>Δp</b>, όχι απαραίτητα της κίνησης: στην <b>κλωτσιά</b> έχει τη φορά της κίνησης, όταν το σώμα <b>φρενάρει</b> έχει αντίθετη φορά από την κίνηση, και στην <b>αναπήδηση</b> έχει τη φορά της νέας κίνησης.</p>
    <p>Στο λυμένο παράδειγμα του σχολικού βιβλίου: F = 0,425·23 / 0,008 ≈ <b>1220 N</b>, σχεδόν διπλάσια από το βάρος του ποδοσφαιριστή (≈ 690 N)!</p>
    <p class="note">Όταν το Δt είναι μεγάλο, το Δp/Δt δίνει τη <b>μέση</b> δύναμη. Όταν το Δt είναι πολύ μικρό, δίνει τη δύναμη εκείνης της στιγμής, δηλαδή τον <b>στιγμιαίο</b> ρυθμό μεταβολής της ορμής.</p>` },

  { ch: "B", kicker: "Εργαστήριο", title: "Γιατί ένα μαλακό στρώμα μάς προστατεύει", scene: "cushion", caption: "Αυγό 60 g φτάνει με 5 m/s και σταματά",
    knobs: [{ id: "dt", label: "χρόνος που διαρκεί το σταμάτημα Δt", min: 0.004, max: 0.2, step: 0.002, value: 0.01, unit: "s" }], html: `
    <p class="lead">Όπου κι αν πέσει, το αυγό τελικά σταματά, άρα η μεταβολή της ορμής του είναι πάντα ίδια: |Δp| = 0,06·5 = 0,3 kg·m/s. Αυτό που αλλάζει είναι ο <b>χρόνος</b> μέσα στον οποίο σταματά.</p>
    <div class="formula">F = Δp / Δt</div>
    <p>Μετακίνησε τη μπάρα: στο πλακάκι το Δt είναι μικρό, η δύναμη πολύ μεγάλη και το αυγό σπάει. Στο μαξιλάρι το Δt είναι μεγάλο: η ίδια Δp γίνεται σε περισσότερο χρόνο, η δύναμη μικραίνει και το αυγό δεν σπάει.</p>
    <p>Με τον ίδιο τρόπο μάς προστατεύουν η <b>ζώνη ασφαλείας και ο αερόσακος</b>, τα στρώματα στο άλμα επί κοντώ και τα γόνατα που λυγίζουμε όταν προσγειωνόμαστε μετά από ένα πήδημα. Το ίδιο κάνουν και τα <b>λάστιχα στην αποβάθρα του λιμανιού</b>: ένα πλοίο που πλευρίζει κινείται αργά, αλλά έχει τεράστια μάζα, άρα και μεγάλη ορμή. Η ορμή του πρέπει να μηδενιστεί σε μεγάλο χρόνο, αλλιώς οι δυνάμεις σε πλοίο και αποβάθρα γίνονται τεράστιες.</p>
    <p class="note">Και το αντίστροφο: ο καρατέκας θέλει να ασκήσει μεγάλη δύναμη, γι' αυτό χτυπά κοφτά, ώστε το Δt να είναι πολύ μικρό.</p>` },

  { ch: "B", kicker: "Διαγράμματα", title: "Εμβαδόν F–t και κλίση p–t", scene: "graphs", caption: "Πάνω η δύναμη, κάτω η ορμή, στον ίδιο χρόνο", html: `
    <p class="lead">Δύο κανόνες που ζητούνται πολύ συχνά στις εξετάσεις:</p>
    <p><b class="c-F">Διάγραμμα ΣF–t:</b> το <b>εμβαδόν</b> ανάμεσα στη γραφική παράσταση και τον άξονα t ισούται με τη <b>Δp</b>. Ισχύει όποιο σχήμα κι αν έχει η γραφική παράσταση, ακόμη κι όταν η δύναμη δεν είναι σταθερή.</p>
    <p><b class="c-p">Διάγραμμα p–t:</b> η <b>κλίση</b> ισούται με τη <b>ΣF</b>. Όταν η γραμμή ανεβαίνει, ΣF > 0· όταν είναι οριζόντια, ΣF = 0· όταν κατεβαίνει, ΣF < 0.</p>
    <p class="note">Παρακολούθησε πώς μεταβάλλεται η ορμή: όσο η ΣF είναι θετική, η p αυξάνεται· όσο είναι μηδέν, η p μένει σταθερή· όταν γίνει αρνητική, η p μειώνεται.</p>` },

  { ch: "B", kicker: "Συχνά λάθη", title: "Μηδενική ορμή δεν σημαίνει μηδενική δύναμη", scene: "traps", caption: "Αριστερά: κατακόρυφη βολή · Δεξιά: ομαλή κυκλική κίνηση", html: `
    <p class="lead"><b>1. Κατακόρυφη βολή.</b> Στο ψηλότερο σημείο η ταχύτητα είναι 0, άρα <b>p = 0</b>. Όμως το βάρος ασκείται ακόμα, άρα <b>Δp/Δt = −mg ≠ 0</b>. Γι' αυτό το σώμα δεν μένει εκεί, αλλά αρχίζει αμέσως να πέφτει.</p>
    <p>Και όταν επιστρέψει στο σημείο βολής με ταχύτητα ίδιου μέτρου: Δp = −2mυ₀, <b>όχι 0</b>.</p>
    <p><b>2. Ομαλή κυκλική κίνηση.</b> Το μέτρο της ορμής μένει σταθερό (mυ), αλλά η <b>κατεύθυνση αλλάζει</b>, άρα η ορμή μεταβάλλεται. Σε ένα τέταρτο του κύκλου: |Δp| = √2·mυ. Σε μισό κύκλο: 2mυ.</p>
    <p><b>3. Μεγαλύτερη Δp δεν σημαίνει μεγαλύτερη δύναμη.</b> Πρέπει να κοιτάξεις και το Δt. Σώμα Α: Δp = 6 kg·m/s σε 0,02 s ⇒ F = <b>300 N</b>. Σώμα Β: Δp = 9 kg·m/s σε 0,06 s ⇒ F = <b>150 N</b>. Η ορμή του Β μεταβλήθηκε περισσότερο, αλλά δέχτηκε τη μισή δύναμη.</p>
    <p class="note">Ο ρυθμός Δp/Δt είναι πάντα ίσος με τη ΣF, όποια κι αν είναι η ταχύτητα του σώματος.</p>` },

  { ch: "B", kicker: "Προσοχή στο βάρος", title: "Η δύναμη από το δάπεδο: μην ξεχνάς το βάρος", scene: "floor", caption: "Μπάλα 0,4 kg: φτάνει στο δάπεδο με 5 m/s και αναπηδά με 3 m/s",
    knobs: [{ id: "dt", label: "χρόνος επαφής Δt", min: 0.01, max: 0.2, step: 0.01, value: 0.05, unit: "s" }], html: `
    <p class="lead">Το Δp/Δt δίνει τη <b>συνισταμένη</b> δύναμη, όχι τη δύναμη από το δάπεδο. Στην μπάλα ασκούνται δύο δυνάμεις: η <b>N</b> από το δάπεδο (πάνω) και το <b>βάρος mg</b> (κάτω).</p>
    <div class="formula">N − mg = Δp/Δt  ⇒  N = Δp/Δt + mg</div>
    <p>Θετικά προς τα πάνω: Δp = 0,4·(+3) − 0,4·(−5) = <b>3,2 kg·m/s</b> (αναπήδηση: τα μέτρα προστίθενται). Με Δt = 0,05 s: ΣF = 64 N, άρα <b>N = 64 + 4 = 68 N</b>.</p>
    <p>Μετακίνησε τη μπάρα: όσο μεγαλώνει το Δt, η N μικραίνει και πλησιάζει το βάρος. Όταν η επαφή είναι πολύ σύντομη, το βάρος είναι αμελητέο σε σχέση με τη N.</p>
    <p class="note">Τράπεζα Θεμάτων 16120: η σωστή απάντηση περιέχει το «+ mg». Αν ξεχάσεις το βάρος, η απάντηση βγαίνει λάθος.</p>` },

  { ch: "B", kicker: "Ορμή και ενέργεια", title: "K = p² / 2m", scene: "pK", caption: "Μπάλα ποδοσφαίρου και σφαίρα όπλου: ίδια ορμή, πολύ διαφορετική K", html: `
    <p class="lead">Από p = mυ έχουμε υ = p/m. Αντικαθιστούμε στο K = ½mυ²:</p>
    <div class="formula">K = p² / (2m)   ⇔   p = √(2mK)</div>
    <p>Με <b>ίδια ορμή</b>, το ελαφρύτερο σώμα έχει <b>πολύ μεγαλύτερη κινητική ενέργεια</b>. Η σφαίρα (10 g) έχει την ίδια ορμή με την μπάλα, αλλά περίπου 40 φορές μεγαλύτερη κινητική ενέργεια. Γι' αυτό τραυματίζει.</p>
    <p>Η γραφική παράσταση της K σε συνάρτηση με την p είναι <b>τμήμα παραβολής</b> (ερώτηση του Σαββάλα).</p>
    <p class="trap"><b>Παγίδα:</b> ίδια K δεν σημαίνει ίδια p, και ίδια p δεν σημαίνει ίδια K, εκτός αν τα σώματα έχουν ίσες μάζες.</p>` },

  { ch: "B", kicker: "Έλεγχος", title: "Quiz 1: ορμή και δύναμη", scene: "quiz", quiz: "q1", caption: "", html: "" },

  /* ─────────────── Γ. ΑΔΟ ─────────────── */
  { ch: "C", kicker: "Σύστημα", title: "Εσωτερικές και εξωτερικές δυνάμεις", scene: "internal", caption: "Μαγνήτης (1 kg) και σίδερο (2 kg) πάνω σε αμαξάκια",
    chips: [{ id: "hand", label: "Εξωτερική δύναμη:", options: [["off", "καμία"], ["on", "σπρώχνει ένα χέρι"]], value: "off" }], html: `
    <p class="lead"><b>Σύστημα</b> λέμε δύο ή περισσότερα σώματα που αλληλεπιδρούν, δηλαδή ασκούν δυνάμεις το ένα στο άλλο.</p>
    <p><b>Εσωτερικές</b> είναι οι δυνάμεις ανάμεσα στα σώματα του συστήματος (εδώ οι ελκτικές δυνάμεις ανάμεσα στον μαγνήτη και το σίδερο). Εμφανίζονται πάντα σε ζεύγη δράσης–αντίδρασης.</p>
    <p><b>Εξωτερικές</b> είναι οι δυνάμεις που ασκούν σώματα που δεν ανήκουν στο σύστημα: τα βάρη (από τη Γη), οι κάθετες αντιδράσεις και οι τριβές (από το δάπεδο), ένα χέρι που σπρώχνει.</p>
    <p>Αν ΣF<sub>εξ</sub> = 0, το σύστημα λέγεται <b>μονωμένο</b>. Πάτα «σπρώχνει ένα χέρι» και παρακολούθησε τη μαύρη ράβδο: η ολική ορμή αλλάζει μόνο όταν υπάρχει εξωτερική δύναμη.</p>
    <p class="note">Το αν μια δύναμη είναι εσωτερική εξαρτάται από το ποιο σύστημα διάλεξες. Η έλξη Γης–Σελήνης είναι εσωτερική για το σύστημα Γη–Σελήνη.</p>` },

  { ch: "C", kicker: "Η απόδειξη", title: "Γιατί διατηρείται η ορμή", scene: "proof", caption: "Σφαίρα 2 kg χτυπά ακίνητη σφαίρα 1 kg: δράση και αντίδραση", html: `
    <p class="lead">Κατά την κρούση η σφαίρα 1 ασκεί στη σφαίρα 2 δύναμη <span class='vec'>F</span> και η 2 ασκεί στην 1 δύναμη −<span class='vec'>F</span> (3ος νόμος του Νεύτωνα). Ο χρόνος επαφής Δt είναι <b>ίδιος</b> και για τις δύο.</p>
    <p>Άρα Δ<span class='vec'>p</span>₁ = −<span class='vec'>F</span>·Δt και Δ<span class='vec'>p</span>₂ = +<span class='vec'>F</span>·Δt, οπότε</p>
    <div class="formula">Δ<span class='vec'>p</span>₁ = −Δ<span class='vec'>p</span>₂  ⇒  <span class='vec'>p</span>₁ + <span class='vec'>p</span>₂ = σταθ.</div>
    <p>Ό,τι ορμή χάνει το ένα σώμα την κερδίζει το άλλο. Αυτή είναι η <b>Αρχή Διατήρησης της Ορμής (ΑΔΟ)</b>:</p>
    <p><b>Η ολική ορμή ενός μονωμένου συστήματος μένει σταθερή.</b></p>
    <p class="note">Ισχύει σε κάθε μονωμένο σύστημα (κρούσεις, εκρήξεις, πύραυλοι, πυρηνικές αντιδράσεις), όχι μόνο στις κρούσεις.</p>` },

  { ch: "C", kicker: "Πότε εφαρμόζουμε την ΑΔΟ", title: "Στην κρούση θεωρούμε το σύστημα μονωμένο", scene: "crash", caption: "Σύγκρουση αυτοκινήτων: οι τριβές είναι μικρές σε σχέση με τις δυνάμεις της σύγκρουσης", html: `
    <p class="lead">Στη φύση δεν υπάρχουν τέλεια μονωμένα συστήματα. Στις κρούσεις όμως οι δυνάμεις ανάμεσα στα σώματα είναι <b>τεράστιες</b> και διαρκούν <b>ελάχιστα</b>.</p>
    <p>Σε μια σύγκρουση αυτοκινήτων υπάρχουν τριβές (εξωτερικές), αλλά είναι αμελητέες μπροστά στις δυνάμεις της σύγκρουσης. Γι' αυτό εφαρμόζουμε την ΑΔΟ ανάμεσα στη στιγμή <b>αμέσως πριν</b> και τη στιγμή <b>αμέσως μετά</b> την κρούση.</p>
    <p class="trap"><b>Παγίδα:</b> η ΑΔΟ ισχύει μόνο για τη σύντομη διάρκεια της κρούσης. Μετά, όσο τα σώματα γλιστράνε με τριβή, η ορμή τους μειώνεται, οπότε χρησιμοποιούμε ΘΜΚΕ ή ΣF = Δp/Δt.</p>
    <p class="note">Η ΑΔΟ μπορεί να ισχύει σε έναν άξονα και όχι στον άλλο (π.χ. σώμα που πέφτει κατακόρυφα σε καρότσι: διατηρείται μόνο η οριζόντια ορμή).</p>` },

  { ch: "C", kicker: "Από την ηρεμία", title: "Εκρήξεις, ελατήρια, ανάκρουση", scene: "explode", caption: "Συμπιεσμένο ελατήριο (12 J) ανάμεσα σε δύο ακίνητα αμαξάκια",
    knobs: [{ id: "r", label: "μάζα m₂ (το m₁ = 1 kg)", min: 0.5, max: 6, step: 0.5, value: 2, unit: "kg" }], html: `
    <p class="lead">Πριν: όλα είναι ακίνητα, άρα p<sub>ολ</sub> = 0. Μετά: η ολική ορμή είναι πάλι 0!</p>
    <div class="formula">0 = m₁υ₁ − m₂υ₂  ⇒  m₁υ₁ = m₂υ₂</div>
    <p>Τα σώματα κινούνται με <b>αντίθετες φορές</b>, με ορμές <b>ίσου μέτρου</b> και ταχύτητες αντιστρόφως ανάλογες των μαζών τους. Το βαρύ σώμα κινείται αργά, το ελαφρύ γρήγορα.</p>
    <p>Η κινητική ενέργεια <b>αυξάνεται</b> (ήταν 0!). Προέρχεται από τη δυναμική ενέργεια του ελατηρίου ή από τη χημική ενέργεια του εκρηκτικού. Και μοιράζεται αντιστρόφως ανάλογα με τις μάζες: K₁/K₂ = m₂/m₁.</p>
    <p class="note">Με τον ίδιο τρόπο λύνονται: δύο παγοδρόμοι που σπρώχνει ο ένας τον άλλο, ένας άνθρωπος που πηδά από βάρκα, ένα κανόνι που εκτοξεύει βλήμα (ανάκρουση).</p>` },

  { ch: "C", kicker: "Προσοχή", title: "Διάσπαση σώματος που κινείται", scene: "split", caption: "Η μαύρη ράβδος (ολική ορμή) μένει ίδια, αλλά ΔΕΝ είναι μηδέν",
    chips: [{ id: "case", label: "Περίπτωση:", options: [["stop", "το ένα κομμάτι σταματά"], ["back", "το ένα γυρίζει πίσω"]], value: "stop" }], html: `
    <p class="lead">Αν το σώμα <b>κινείται</b> τη στιγμή που σπάει, η ορμή του πριν από τη διάσπαση <b>δεν είναι μηδέν</b>. Είναι M·υ, και ίση με αυτήν πρέπει να είναι η ολική ορμή μετά.</p>
    <div class="formula">M·υ = m₁·υ₁ + m₂·υ₂</div>
    <p><b>Το ένα κομμάτι σταματά:</b> σώμα 2 kg που κινείται με 10 m/s σπάει σε δύο κομμάτια του 1 kg. Αν το ένα μείνει ακίνητο: 2·10 = 1·0 + 1·υ ⇒ <b>υ = 20 m/s</b>. Όλη η ορμή μεταφέρθηκε στο άλλο κομμάτι.</p>
    <p><b>Το ένα κομμάτι γυρίζει πίσω:</b> σώμα 3 kg που κινείται με 4 m/s σπάει· το κομμάτι του 1 kg συνεχίζει μπροστά με 16 m/s: 3·4 = 1·16 + 2·υ ⇒ <b>υ = −2 m/s</b> (το κομμάτι των 2 kg κινείται προς τα πίσω).</p>
    <p class="note">Η κινητική ενέργεια αυξάνεται (από 100 σε 200 J στην πρώτη περίπτωση): την προσφέρει η έκρηξη. Τράπεζα: 16209, 16064, 21691, 21819.</p>` },

  { ch: "C", kicker: "Εφαρμογή", title: "Πώς κινείται ένας πύραυλος", scene: "rocket", caption: "Κάθε ριπή αερίων προς τα πίσω σπρώχνει τον πύραυλο μπροστά", html: `
    <p class="lead">Ο πύραυλος μαζί με τα αέρια της καύσης είναι ένα μονωμένο σύστημα. Όταν μια ποσότητα αερίων εκτοξεύεται προς τα πίσω, ο πύραυλος αποκτά ορμή ίσου μέτρου προς τα μπροστά.</p>
    <div class="formula">0 = m·<span class='vec'>υ</span> + M·<span class='vec'>V</span></div>
    <p>Γι' αυτό ο πύραυλος <b>κινείται και στο κενό</b>: δεν σπρώχνει τον αέρα, αλλά τα δικά του καυσαέρια.</p>
    <p class="note"><span class="q">Δοκίμασε:</span> φούσκωσε ένα μπαλόνι, κόλλησέ το σε ένα καλαμάκι περασμένο σε τεντωμένο νήμα και άφησέ το. Είναι δραστηριότητα του σχολικού βιβλίου.</p>
    <p class="note">Το ίδιο ισχύει για έναν άνθρωπο πάνω σε τελείως λείο πάγο: για να κινηθεί, πρέπει να πετάξει κάτι προς την αντίθετη κατεύθυνση.</p>` },

  { ch: "C", kicker: "Έλεγχος", title: "Quiz 2: αρχή διατήρησης της ορμής", scene: "quiz", quiz: "q2", caption: "", html: "" },

  /* ─────────────── Δ. ΚΡΟΥΣΕΙΣ ─────────────── */
  { ch: "D", kicker: "Κατηγορίες", title: "Τα είδη των κρούσεων", scene: "types", caption: "Ίδια αρχική κίνηση, τρία διαφορετικά αποτελέσματα", html: `
    <p class="lead"><b>Κρούση</b>: δύο σώματα αλληλεπιδρούν με μεγάλες δυνάμεις για πολύ μικρό χρόνο, και οι ορμές τους αλλάζουν απότομα.</p>
    <p><b>Ανάλογα με τη διεύθυνση:</b> <b>κεντρική (μετωπική)</b>, όταν οι ταχύτητες των κέντρων τους βρίσκονται στην ίδια ευθεία, αλλιώς <b>πλάγια</b>.</p>
    <p><b>Ανάλογα με την κινητική ενέργεια:</b></p>
    <p>• <b>Ελαστική</b>: K<sub>μετά</sub> = K<sub>πριν</sub>.<br>• <b>Ανελαστική</b>: K<sub>μετά</sub> < K<sub>πριν</sub>, ένα μέρος της μετατρέπεται σε θερμότητα και σε ενέργεια παραμόρφωσης.<br>• <b>Πλαστική</b>: ανελαστική όπου τα σώματα <b>κολλάνε</b> (συσσωμάτωμα).</p>
    <p class="note">Σε όλες ισχύει η ΑΔΟ· διαφέρουν μόνο ως προς την κινητική ενέργεια.</p>` },

  { ch: "D", kicker: "Αναγνώριση", title: "Τι είδους κρούση είναι; Κοίτα την κινητική ενέργεια", scene: "which", caption: "Σώμα 1 kg με 6 m/s χτυπά ακίνητο σώμα 2 kg",
    chips: [{ id: "case", label: "Μετά την κρούση:", options: [["el", "1 kg γυρίζει με 2 m/s"], ["in", "1 kg σταματά"], ["pl", "κολλάνε"]], value: "el" }], html: `
    <p class="lead">Η ορμή διατηρείται σε <b>κάθε</b> κρούση, άρα δεν μας βοηθά να καταλάβουμε τι είδους κρούση έγινε. Αυτό το δείχνει μόνο η <b>κινητική ενέργεια</b>.</p>
    <div class="formula">K πριν  vs  K μετά</div>
    <p>K πριν = ½·1·6² = 18 J. Πάτα τα κουμπιά:</p>
    <p>• Το 1 kg γυρίζει με 2 m/s ⇒ το 2 kg φεύγει με 4 m/s. K μετά = 2 + 16 = 18 J ⇒ <b>ελαστική</b>.<br>• Το 1 kg σταματά ⇒ το 2 kg με 3 m/s. K μετά = 9 J &lt; 18 J ⇒ <b>ανελαστική</b>.<br>• Κολλάνε ⇒ V = 2 m/s. K μετά = 6 J ⇒ <b>πλαστική</b> (η μεγαλύτερη απώλεια).</p>
    <p class="note">Πρόσεξε και κάτι ακόμα: όταν ένα ελαφρύ σώμα χτυπά ελαστικά ένα βαρύτερο ακίνητο σώμα, <b>γυρίζει πίσω</b>.</p>` },

    const T = 6, k = t % T, tc = 1.4;
    const pivot = { x: W * 0.55, y: 20 }, L = Math.min(H * 0.44, 180);
    const thMax = Math.acos(1 - 0.3125 / 1); // ℓ = 1 m, h = 0.3125 m
    const th = k < tc ? 0 : thMax * Math.sin(Math.min(1, (k - tc) / 1.4) * Math.PI / 2);
    const bx = pivot.x + L * Math.sin(th), by = pivot.y + L * Math.cos(th);
    ctx.strokeStyle = COL.edge; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(pivot.x - 50, pivot.y); ctx.lineTo(pivot.x + 50, pivot.y); ctx.stroke();
    ctx.setLineDash([4, 5]); ctx.strokeStyle = COL.line; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(pivot.x, pivot.y); ctx.lineTo(pivot.x, pivot.y + L + 30); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = COL.muted; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(pivot.x, pivot.y); ctx.lineTo(bx, by); ctx.stroke();
    ctx.save(); ctx.translate(bx, by); ctx.rotate(-th); ctx.fillStyle = COL.wood; ctx.strokeStyle = COL.edge; rrect(-22, 0, 44, 36, 4); ctx.fill(); ctx.stroke(); ctx.restore();
    if (k < tc) { const xb = pivot.x - 24 - (tc - k) * W * 0.32; ctx.fillStyle = "#3b3f46"; rrect(xb - 10, pivot.y + L + 15, 12, 6, 2); ctx.fill(); arrow(xb - 60, pivot.y + L + 4, xb - 16, pivot.y + L + 4, COL.v, 3, "100 m/s"); }
    const hpx = L * (1 - Math.cos(th));
    if (hpx > 2) { ctx.strokeStyle = COL.p; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(W - 40, pivot.y + L); ctx.lineTo(W - 40, pivot.y + L - hpx); ctx.stroke(); text("h", W - 30, pivot.y + L - hpx / 2, COL.p, 15, "left"); }
    const stage = k < tc ? 0 : k < tc + 0.3 ? 1 : 2;
    const yb = H - 56;
    const step = (i, s, active) => { ctx.globalAlpha = active ? 1 : 0.35; ctx.fillStyle = active ? COL.accent : COL.line; rrect(24 + i * (W - 48) / 2, yb, (W - 64) / 2, 44, 10); ctx.fill(); text(s, 24 + i * (W - 48) / 2 + (W - 64) / 4, yb + 27, active ? COL.paper : COL.ink, 13.5); ctx.globalAlpha = 1; };
    const narrow = W < 520;
    step(0, narrow ? "1. ΑΔΟ: V = 2,5 m/s" : "1. κρούση → ΑΔΟ: V = 2,5 m/s", stage === 1 || stage === 0);
    step(1, narrow ? "2. ΑΔΜΕ: h ≈ 0,31 m" : "2. άνοδος → ΑΔΜΕ: h ≈ 0,31 m", stage === 2);
  },
  method(t) {
    const steps = ["σχήμα πριν / μετά", "θετική φορά", "μονωμένο;", "ΑΔΟ ανά άξονα", "ενέργεια"];
    const active = Math.floor(t / 1.6) % (steps.length + 1);
    const top = 30, rowH = (H - 60) / steps.length;
    steps.forEach((s, i) => {
      const y = top + i * rowH, on = i <= active - 0 && active < steps.length ? i <= active : true;
      ctx.globalAlpha = on ? 1 : 0.3;
      ctx.fillStyle = i === active ? COL.accent : COL.paper; ctx.strokeStyle = COL.line; ctx.lineWidth = 1.4;
      rrect(30, y, W - 60, rowH - 12, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = i === active ? COL.paper : COL.accent; ctx.beginPath(); ctx.arc(58, y + (rowH - 12) / 2, 14, 0, 7); ctx.fill();
      text(String(i + 1), 58, y + (rowH - 12) / 2 + 5, i === active ? COL.accent : COL.paper, 14, "center", 800);
      text(s, 86, y + (rowH - 12) / 2 + 5, i === active ? COL.paper : COL.ink, 16, "left", 800);
      ctx.globalAlpha = 1;
    });
  },
  quiz(t) {
    const st = QUIZ_STATE[SLIDES[idx].quiz];
    const qs = QUIZZES[SLIDES[idx].quiz];
    const done = st.answers.filter((a) => a != null).length, right = st.answers.filter((a, i) => a === qs[i].a).length;
    const cx = W / 2, cy = H * 0.44, R = Math.min(W, H) * 0.24;
    ctx.lineWidth = 16; ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    ctx.strokeStyle = COL.ok; ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * right / qs.length); ctx.stroke();
    ctx.strokeStyle = COL.bad; ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2 + 2 * Math.PI * right / qs.length, -Math.PI / 2 + 2 * Math.PI * done / qs.length); ctx.stroke();
    text(`${right} / ${qs.length}`, cx, cy + 10, COL.ink, 30, "center", 800);
    text("σωστές", cx, cy + 32, COL.muted, 13);
    const msg = done < qs.length ? "Απάντησε και δες την εξήγηση" : right === qs.length ? "Τέλεια! Είσαι έτοιμος." : right >= qs.length * 0.7 ? "Πολύ καλά! Ξαναδές όσες έχασες." : "Ξαναδές τις διαφάνειες και ξαναδοκίμασε.";
    text(msg, cx, H - 40, done < qs.length ? COL.muted : right === qs.length ? COL.ok : COL.ink, 15);
    for (let i = 0; i < 12; i++) if (done === qs.length && right === qs.length) { const a = t * 1.3 + i, rr = R + 30 + 10 * Math.sin(t * 3 + i); ctx.fillStyle = [COL.p, COL.K, COL.v][i % 3]; ctx.beginPath(); ctx.arc(cx + rr * Math.cos(a), cy + rr * Math.sin(a), 4, 0, 7); ctx.fill(); }
  },
  recap(t) {
    const gy = H * 0.42, T = 4.4, k = t % T;
    const m1 = 3, m2 = 1, u1 = 4, u2 = -2; const [v1, v2] = collide(m1, u1, m2, u2, 0.6);
    const X = W / 2, S = Math.min(24, W / 24), tc = 1.4;
    let x1, x2, s1, s2;
    if (k < tc) { x1 = X - 26 - S * u1 * (tc - k); x2 = X + 20 - S * u2 * (tc - k); s1 = u1; s2 = u2; } else { const d = Math.min(k - tc, 2); x1 = X - 26 + S * v1 * d; x2 = X + 20 + S * v2 * d; s1 = v1; s2 = v2; }
    ground(gy); box(x1, gy, bodyW(3), bodyH(3), COL.b1, "3 kg"); box(x2, gy, bodyW(1), bodyH(1), COL.b2, "1 kg");
    bars(24, gy + 40, W - 48, [{ label: "p₁", value: m1 * s1, color: COL.p }, { label: "p₂", value: m2 * s2, color: COL.p }, { label: "p ολική", value: m1 * s1 + m2 * s2, color: COL.ink }], 13);
    text(W < 520 ? "η μαύρη ράβδος μένει ίδια" : "ό,τι κι αν γίνει στην κρούση, η μαύρη ράβδος μένει ίδια", W / 2, H - 14, COL.ink, 13.5);
  },
};

/* ═══════════════════════════ SLIDE ENGINE ═══════════════════════════ */
const textEl = document.getElementById("text"), capEl = document.getElementById("caption"), counter = document.getElementById("counter");
const knobsEl = document.getElementById("knobs");
const prev = document.getElementById("prev"), next = document.getElementById("next"), dots = document.getElementById("dots"), chaptersEl = document.getElementById("chapters");
/* Virtual clock: all scenes read time from vnow, which stands still while paused and runs slower at ½× / ¼×. */
let vnow = 0, lastReal = performance.now();
const MOTION = { paused: false, speed: 1 };
let idx = 0, t0 = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const QUIZ_STATE = {};
for (const id in QUIZZES) QUIZ_STATE[id] = { i: 0, answers: QUIZZES[id].map(() => null) };
try { const saved = JSON.parse(localStorage.getItem("ormi-theory-quiz") || "{}"); for (const id in saved) if (QUIZ_STATE[id] && saved[id].answers?.length === QUIZZES[id].length) QUIZ_STATE[id] = saved[id]; } catch (e) {}
function saveQuiz() { try { localStorage.setItem("ormi-theory-quiz", JSON.stringify(QUIZ_STATE)); } catch (e) {} }

// default knob/chip values
SLIDES.forEach((s) => {
  UI[s.scene] = UI[s.scene] || {};
  (s.knobs || []).forEach((k) => (UI[s.scene][k.id] = k.value));
  (s.chips || []).forEach((c) => (UI[s.scene][c.id] = c.value));
});

CHAPTERS.forEach((c) => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.ch = c.id;
  b.innerHTML = `<span class="lbl">${c.name}<span class="long"> · ${c.long}</span></span><span class="bar"><i></i></span>`;
  b.addEventListener("click", () => go(SLIDES.findIndex((s) => s.ch === c.id)));
  chaptersEl.appendChild(b);
});
SLIDES.forEach((s, i) => {
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Διαφάνεια ${i + 1}: ${s.title}`);
  if (s.quiz) b.classList.add("quizdot");
  b.addEventListener("click", () => go(i)); dots.appendChild(b);
});

const fmtKnob = (k, v) => `${num(v, k.step < 0.01 ? 3 : k.step < 0.5 ? 2 : 1)} ${k.unit}`;
function renderKnobs(s) {
  knobsEl.innerHTML = "";
  const has = (s.knobs && s.knobs.length) || (s.chips && s.chips.length) || s.replay;
  knobsEl.hidden = !has;
  if (!has) return;
  (s.chips || []).forEach((c) => {
    const row = document.createElement("div"); row.className = "chips";
    row.innerHTML = `<span>${c.label}</span>`;
    c.options.forEach(([val, lbl]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = lbl; b.setAttribute("aria-pressed", UI[s.scene][c.id] === val ? "true" : "false");
      b.addEventListener("click", () => { UI[s.scene][c.id] = val; [...row.querySelectorAll("button")].forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); if (s.scene === "lab") UI.lab.t0 = (vnow - t0) / 1000; });
      row.appendChild(b);
    });
    if (s.replay) { const r = document.createElement("button"); r.type = "button"; r.className = "replay"; r.textContent = "↺ Ξανά"; r.addEventListener("click", () => (UI.lab.t0 = (vnow - t0) / 1000)); row.appendChild(r); }
    knobsEl.appendChild(row);
  });
  const grid = document.createElement("div"); grid.style.display = "grid"; grid.style.gap = "8px 18px";
  grid.style.gridTemplateColumns = (s.knobs || []).length > 2 ? "repeat(auto-fit, minmax(150px, 1fr))" : "1fr";
  (s.knobs || []).forEach((k) => {
    const id = `k-${s.scene}-${k.id}`;
    const row = document.createElement("div"); row.className = "knob";
    row.innerHTML = `<label for="${id}">${k.label}</label><output id="${id}-o">${fmtKnob(k, UI[s.scene][k.id])}</output><input id="${id}" type="range" min="${k.min}" max="${k.max}" step="${k.step}" value="${UI[s.scene][k.id]}">`;
    const inp = row.querySelector("input"), out = row.querySelector("output");
    inp.addEventListener("input", () => { UI[s.scene][k.id] = Number(inp.value); out.textContent = fmtKnob(k, UI[s.scene][k.id]); if (s.scene === "lab") UI.lab.t0 = (vnow - t0) / 1000; });
    grid.appendChild(row);
  });
  knobsEl.appendChild(grid);
}

const LETTERS = ["Α", "Β", "Γ", "Δ"];
function renderQuiz(s) {
  const id = s.quiz, qs = QUIZZES[id], st = QUIZ_STATE[id], q = qs[st.i], ans = st.answers[st.i];
  const wrap = document.createElement("div"); wrap.className = "quiz";
  wrap.innerHTML = `<div class="qhead"><span>Ερώτηση ${st.i + 1} από ${qs.length}</span><span>${st.answers.filter((a, i) => a === qs[i].a).length} σωστές</span></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((o, j) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt";
    b.innerHTML = `<span class="lt">${LETTERS[j]}</span><span>${o}</span>`;
    if (ans != null) { b.disabled = true; if (j === q.a) b.dataset.state = "right"; else if (j === ans) b.dataset.state = "wrong"; }
    b.addEventListener("click", () => { st.answers[st.i] = j; saveQuiz(); renderQuizInto(s); });
    wrap.appendChild(b);
  });
  if (ans != null) {
    const ex = document.createElement("div"); ex.className = "explain";
    ex.innerHTML = `<b style="color:var(${ans === q.a ? "--ok" : "--bad"})">${ans === q.a ? "Σωστά!" : "Όχι ακριβώς."}</b> ${q.e}`;
    wrap.appendChild(ex);
  }
  const nav = document.createElement("div"); nav.className = "qnav";
  if (st.i > 0) { const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = "← Προηγούμενη"; b.onclick = () => { st.i--; saveQuiz(); renderQuizInto(s); }; nav.appendChild(b); }
  if (st.i < qs.length - 1) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Επόμενη ερώτηση →"; b.disabled = ans == null; b.style.opacity = ans == null ? 0.45 : 1; b.onclick = () => { st.i++; saveQuiz(); renderQuizInto(s); }; nav.appendChild(b); }
  else if (st.answers.every((a) => a != null)) { const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = "↺ Ξανά από την αρχή"; b.onclick = () => { st.i = 0; st.answers = qs.map(() => null); saveQuiz(); renderQuizInto(s); }; nav.appendChild(b); }
  wrap.appendChild(nav);
  return wrap;
}
function renderQuizInto(s) {
  const old = textEl.querySelector(".quiz"); const fresh = renderQuiz(s);
  if (old) old.replaceWith(fresh); else textEl.appendChild(fresh);
  reportHeight();
}

function render() {
  const s = SLIDES[idx];
  textEl.innerHTML = `<div class="kicker">${s.kicker}</div>${s.h1 ? `<h1>${s.title}</h1>` : `<h2>${s.title}</h2>`}${s.html}`;
  if (s.quiz) textEl.appendChild(renderQuiz(s));
  mbar.hidden = !!s.quiz || s.scene === "method";
  capEl.textContent = s.caption || "";
  counter.textContent = `${idx + 1} / ${SLIDES.length}`;
  prev.disabled = idx === 0; next.disabled = idx === SLIDES.length - 1;
  next.textContent = idx === SLIDES.length - 1 ? "Τέλος" : "Επόμενο →";
  [...dots.children].forEach((d, i) => d.setAttribute("aria-current", i === idx ? "true" : "false"));
  [...chaptersEl.children].forEach((b) => {
    const ch = b.dataset.ch, list = SLIDES.map((x, i) => [x, i]).filter(([x]) => x.ch === ch);
    const first = list[0][1], last = list[list.length - 1][1];
    const frac = idx > last ? 1 : idx < first ? 0 : (idx - first + 1) / list.length;
    b.querySelector("i").style.width = `${frac * 100}%`;
    b.setAttribute("aria-current", s.ch === ch ? "true" : "false");
  });
  renderKnobs(s);
  t0 = vnow; MOTION.paused = false; syncMotion();
  if (s.scene === "lab") UI.lab.t0 = 0;
  try { localStorage.setItem("ormi-theory-slide", String(idx)); } catch (e) {}
  requestAnimationFrame(reportHeight);
}
function go(i) { idx = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); }
prev.addEventListener("click", () => go(idx - 1));
next.addEventListener("click", () => go(idx + 1));
addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") go(idx + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(idx - 1);
  if (e.key === " " && !(e.target && e.target.tagName === "BUTTON")) { e.preventDefault(); MOTION.paused = !MOTION.paused; syncMotion(); }
});
const mbar = document.getElementById("mbar"), mpause = document.getElementById("mpause");
function syncMotion() {
  mpause.textContent = MOTION.paused ? "▶ Συνέχεια" : "❚❚ Παύση";
  mpause.setAttribute("aria-pressed", MOTION.paused ? "true" : "false");
  mbar.querySelectorAll("[data-sp]").forEach((b) => b.setAttribute("aria-pressed", Number(b.dataset.sp) === MOTION.speed ? "true" : "false"));
}
mpause.addEventListener("click", () => { MOTION.paused = !MOTION.paused; syncMotion(); });
mbar.querySelectorAll("[data-sp]").forEach((b) => b.addEventListener("click", () => { MOTION.speed = Number(b.dataset.sp); syncMotion(); }));
let sx = null, sy = null;
const stageEl = document.getElementById("stage");
stageEl.addEventListener("touchstart", (e) => { if (e.target.closest("input, .knobs")) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
stageEl.addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1)); sx = null; });
try { const saved = Number(new URLSearchParams(location.search).get("s") || localStorage.getItem("ormi-theory-slide")); if (saved > 0 && saved < SLIDES.length) idx = saved; } catch (e) {}
render(); resize();

function frame(now) {
  const dtReal = Math.min(100, now - lastReal); lastReal = now;
  if (!MOTION.paused) vnow += dtReal * MOTION.speed;
  const t = reduce ? 2.2 : (vnow - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  if (W > 0 && H > 0) { try { SCENES[SLIDES[idx].scene](t); } catch (err) { console.error(err); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Report height to the embedding page so the iframe never scrolls internally. */
let lastH = 0;
function reportHeight() {
  const h = Math.ceil(document.querySelector(".controls").getBoundingClientRect().bottom + window.scrollY + 18);
  if (h !== lastH && window.parent !== window) { lastH = h; window.parent.postMessage({ type: "ormi-theory-height", height: h }, "*"); }
}
new ResizeObserver(reportHeight).observe(document.body);
addEventListener("load", reportHeight);
document.fonts && document.fonts.ready.then(reportHeight);
addEventListener("message", (e) => { if (e.data === "ormi-theory-ping") { lastH = 0; reportHeight(); } });
</script>
</body>
</html>

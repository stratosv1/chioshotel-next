<!doctype html>
<html lang="el" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Διανύσματα με συντεταγμένες</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+Mono:wght@500&display=swap">
<style>
/* Immersive deck: the whole screen is the coordinate plane; text floats on the left (desktop) or scrolls under a sticky canvas (phone). */
:root {
  --bg: #f4f1ea; --paper: #fffdf8; --ink: #1d2433; --muted: #5d6475; --line: #ddd6c8;
  --accent: #1f6f5c; --a: #1f6fd1; --b: #d9342b; --r: #1f9d55; --j: #8e44ad; --K: #d9821c; --axis: #7b8190;
  --bench: #f7f4ec; --grid: #e6dfd0; --ok: #1f9d55; --bad: #c0392b;
  --glass: color-mix(in srgb, var(--paper) 82%, transparent);
  --display: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
  --panel: min(46vw, 590px);
  --barH: 64px; --ctrlH: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --paper: #1a1f2a; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2c3343; --accent: #5fd0ae;
    --a: #6aa6ff; --b: #ff7a6e; --r: #45cf8c; --j: #c58af0; --K: #f3a64a; --axis: #8d95a6;
    --bench: #151a24; --grid: #232b3a; --ok: #45cf8c; --bad: #ff7a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --paper: #1a1f2a; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2c3343; --accent: #5fd0ae;
  --a: #6aa6ff; --b: #ff7a6e; --r: #45cf8c; --j: #c58af0; --K: #f3a64a; --axis: #8d95a6;
  --bench: #151a24; --grid: #232b3a; --ok: #45cf8c; --bad: #ff7a6e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 17px; line-height: 1.6; overflow: hidden; height: 100dvh; }

/* ── top bar ── */
.bar {
  position: fixed; inset: 0 0 auto 0; height: var(--barH); z-index: 5; display: flex; align-items: center; gap: 18px;
  padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
  background: linear-gradient(to bottom, var(--bg) 55%, transparent);
}
.back { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.back:hover { color: var(--ink); }
.brand { font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--accent); white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; }
.chapters { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.chapters button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--muted); }
.chapters button .bar2 { height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
.chapters button .bar2 i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.chapters button[aria-current="true"] { color: var(--ink); }
.chapters button .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapters button:focus-visible { outline: 3px solid var(--K); outline-offset: 3px; border-radius: 4px; }
.counter { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── the plane fills the screen ── */
.viz { position: fixed; inset: 0; z-index: 0; }
.viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption {
  position: absolute; z-index: 2; top: calc(var(--barH) + 4px); left: calc(var(--panel) + 28px); right: 24px;
  font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--muted); text-align: right; pointer-events: none;
}
.caption:empty { display: none; }
.knobs {
  position: absolute; z-index: 3; left: calc(var(--panel) + 28px); right: 24px; bottom: calc(var(--ctrlH) + 10px);
  margin-left: auto; max-width: 560px; padding: 12px 16px 14px; display: grid; gap: 10px; font-family: var(--display);
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.35);
}
.knobs[hidden] { display: none; }
.knob { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; font-size: 14px; }
.knob label { font-weight: 700; color: var(--ink); }
.knob output { font-family: var(--mono); font-size: 14px; color: var(--accent); }
.knob input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13px; font-weight: 700; color: var(--muted); align-self: center; margin-right: 4px; }
.chips button, .replay { font-family: var(--display); font-weight: 700; font-size: 13.5px; border-radius: 999px; padding: 6px 13px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); transition: background .2s, color .2s; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips button:focus-visible, .replay:focus-visible, .opt:focus-visible { outline: 3px solid var(--K); outline-offset: 2px; }

/* ── text panel floats over the left of the plane ── */
.text {
  position: fixed; z-index: 2; left: 0; top: var(--barH); bottom: var(--ctrlH); width: var(--panel);
  padding: 22px 34px 26px max(28px, env(safe-area-inset-left)); overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 13px;
  background: linear-gradient(to right, var(--bg) 0, var(--bg) 82%, color-mix(in srgb, var(--bg) 0%, transparent) 100%);
  scrollbar-width: thin;
}
.text > * { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
.text > *:nth-child(2) { animation-delay: .05s; } .text > *:nth-child(3) { animation-delay: .1s; } .text > *:nth-child(4) { animation-delay: .15s; }
.text > *:nth-child(5) { animation-delay: .2s; } .text > *:nth-child(6) { animation-delay: .25s; } .text > *:nth-child(n+7) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translate(var(--dx, 0), 14px); } to { opacity: 1; transform: none; } }
.watermark {
  position: fixed; z-index: 1; left: -0.06em; bottom: calc(var(--ctrlH) - 0.18em); font-family: var(--display); font-weight: 800;
  font-size: min(34vw, 420px); line-height: 1; color: transparent; -webkit-text-stroke: 2px color-mix(in srgb, var(--accent) 16%, transparent);
  pointer-events: none; user-select: none; transition: opacity .4s;
}
.kicker { font-family: var(--display); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(36px, 4.6vw, 60px); }
h2 { font-size: clamp(27px, 3vw, 40px); }
.text p { margin: 0; max-width: 36em; }
.text p.lead { font-size: 19px; }
.formula { align-self: flex-start; font-family: var(--mono); font-size: 17px; padding: 7px 14px; border-radius: 12px; border: 1.5px solid var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--paper)); line-height: 1.9; }
.note { font-size: 15px; color: var(--muted); border-left: 3px solid var(--K); padding-left: 12px; }
.trap { font-size: 15px; border-left: 3px solid var(--b); padding-left: 12px; }
.trap b:first-child { color: var(--b); font-family: var(--display); }
.q { font-family: var(--display); font-weight: 700; color: var(--K); }
.vec { position: relative; display: inline-block; }
.vec::after { content: "→"; position: absolute; left: 0; right: 0; top: -0.78em; font-size: 0.62em; text-align: center; line-height: 1; }
.formula .vec::after { top: -0.62em; }
ol.steps, ul.recap { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 7px; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.86em; line-height: 1.15; margin: 0 0.12em; }
.frac > span:first-child { border-bottom: 1.2px solid currentColor; padding: 0 0.2em 1px; }
.frac > span:last-child { padding-top: 1px; }
.det { display: inline-grid; grid-template-columns: auto auto; gap: 0 0.8em; border-left: 1.5px solid currentColor; border-right: 1.5px solid currentColor; padding: 0 0.45em; vertical-align: middle; line-height: 1.2; font-size: 0.9em; text-align: center; }
details.try { border: 1.5px dashed var(--K); border-radius: 14px; padding: 9px 14px; background: color-mix(in srgb, var(--K) 6%, var(--paper)); }
details.try > summary, details.sol > summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--K); }
details.try[open] > summary { margin-bottom: 6px; }
details.try p { margin: 6px 0 0; font-size: 16px; }
details.sol { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
details.sol > summary { color: var(--ok); }
details[open] > *:not(summary) { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
summary:focus-visible { outline: 3px solid var(--K); outline-offset: 3px; border-radius: 4px; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 10px; }
.quiz .qhead { font-family: var(--display); font-size: 13px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }
.quiz .qtext { font-size: 19px; font-weight: 600; }
.opt { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; font-size: 16px; line-height: 1.45; background: var(--paper); transition: border-color .2s, transform .15s; }
.opt .lt { font-family: var(--display); font-weight: 800; color: var(--muted); min-width: 1.2em; }
.opt:hover { border-color: var(--accent); transform: translateX(3px); }
.opt[data-state="right"] { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--paper)); animation: pop .35s; }
.opt[data-state="wrong"] { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--paper)); animation: shake .35s; }
.opt[disabled] { cursor: default; transform: none; }
@keyframes pop { 50% { transform: scale(1.025); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.explain { font-size: 15px; border-radius: 12px; padding: 10px 14px; background: var(--bench); border: 1px solid var(--line); animation: rise .4s both; }
.explain b { font-family: var(--display); }
.qnav { display: flex; gap: 8px; flex-wrap: wrap; }
.qnav button { font-family: var(--display); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 7px 16px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--paper); }
.qnav button.ghost { background: transparent; color: var(--accent); }

/* ── bottom controls ── */
.controls {
  position: fixed; z-index: 5; inset: auto 0 0 0; height: var(--ctrlH); display: flex; align-items: center; gap: 12px;
  padding: 0 max(20px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(20px, env(safe-area-inset-left));
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
.controls > button { font-family: var(--display); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 11px 22px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); transition: transform .15s; }
.controls > button:hover:not(:disabled) { transform: translateY(-2px); }
.controls > button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.controls > button:disabled { opacity: 0.4; cursor: default; }
.controls > button:focus-visible, .dots button:focus-visible { outline: 3px solid var(--K); outline-offset: 2px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: none; background: var(--line); cursor: pointer; transition: width .3s, background .3s; }
.dots button[aria-current="true"] { background: var(--accent); width: 26px; border-radius: 6px; }
.dots button.quizdot { background: color-mix(in srgb, var(--K) 55%, var(--line)); }
.dots button.quizdot[aria-current="true"] { background: var(--K); }

/* ── phone: sticky plane on top, text scrolls below ── */
@media (max-width: 900px) {
  body { overflow: auto; height: auto; font-size: 16px; }
  :root { --barH: auto; --ctrlH: 64px; }
  .bar { position: static; height: auto; flex-wrap: wrap; gap: 6px 12px; padding-top: 12px; padding-bottom: 8px; background: var(--bg); }
  .chapters { flex-basis: 100%; order: 3; }
  .chapters button { font-size: 11px; }
  .counter { margin-left: auto; }
  .viz { position: sticky; top: 0; height: auto; z-index: 3; background: var(--bg); box-shadow: 0 12px 18px -16px rgba(0,0,0,.35); }
  .viz canvas { position: relative; height: 44dvh; min-height: 250px; max-height: 420px; }
  .caption { top: 8px; left: 14px; right: 14px; font-size: 12.5px; }
  .knobs { position: static; max-width: none; margin: 0; border-radius: 0; border-width: 1px 0 0; box-shadow: none; padding: 8px 16px 10px; gap: 6px; }
  .text { position: static; width: auto; padding: 22px 20px calc(var(--ctrlH) + 24px); overflow: visible; background: none; }
  .text p.lead { font-size: 17px; }
  .watermark { display: none; }
  .controls > button { padding: 9px 14px; }
  .dots { display: none; }
  .controls { justify-content: space-between; }
  .viz canvas { height: 42dvh; }
}
@media (max-width: 480px) { .chapters button .lbl .long { display: none; } .brand span { display: none; } }
@media (prefers-reduced-motion: reduce) { .text > *, details[open] > *, .explain, .opt { animation: none !important; } }
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="/mixalis/dianismata">← Διανύσματα</a>
  <div class="brand">Συντεταγμένες <span>· η θεωρία</span></div>
  <nav class="chapters" id="chapters" aria-label="Κεφάλαια"></nav>
  <div class="counter" id="counter" aria-live="polite">1 / 1</div>
</header>

<div class="watermark" id="wm" aria-hidden="true">Α</div>

<div class="viz" id="viz">
  <canvas id="cv" aria-label="Κινούμενο σχέδιο της διαφάνειας"></canvas>
  <div class="caption" id="caption"></div>
  <div class="knobs" id="knobs" hidden></div>
</div>

<main class="text" id="text"></main>

<nav class="controls" aria-label="Πλοήγηση διαφανειών">
  <button id="prev" type="button">← Πίσω</button>
  <div class="dots" id="dots"></div>
  <button id="next" type="button" class="primary">Επόμενο →</button>
</nav>

<script>
/* ═══════════════════════════ CONTENT ═══════════════════════════ */
const V = (s) => `<span class='vec'>${s}</span>`;
const FR = (a, b) => `<span class='frac'><span>${a}</span><span>${b}</span></span>`;
const DET = (a, b, c, d) => `<span class='det'><span>${a}</span><span>${b}</span><span>${c}</span><span>${d}</span></span>`;

const CHAPTERS = [
  { id: "A", name: "Α. Άξονες", long: "Το σύστημα συντεταγμένων" },
  { id: "B", name: "Β. Διάνυσμα", long: "Συντεταγμένες διανύσματος" },
  { id: "C", name: "Γ. Σημεία", long: "Μέσο, μέτρο, απόσταση" },
  { id: "D", name: "Δ. Κατεύθυνση", long: "Γωνία, λ, παραλληλία" },
];

const SLIDES = [
  /* ─────────────── Α. ΑΞΟΝΕΣ ─────────────── */
  { ch: "A", kicker: "Ξεκινάμε", title: "Διανύσματα με αριθμούς", h1: true, scene: "hook", caption: "Το ίδιο βέλος, όπου κι αν το βάλεις: 3 δεξιά, 2 πάνω", html: `
    <p class="lead">Μέχρι τώρα τα διανύσματα ήταν βέλη που τα σχεδίαζες. Από εδώ και πέρα κάθε διάνυσμα θα γίνεται <b>δύο αριθμοί</b>.</p>
    <p>Κοίτα δεξιά: το βέλος μετακινείται, αλλά κάθε φορά κάνει την ίδια διαδρομή, <b>3 βήματα δεξιά και 2 πάνω</b>. Γι' αυτό το λέμε απλά ${V("α")} = (3, 2).</p>
    <p>Με αυτή την ιδέα οι πράξεις, το μέτρο, το μέσο και η παραλληλία γίνονται απλοί λογαριασμοί, χωρίς σχήμα.</p>
    <p class="note">Προχώρα με «Επόμενο», με τα βέλη του πληκτρολογίου ή σέρνοντας το δάχτυλο. Όπου υπάρχουν μπάρες, πείραξέ τες. Τα κουτιά «Δοκίμασε» είναι οι ασκήσεις του Δημήτρη: λύσε τες στο τετράδιο και μετά άνοιξε τη λύση.</p>` },

  { ch: "A", kicker: "Σχολικό §1.4", title: "Ο άξονας", scene: "axis", caption: "Το σημείο M(x) και το διάνυσμα OM = x·i",
    knobs: [{ id: "x", label: "τετμημένη x", min: -4, max: 4, step: 0.5, value: 2.5, unit: "" }], html: `
    <p class="lead">Πάνω σε μια ευθεία x′x παίρνουμε δύο σημεία O και I, ώστε το ${V("OI")} να έχει <b>μέτρο 1</b>. Το ${V("OI")} = ${V("i")} το λέμε <b>μοναδιαίο διάνυσμα</b>.</p>
    <p>Τότε έχουμε έναν <b>άξονα</b> με αρχή το O. Η Ox είναι ο <b>θετικός</b> ημιάξονας και η Ox′ ο <b>αρνητικός</b>.</p>
    <p>Για κάθε σημείο M του άξονα, το ${V("OM")} είναι παράλληλο στο ${V("i")}, άρα υπάρχει <b>ένας μόνο</b> αριθμός x με</p>
    <div class="formula">${V("OM")} = x · ${V("i")}</div>
    <p>Τον x τον λέμε <b>τετμημένη</b> του M και γράφουμε M(x). Μετακίνησε τη μπάρα: αρνητικό x σημαίνει ότι το M είναι στον αρνητικό ημιάξονα.</p>` },

  { ch: "A", kicker: "Σχολικό §1.4", title: "Το καρτεσιανό επίπεδο Oxy", scene: "plane", caption: "Μετακίνησε το M: οι προβολές του δίνουν τις συντεταγμένες",
    knobs: [{ id: "x", label: "x", min: -4, max: 4, step: 0.5, value: 3, unit: "" }, { id: "y", label: "y", min: -3, max: 3, step: 0.5, value: 2, unit: "" }], html: `
    <p class="lead">Δύο κάθετοι άξονες x′x και y′y με κοινή αρχή O και μοναδιαία διανύσματα ${V("i")} και ${V("j")} φτιάχνουν ένα <b>ορθοκανονικό σύστημα συντεταγμένων</b> Oxy.</p>
    <p><b>Ορθο-</b> γιατί οι άξονες είναι κάθετοι, <b>-κανονικό</b> γιατί τα ${V("i")}, ${V("j")} είναι ισομήκη.</p>
    <p>Από το M φέρνουμε παράλληλες στους άξονες: το M₁ δίνει την <b>τετμημένη x</b>, το M₂ την <b>τεταγμένη y</b>. Γράφουμε M(x, y).</p>
    <p class="note"><b>Αποστάσεις από τους άξονες</b> (Σαββάλας): το M(x, y) απέχει <b>|y|</b> από τον x′x και <b>|x|</b> από τον y′y. Προσοχή, είναι ανάποδα απ' ό,τι περιμένεις!</p>` },

  /* ─────────────── Β. ΣΥΝΤΕΤΑΓΜΕΝΕΣ ΔΙΑΝΥΣΜΑΤΟΣ ─────────────── */
  { ch: "B", kicker: "Ο ορισμός", title: "Κάθε διάνυσμα γράφεται x·i + y·j", scene: "components", caption: "Πράσινο: x·i · μωβ: y·j · μπλε: α = x·i + y·j",
    knobs: [{ id: "x", label: "x", min: -4, max: 4, step: 0.5, value: 3, unit: "" }, { id: "y", label: "y", min: -3, max: 4, step: 0.5, value: 2, unit: "" }], html: `
    <p class="lead">Σχεδιάζουμε το ${V("α")} με αρχή το O: ${V("OA")} = ${V("α")}. Αν A₁, A₂ οι προβολές του A στους άξονες, τότε</p>
    <div class="formula">${V("OA")} = ${V("OA")}₁ + ${V("OA")}₂ = x${V("i")} + y${V("j")}</div>
    <p>Δηλαδή κάθε διάνυσμα είναι <b>γραμμικός συνδυασμός</b> των ${V("i")}, ${V("j")}. Τα x${V("i")} και y${V("j")} λέγονται <b>συνιστώσες</b> του ${V("α")}, οι αριθμοί x, y <b>συντεταγμένες</b> του (τετμημένη και τεταγμένη).</p>
    <div class="formula">${V("α")} = x${V("i")} + y${V("j")}  ⇔  ${V("α")} = (x, y)</div>
    <p>Ειδικά: ${V("i")} = (1, 0) και ${V("j")} = (0, 1). Ο συντελεστής του ${V("i")} πάει πρώτος, του ${V("j")} δεύτερος.</p>` },

  { ch: "B", kicker: "Μοναδικότητα", title: "Ίσα διανύσματα, ίσες συντεταγμένες", scene: "unique", caption: "Όλα τα μπλε βέλη είναι το ίδιο διάνυσμα (2, 1)", html: `
    <p class="lead">Η γραφή ${V("α")} = x${V("i")} + y${V("j")} είναι <b>μοναδική</b>. Γιατί; Αν και ${V("α")} = x′${V("i")} + y′${V("j")} με x ≠ x′, τότε</p>
    <div class="formula">${V("i")} = ${FR("y′ − y", "x − x′")} ${V("j")}  ⇒  ${V("i")} // ${V("j")}</div>
    <p>που είναι <b>άτοπο</b>, αφού οι άξονες είναι κάθετοι. Άρα x = x′ και y = y′.</p>
    <p>Συνέπειες, για ${V("α")} = (x₁, y₁), ${V("β")} = (x₂, y₂):</p>
    <ul class="recap"><li>${V("α")} = ${V("β")}  ⇔  x₁ = x₂ <b>και</b> y₁ = y₂</li><li>${V("α")} = ${V("0")}  ⇔  x = 0 <b>και</b> y = 0</li></ul>
    <details class="try"><summary>Δοκίμασε (Δημήτρης): ίσα και μηδενικό</summary>
      <p><b>1.</b> Βρες k, λ ώστε ${V("α")} = (k² − 1, λ − 1) και ${V("β")} = (3, 2k + 1) να είναι ίσα.</p>
      <p><b>2.</b> Βρες k, λ ώστε το ${V("u")} = (k² + k − 2, 3λ − 3) να είναι μηδενικό.</p>
      <details class="sol"><summary>Λύση</summary>
        <p><b>1.</b> k² − 1 = 3 ⇒ k = 2 ή k = −2. Και λ − 1 = 2k + 1 ⇒ λ = 2k + 2. Για k = 2: λ = 6. Για k = −2: λ = −2. Δύο ζευγάρια: (k, λ) = (2, 6) ή (−2, −2).</p>
        <p><b>2.</b> k² + k − 2 = 0 ⇒ k = 1 ή k = −2. Και 3λ − 3 = 0 ⇒ λ = 1.</p>
      </details>
    </details>` },

  { ch: "B", kicker: "Πράξεις", title: "Πράξεις: συντεταγμένη με συντεταγμένη", scene: "ops", caption: "α = (1, −1), β = (1, 2): τα βέλη μπαίνουν το ένα μετά το άλλο",
    chips: [{ id: "op", label: "Δείξε:", options: [["sum", "α + β"], ["diff", "α − β"], ["dbl", "2α"], ["mix", "2α − β"]], value: "sum" }], html: `
    <p class="lead">Για ${V("α")} = (x₁, y₁), ${V("β")} = (x₂, y₂) και λ, μ ∈ ℝ:</p>
    <div class="formula">${V("α")} + ${V("β")} = (x₁ + x₂, y₁ + y₂)</div>
    <div class="formula">λ${V("α")} = (λx₁, λy₁)</div>
    <div class="formula">λ${V("α")} + μ${V("β")} = (λx₁ + μx₂, λy₁ + μy₂)</div>
    <p>Απόδειξη: γράψε ${V("α")} = x₁${V("i")} + y₁${V("j")}, ${V("β")} = x₂${V("i")} + y₂${V("j")} και μάζεψε τα ${V("i")} και τα ${V("j")}.</p>
    <p>Η αφαίρεση είναι πρόσθεση του αντίθετου: −${V("β")} = (−x₂, −y₂), άρα ${V("α")} − ${V("β")} = (x₁ − x₂, y₁ − y₂).</p>
    <p class="note">Παράδειγμα σχολικού: (1, −1) + (1, 2) = (2, 1), 2${V("α")} = (2, −2), ${V("α")} − ${V("β")} = (0, −3), 2${V("α")} − ${V("β")} = (1, −4). Πάτα τα κουμπιά για να τα δεις.</p>` },

  { ch: "B", kicker: "Ειδικές θέσεις", title: "Πότε είναι παράλληλο σε άξονα", scene: "axispar", caption: "α = (λ² − 4, λ − 2): πείραξε το λ",
    knobs: [{ id: "l", label: "λ", min: -4, max: 4, step: 0.25, value: 1, unit: "" }], html: `
    <p class="lead">Για ${V("α")} = (x, y) ≠ ${V("0")}:</p>
    <ul class="recap"><li>x = 0  ⇒  ${V("α")} // y′y (κατακόρυφο)</li><li>y = 0  ⇒  ${V("α")} // x′x (οριζόντιο)</li></ul>
    <p class="trap"><b>Παγίδα:</b> μην ξεχάσεις τον έλεγχο ${V("α")} ≠ ${V("0")}. Το μηδενικό διάνυσμα είναι παράλληλο με όλα, οπότε οι ασκήσεις ζητούν «μη μηδενικό και παράλληλο».</p>
    <details class="try"><summary>Δοκίμασε (Δημήτρης): ${V("α")} = (λ² − 4, λ − 2)</summary>
      <p>Βρες το λ ώστε: (i) ${V("α")} = ${V("0")}, (ii) ${V("α")} ≠ ${V("0")} και ${V("α")} // x′x, (iii) ${V("α")} ≠ ${V("0")} και ${V("α")} // y′y.</p>
      <details class="sol"><summary>Λύση</summary>
        <p><b>(i)</b> λ² − 4 = 0 και λ − 2 = 0 ⇒ λ = 2.</p>
        <p><b>(ii)</b> y = 0 ⇒ λ = 2. Τότε όμως και x = 0, δηλαδή ${V("α")} = ${V("0")}. <b>Κανένα λ</b> δεν κάνει. Δες το στη μπάρα!</p>
        <p><b>(iii)</b> x = 0 ⇒ λ = ±2. Το λ = 2 δίνει μηδενικό, άρα <b>λ = −2</b> και ${V("α")} = (0, −4).</p>
      </details>
    </details>` },

  { ch: "C", kicker: "Σημείο και διάνυσμα", title: "Το διάνυσμα θέσης", scene: "position", caption: "Το A κινείται: οι συντεταγμένες του A και του OA είναι πάντα ίδιες", html: `
    <p class="lead">Αν ένα διάνυσμα έχει αρχή το O(0, 0), οι συντεταγμένες του <b>συμπίπτουν</b> με τις συντεταγμένες του τέλους του:</p>
    <div class="formula">A(x, y)  ⇔  ${V("OA")} = (x, y)</div>
    <p>Το ${V("OA")} λέγεται <b>διάνυσμα θέσης</b> ή <b>διανυσματική ακτίνα</b> του A. Είναι η «γέφυρα» ανάμεσα σε σημεία και διανύσματα: κάθε φορά που έχεις σημεία, γράφεις τις διανυσματικές τους ακτίνες και κάνεις πράξεις.</p>
    <p class="note">Γι' αυτό σε όλες τις αποδείξεις που ακολουθούν βλέπεις πρώτα «${V("OA")} = (x₁, y₁), ${V("OB")} = (x₂, y₂)».</p>` },

  { ch: "C", kicker: "Ο πιο χρήσιμος τύπος", title: "AB = τέλος μείον αρχή", scene: "ab", caption: "Από το A στο B: πόσο δεξιά και πόσο πάνω;",
    chips: [{ id: "ex", label: "Παράδειγμα:", options: [["d", "Δημήτρης"], ["s", "Σχολικό"], ["v", "Σαββάλας"]], value: "d" }], html: `
    <p class="lead">Για A(x₁, y₁) και B(x₂, y₂), αφού ${V("AB")} = ${V("OB")} − ${V("OA")}:</p>
    <div class="formula">${V("AB")} = (x₂ − x₁, y₂ − y₁)</div>
    <p>Δηλαδή <b>τετμημένη του ${V("AB")} = τετμημένη του B (τέλους) − τετμημένη του A (αρχής)</b>, και το ίδιο για την τεταγμένη.</p>
    <p>Δημήτρης: A(−2, 3), B(5, −7) ⇒ ${V("AB")} = (5 − (−2), −7 − 3) = (7, −10).</p>
    <p class="trap"><b>Παγίδα:</b> «τέλος μείον αρχή», όχι ανάποδα. Το ${V("BA")} = −${V("AB")}. Και πρόσεχε τα πρόσημα: 5 − (−2) = 7.</p>` },

  { ch: "C", kicker: "Δοκίμασε", title: "Βρες σημείο από ισότητα διανυσμάτων", scene: "ak", caption: "A(−1, 1), B(2, −1), Γ(3, 4)", html: `
    <p class="lead">Δημήτρης: δίνονται A(−1, 1), B(2, −1), Γ(3, 4). Βρες σημεία K, Λ ώστε ${V("AK")} = 2${V("BΓ")} και ${V("AΛ")} = 3${V("BΓ")}.</p>
    <p>Η τεχνική: ονόμασε το άγνωστο σημείο K(x, y), γράψε <b>και τα δύο μέλη</b> με συντεταγμένες και εξίσωσε τετμημένες και τεταγμένες.</p>
    <details class="sol"><summary>Λύση</summary>
      <p>${V("BΓ")} = (3 − 2, 4 − (−1)) = (1, 5).</p>
      <p>${V("AK")} = (x + 1, y − 1) = 2(1, 5) = (2, 10) ⇒ x = 1, y = 11. Άρα <b>K(1, 11)</b>.</p>
      <p>${V("AΛ")} = (x + 1, y − 1) = 3(1, 5) = (3, 15) ⇒ <b>Λ(2, 16)</b>.</p>
      <p class="note">Τα K, Λ είναι πάνω στην ευθεία από το A παράλληλη στο ${V("BΓ")}, όπως βλέπεις στο σχήμα.</p>
    </details>` },

  { ch: "C", kicker: "Σχολικό §1.4", title: "Συντεταγμένες μέσου τμήματος", scene: "mid", caption: "Το M μένει πάντα στη μέση: OM = ½(OA + OB)", html: `
    <p class="lead">Αν M(x, y) είναι το μέσο του AB με A(x₁, y₁), B(x₂, y₂):</p>
    <div class="formula">x = ${FR("x₁ + x₂", "2")}   y = ${FR("y₁ + y₂", "2")}</div>
    <p>Απόδειξη: ${V("OM")} = ½(${V("OA")} + ${V("OB")}), άρα (x, y) = ½[(x₁, y₁) + (x₂, y₂)] = (${FR("x₁ + x₂", "2")}, ${FR("y₁ + y₂", "2")}).</p>
    <p>Στο σχήμα το διακεκομμένο είναι το ${V("OA")} + ${V("OB")} (διαγώνιος του παραλληλογράμμου) και το M είναι στη μέση του.</p>
    <p class="note">Σαββάλας: A(2, 5), B(1, −3) ⇒ M(${FR("2 + 1", "2")}, ${FR("5 − 3", "2")}) = M(3/2, 1).</p>
    <p class="note">Ανάποδα: αν ξέρεις το μέσο M και το A, τότε <b>B = 2M − A</b>, δηλαδή x₂ = 2x − x₁, y₂ = 2y − y₁.</p>` },

  { ch: "C", kicker: "Εφαρμογή", title: "Παραλληλόγραμμο: οι διαγώνιες διχοτομούνται", scene: "para", caption: "Το κέντρο K είναι μέσο και της ΑΓ και της ΒΔ",
    chips: [{ id: "ex", label: "Άσκηση:", options: [["d", "Δημήτρης"], ["s", "Σχολικό"]], value: "d" }], html: `
    <p class="lead">Σε παραλληλόγραμμο ΑΒΓΔ το κέντρο K είναι <b>μέσο και των δύο διαγωνίων</b>. Αυτό λύνει σχεδόν κάθε άσκηση με παραλληλόγραμμο.</p>
    <details class="try"><summary>Δοκίμασε (Δημήτρης)</summary>
      <p>Δίνονται οι κορυφές A(2, 3), B(4, −1), Γ(0, 5) παραλληλογράμμου ΑΒΓΔ. Βρες το κέντρο K και την κορυφή Δ.</p>
      <details class="sol"><summary>Λύση</summary>
        <p>K μέσο της ΑΓ: K(${FR("2 + 0", "2")}, ${FR("3 + 5", "2")}) = <b>K(1, 4)</b>.</p>
        <p>K μέσο της ΒΔ: 1 = ${FR("4 + x", "2")} ⇒ x = −2 και 4 = ${FR("−1 + y", "2")} ⇒ y = 9. Άρα <b>Δ(−2, 9)</b>.</p>
        <p>Έλεγχος: ${V("AB")} = (2, −4) και ${V("ΔΓ")} = (2, −4). Ίσα, άρα σωστά.</p>
      </details>
    </details>
    <p class="note">Σχολικό (Εφαρμογή 1): A(−2, 1), B(1, 4) και κέντρο K(2, −3) ⇒ Γ(6, −7) και Δ(3, −10). Διάλεξε «Σχολικό» στα κουμπιά.</p>` },

  { ch: "C", kicker: "Σχολικό, Εφαρμογή 2", title: "Κέντρο βάρους τριγώνου", scene: "centroid", caption: "A(−1, 1), B(2, 0), Γ(2, −3)", html: `
    <p class="lead">Το κέντρο βάρους G του τριγώνου ΑΒΓ, αφού ${V("OG")} = ${FR(V("OA") + " + " + V("OB") + " + " + V("OΓ"), "3")}, έχει</p>
    <div class="formula">x = ${FR("x₁ + x₂ + x₃", "3")}   y = ${FR("y₁ + y₂ + y₃", "3")}</div>
    <details class="try"><summary>Δοκίμασε (Δημήτρης)</summary>
      <p>Τρίγωνο ΑΒΓ με A(−1, 1), B(2, 0), Γ(2, −3). Βρες τις συντεταγμένες της διαμέσου ${V("AM")} και του σημείου Δ με ${V("BΔ")} = ${V("AΓ")}.</p>
      <details class="sol"><summary>Λύση</summary>
        <p>M μέσο της ΒΓ: M(${FR("2 + 2", "2")}, ${FR("0 − 3", "2")}) = M(2, −3/2). Άρα ${V("AM")} = (2 + 1, −3/2 − 1) = <b>(3, −5/2)</b>.</p>
        <p>${V("AΓ")} = (3, −4). Αν Δ(x, y): ${V("BΔ")} = (x − 2, y) = (3, −4) ⇒ <b>Δ(5, −4)</b>.</p>
        <p>Μπόνους: G(${FR("−1 + 2 + 2", "3")}, ${FR("1 + 0 − 3", "3")}) = G(1, −2/3), πάνω στη διάμεσο AM.</p>
      </details>
    </details>` },

  { ch: "C", kicker: "Μέτρο", title: "Το μέτρο είναι Πυθαγόρειο", scene: "norm", caption: "Οι κάθετες πλευρές είναι |x| και |y|",
    knobs: [{ id: "x", label: "x", min: -5, max: 5, step: 0.5, value: 3, unit: "" }, { id: "y", label: "y", min: -4, max: 4, step: 0.5, value: 4, unit: "" }], html: `
    <p class="lead">Για ${V("α")} = (x, y), στο ορθογώνιο τρίγωνο OA₁A οι κάθετες πλευρές είναι (OA₁) = |x| και (A₁A) = (OA₂) = |y|. Πυθαγόρειο:</p>
    <div class="formula">|${V("α")}| = √(x² + y²)</div>
    <p>Σαββάλας: ${V("α")} = (5, −12) ⇒ |${V("α")}| = √(25 + 144) = √169 = 13. Δημήτρης: (−4, 3) ⇒ √(16 + 9) = 5.</p>
    <details class="try"><summary>Δοκίμασε (Δημήτρης): μέτρο μέσα στις συντεταγμένες</summary>
      <p>Βρες το |${V("α")}| αν ${V("α")} = (−3, ${FR("|" + V("α") + "| + 3", "2")}).</p>
      <details class="sol"><summary>Λύση</summary>
        <p>Βάλε m = |${V("α")}| ≥ 0. Τότε m² = 9 + ${FR("(m + 3)²", "4")} ⇒ 4m² = 36 + m² + 6m + 9 ⇒ 3m² − 6m − 45 = 0 ⇒ m² − 2m − 15 = 0.</p>
        <p>m = 5 ή m = −3. Το μέτρο δεν είναι αρνητικό, άρα <b>|${V("α")}| = 5</b> και ${V("α")} = (−3, 4). Έλεγχος: √(9 + 16) = 5 ✓.</p>
      </details>
    </details>` },

  { ch: "C", kicker: "Απόσταση", title: "Απόσταση δύο σημείων", scene: "dist", caption: "(AB) = |AB|: το μέτρο του διανύσματος AB",
    chips: [{ id: "ex", label: "Παράδειγμα:", options: [["s", "Σχολικό"], ["v", "Σαββάλας"]], value: "s" }], html: `
    <p class="lead">Η απόσταση των A και B είναι το μέτρο του ${V("AB")} = (x₂ − x₁, y₂ − y₁):</p>
    <div class="formula">(AB) = √((x₂ − x₁)² + (y₂ − y₁)²)</div>
    <p>Σχολικό: A(2, −7), B(5, −3) ⇒ (AB) = √(3² + 4²) = 5.</p>
    <p>Σαββάλας: A(8, 3), B(2, −5) ⇒ (AB) = √((−6)² + (−8)²) = √100 = 10.</p>
    <p class="note">Η σειρά δεν πειράζει εδώ, γιατί υψώνεις στο τετράγωνο: (AB) = (BA). Στο ${V("AB")} όμως η σειρά μετράει!</p>
    <p class="note">Τρικ για ασκήσεις «σημείο του x′x που ισαπέχει από A και B»: πάρε M(x, 0), γράψε (MA)² = (MB)² και λύσε. Τα τετράγωνα σε γλιτώνουν από τις ρίζες.</p>` },

  { ch: "C", kicker: "Δοκίμασε", title: "Τρίγωνα και τετράπλευρα με αποστάσεις", scene: "trap", caption: "",
    chips: [{ id: "ex", label: "Άσκηση:", options: [["t", "1. Τραπέζιο"], ["e", "2. Ισόπλευρο"]], value: "t" }], html: `
    <p class="lead">Με διανύσματα δείχνεις <b>παραλληλία</b> (πλευρές // ). Με αποστάσεις δείχνεις <b>ισότητα πλευρών</b>.</p>
    <details class="try"><summary>1. (Δημήτρης) Ισοσκελές τραπέζιο</summary>
      <p>Δείξε ότι τα A(−4, −6), B(5, 3), Γ(−4, −1), Δ(0, 3) είναι κορυφές ισοσκελούς τραπεζίου.</p>
      <details class="sol"><summary>Λύση</summary>
        <p>${V("AB")} = (9, 9) και ${V("ΓΔ")} = (4, 4). Είναι ${V("AB")} = ${FR("9", "4")}${V("ΓΔ")}, άρα <b>ΑΒ // ΓΔ</b> (οι βάσεις).</p>
        <p>${V("AΓ")} = (0, 5) και ${V("BΔ")} = (−5, 0): δεν είναι παράλληλα, άρα είναι τα σκέλη. Και (ΑΓ) = 5 = (ΒΔ).</p>
        <p>Άρα το ΑΒΔΓ είναι <b>ισοσκελές τραπέζιο</b>. Πρόσεξε: η σειρά των κορυφών είναι Α, Β, Δ, Γ.</p>
      </details>
    </details>
    <details class="try"><summary>2. (Δημήτρης) Ισόπλευρο τρίγωνο</summary>
      <p>Αν B(4, 0), Γ(0, 6), βρες τα σημεία A(x, y) ώστε το ΑΒΓ να είναι ισόπλευρο.</p>
      <details class="sol"><summary>Λύση</summary>
        <p>(ΒΓ)² = 16 + 36 = 52. Θέλουμε (AB)² = (AΓ)² = 52.</p>
        <p>(AB)² = (AΓ)²: (x − 4)² + y² = x² + (y − 6)² ⇒ −8x + 16 = −12y + 36 ⇒ <b>2x = 3y − 5</b>.</p>
        <p>Βάλε x = (3y − 5)/2 στο (x − 4)² + y² = 52: ${FR("(3y − 13)²", "4")} + y² = 52 ⇒ 13y² − 78y − 39 = 0 ⇒ y² − 6y − 3 = 0 ⇒ y = 3 ± 2√3.</p>
        <p>Τότε x = 2 ± 3√3. Δύο λύσεις: <b>A(2 + 3√3, 3 + 2√3)</b> ή <b>A(2 − 3√3, 3 − 2√3)</b>, μία από κάθε μεριά της ΒΓ.</p>
      </details>
    </details>` },

/* ═══════════════════════════ DRAWING KIT ═══════════════════════════ */
let COL = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["ink", "muted", "line", "accent", "a", "b", "r", "j", "K", "bench", "grid", "paper", "ok", "bad", "axis"]) COL[k] = cs.getPropertyValue("--" + k).trim();
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
// W, H: the drawing region (right of the text panel on desktop); CW, CH: the whole canvas. RX, RY: region offset.
let W = 0, H = 0, CW = 0, CH = 0, RX = 0, RY = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
}
new ResizeObserver(resize).observe(cv);

const FONT = (s, w = 700) => `${w} ${s}px Commissioner, "Segoe UI", system-ui, sans-serif`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const num = (v, d = 2) => (Math.abs(v) < 0.005 ? 0 : v).toLocaleString("el-GR", { maximumFractionDigits: d });

  sumpar(t) {

    const a = [2, 1], b = same ? [3, 1.5] : [-3, -1.5];
    const s = [a[0] + b[0], a[1] + b[1]];
    const P = plane(-2.5, 6, -1.6, 3.4);
    const k = ease(seg(t, 0.3, 1.1)), k2 = ease(seg(t, 1.3, 2.0));
    vec(P, 0, 0, a[0], a[1], COL.a, 3.4);
    vec(P, a[0], a[1], a[0] + b[0] * k, a[1] + b[1] * k, COL.b, 3.4, { alpha: 0.9 });
    if (k2 > 0) { ctx.save(); ctx.translate(0, 18); vec(P, 0, 0, s[0] * k2, s[1] * k2, COL.r, 3.4); ctx.restore(); }
    vtext("α", P.X(1) - 4, P.Y(0.5) - 8, COL.a, 15); vtext("β", P.X(a[0] + b[0] / 2) + 8, P.Y(a[1] + b[1] / 2) - 10, COL.b, 15);
    const na = Math.hypot(...a), nb = Math.hypot(...b), ns = Math.hypot(...s);
    tag(same ? "β = 1,5·α  (k > 0, ↑↑)" : "β = −1,5·α  (k < 0, ↑↓)", 12, 22, COL.ink);
    tag(`|α| = ${num(na, 2)}   |β| = ${num(nb, 2)}`, 12, 48, COL.muted);
    if (k2 >= 1) tag(same ? `|α + β| = ${num(ns, 2)} = |α| + |β|` : `|α + β| = ${num(ns, 2)} = ||α| − |β||`, 12, 74, COL.r);
  },
  collinear(t) {
    const m = UI.collinear.m;
    const A = [1, 0], B = [-m * m, 3], G = [-5 * m, 9];
    const D = (B[0] - A[0]) * (G[1] - A[1]) - (G[0] - A[0]) * (B[1] - A[1]);
    const P = plane(-11, 6.5, -1, 10);
    const ok = Math.abs(D) < 1e-6;
    if (ok) { const dx = G[0] - A[0], dy = G[1] - A[1]; line(P, A[0] - dx * 0.12, A[1] - dy * 0.12, G[0] + dx * 0.08, G[1] + dy * 0.08, COL.ok, 2.4); }
    else poly(P, [A, B, G], COL.a, COL.muted, 0.12);
    vec(P, A[0], A[1], B[0], B[1], COL.a, 2.6); vec(P, A[0], A[1], G[0], G[1], COL.b, 2.6);
    dot(P, A[0], A[1], COL.ink, "A(1, 0)", "e", { labelColor: COL.ink });
    dot(P, B[0], B[1], COL.a, `B${pt(B[0], B[1])}`, "w"); dot(P, G[0], G[1], COL.b, `Γ${pt(G[0], G[1])}`, G[0] < -3 ? "e" : "w");
    tag(`μ = ${fmt(m)}`, 12, 22, COL.ink);
    tag(`det(AB, AΓ) = ${num(D, 2).replace("-", "−")}`, 12, 48, ok ? COL.ok : COL.ink);
    tag(ok ? "συνευθειακά!" : "τρίγωνο", 12, 74, ok ? COL.ok : COL.muted);
  },
  recap(t) {
    const A = [-2, 1], B = [3, 3], M = [0.5, 2];
    const P = plane(-4, 5, -1.6, 4.4);
    vec(P, 0, 0, A[0], A[1], COL.muted, 2, { alpha: 0.5 }); vec(P, 0, 0, B[0], B[1], COL.muted, 2, { alpha: 0.5 });
    poly(P, [A, [B[0], A[1]], B], COL.a, null, 0.08);
    dashed(P, A[0], A[1], B[0], A[1], COL.r); dashed(P, B[0], A[1], B[0], B[1], COL.j);
    vec(P, A[0], A[1], B[0], B[1], COL.ok, 3.4);
    angleArc(P, A[0], A[1], 30, 0, Math.atan2(2, 5), COL.K, "φ");
    dot(P, A[0], A[1], COL.ink, "A(−2, 1)", "w", { labelColor: COL.ink }); dot(P, B[0], B[1], COL.ink, "B(3, 3)", "n", { labelColor: COL.ink }); dot(P, M[0], M[1], COL.r, "M(1/2, 2)", "nw");
    tag("AB = (5, 2)", 12, 22, COL.ok); tag("(AB) = √29", 12, 48, COL.a); tag("λ = 2/5 = εφφ", 12, 74, COL.K);
  },
  quiz(t) {
    const P = plane(-3, 3, -2.6, 2.6, { ticks: false });
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = t * 0.4 + (i * 2 * Math.PI) / n, r = 1.6 + 0.4 * Math.sin(t + i);
      vec(P, 0, 0, r * Math.cos(a), r * Math.sin(a), [COL.a, COL.b, COL.r, COL.j, COL.K][i], 3);
    }
    ctx.fillStyle = COL.paper; ctx.beginPath(); ctx.arc(W / 2, H / 2, 34, 0, 7); ctx.fill();
    text("?", W / 2, H / 2 + 22, COL.ink, 60, "center", 800);
  },
};

/* ═══════════════════════════ SLIDE ENGINE ═══════════════════════════ */
const textEl = document.getElementById("text"), capEl = document.getElementById("caption"), counter = document.getElementById("counter");
const knobsEl = document.getElementById("knobs");
const prev = document.getElementById("prev"), next = document.getElementById("next"), dots = document.getElementById("dots"), chaptersEl = document.getElementById("chapters");
let idx = 0, t0 = performance.now();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const QUIZ_STATE = {};
for (const id in QUIZZES) QUIZ_STATE[id] = { i: 0, answers: QUIZZES[id].map(() => null) };
try { const saved = JSON.parse(localStorage.getItem("dianismata-theory-quiz") || "{}"); for (const id in saved) if (QUIZ_STATE[id] && saved[id].answers?.length === QUIZZES[id].length) QUIZ_STATE[id] = saved[id]; } catch (e) {}
function saveQuiz() { try { localStorage.setItem("dianismata-theory-quiz", JSON.stringify(QUIZ_STATE)); } catch (e) {} }

// default knob/chip values
SLIDES.forEach((s) => {
  UI[s.scene] = UI[s.scene] || {};
  (s.knobs || []).forEach((k) => (UI[s.scene][k.id] = k.value));
  (s.chips || []).forEach((c) => (UI[s.scene][c.id] = c.value));
});

CHAPTERS.forEach((c) => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.ch = c.id;
  b.innerHTML = `<span class="lbl">${c.name}<span class="long"> · ${c.long}</span></span><span class="bar2"><i></i></span>`;
  b.addEventListener("click", () => go(SLIDES.findIndex((s) => s.ch === c.id)));
  chaptersEl.appendChild(b);
});
SLIDES.forEach((s, i) => {
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Διαφάνεια ${i + 1}: ${s.title}`);
  if (s.quiz) b.classList.add("quizdot");
  b.addEventListener("click", () => go(i)); dots.appendChild(b);
});

const fmtKnob = (k, v) => `${num(v, k.step < 0.01 ? 3 : k.step < 0.5 ? 2 : 1)} ${k.unit}`;
function renderKnobs(s) {
  knobsEl.innerHTML = "";
  const has = (s.knobs && s.knobs.length) || (s.chips && s.chips.length) || s.replay;
  knobsEl.hidden = !has;
  if (!has) return;
  (s.chips || []).forEach((c) => {
    const row = document.createElement("div"); row.className = "chips";
    row.innerHTML = `<span>${c.label}</span>`;
    c.options.forEach(([val, lbl]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = lbl; b.setAttribute("aria-pressed", UI[s.scene][c.id] === val ? "true" : "false");
      b.addEventListener("click", () => { UI[s.scene][c.id] = val; [...row.querySelectorAll("button")].forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); if (s.scene === "lab") UI.lab.t0 = (performance.now() - t0) / 1000; });
      row.appendChild(b);
    });
    if (s.replay) { const r = document.createElement("button"); r.type = "button"; r.className = "replay"; r.textContent = "↺ Ξανά"; r.addEventListener("click", () => (UI.lab.t0 = (performance.now() - t0) / 1000)); row.appendChild(r); }
    knobsEl.appendChild(row);
  });
  const grid = document.createElement("div"); grid.style.display = "grid"; grid.style.gap = "8px 18px";
  grid.style.gridTemplateColumns = (s.knobs || []).length > 2 ? "repeat(auto-fit, minmax(150px, 1fr))" : "1fr";
  (s.knobs || []).forEach((k) => {
    const id = `k-${s.scene}-${k.id}`;
    const row = document.createElement("div"); row.className = "knob";
    row.innerHTML = `<label for="${id}">${k.label}</label><output id="${id}-o">${fmtKnob(k, UI[s.scene][k.id])}</output><input id="${id}" type="range" min="${k.min}" max="${k.max}" step="${k.step}" value="${UI[s.scene][k.id]}">`;
    const inp = row.querySelector("input"), out = row.querySelector("output");
    inp.addEventListener("input", () => { UI[s.scene][k.id] = Number(inp.value); out.textContent = fmtKnob(k, UI[s.scene][k.id]); if (s.scene === "lab") UI.lab.t0 = (performance.now() - t0) / 1000; });
    grid.appendChild(row);
  });
  knobsEl.appendChild(grid);
}

const LETTERS = ["Α", "Β", "Γ", "Δ"];
function renderQuiz(s) {
  const id = s.quiz, qs = QUIZZES[id], st = QUIZ_STATE[id], q = qs[st.i], ans = st.answers[st.i];
  const wrap = document.createElement("div"); wrap.className = "quiz";
  wrap.innerHTML = `<div class="qhead"><span>Ερώτηση ${st.i + 1} από ${qs.length}</span><span>${st.answers.filter((a, i) => a === qs[i].a).length} σωστές</span></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((o, j) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt";
    b.innerHTML = `<span class="lt">${LETTERS[j]}</span><span>${o}</span>`;
    if (ans != null) { b.disabled = true; if (j === q.a) b.dataset.state = "right"; else if (j === ans) b.dataset.state = "wrong"; }
    b.addEventListener("click", () => { st.answers[st.i] = j; saveQuiz(); renderQuizInto(s); });
    wrap.appendChild(b);
  });
  if (ans != null) {
    const ex = document.createElement("div"); ex.className = "explain";
    ex.innerHTML = `<b style="color:var(${ans === q.a ? "--ok" : "--bad"})">${ans === q.a ? "Σωστά!" : "Όχι ακριβώς."}</b> ${q.e}`;
    wrap.appendChild(ex);
  }
  const nav = document.createElement("div"); nav.className = "qnav";
  if (st.i > 0) { const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = "← Προηγούμενη"; b.onclick = () => { st.i--; saveQuiz(); renderQuizInto(s); }; nav.appendChild(b); }
  if (st.i < qs.length - 1) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Επόμενη ερώτηση →"; b.disabled = ans == null; b.style.opacity = ans == null ? 0.45 : 1; b.onclick = () => { st.i++; saveQuiz(); renderQuizInto(s); }; nav.appendChild(b); }
  else if (st.answers.every((a) => a != null)) { const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = "↺ Ξανά από την αρχή"; b.onclick = () => { st.i = 0; st.answers = qs.map(() => null); saveQuiz(); renderQuizInto(s); }; nav.appendChild(b); }
  wrap.appendChild(nav);
  return wrap;
}
function renderQuizInto(s) {
  const old = textEl.querySelector(".quiz"); const fresh = renderQuiz(s);
  if (old) old.replaceWith(fresh); else textEl.appendChild(fresh);
  reportHeight();
}

let lastIdx = -1;
const wm = document.getElementById("wm"), viz = document.getElementById("viz"), barEl = document.querySelector(".bar"), ctrlEl = document.querySelector(".controls");
const desktop = matchMedia("(min-width: 901px)");
function render() {
  const s = SLIDES[idx];
  const dir = lastIdx < 0 ? 0 : Math.sign(idx - lastIdx);
  textEl.style.setProperty("--dx", `${dir * 26}px`);
  if (lastIdx >= 0 && lastIdx !== idx) {
    if (!reduce) cv.animate([{ opacity: 0, transform: `translateX(${dir * 30}px) scale(0.985)` }, { opacity: 1, transform: "none" }], { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" });
    textEl.scrollTop = 0;
    if (!desktop.matches && window.scrollY > 0) window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  }
  lastIdx = idx;
  const letter = { A: "Α", B: "Β", C: "Γ", D: "Δ" }[s.ch];
  if (wm.textContent !== letter) { wm.textContent = letter; if (!reduce) wm.animate([{ opacity: 0, transform: "translateY(40px)" }, { opacity: 1, transform: "none" }], { duration: 700, easing: "cubic-bezier(.2,.8,.2,1)" }); }
  textEl.innerHTML = `<div class="kicker">${s.kicker}</div>${s.h1 ? `<h1>${s.title}</h1>` : `<h2>${s.title}</h2>`}${s.html}`;
  if (s.quiz) textEl.appendChild(renderQuiz(s));
  capEl.textContent = s.caption || "";
  counter.textContent = `${idx + 1} / ${SLIDES.length}`;
  prev.disabled = idx === 0; next.disabled = idx === SLIDES.length - 1;
  next.textContent = idx === SLIDES.length - 1 ? "Τέλος" : "Επόμενο →";
  [...dots.children].forEach((d, i) => d.setAttribute("aria-current", i === idx ? "true" : "false"));
  [...chaptersEl.children].forEach((b) => {
    const ch = b.dataset.ch, list = SLIDES.map((x, i) => [x, i]).filter(([x]) => x.ch === ch);
    const first = list[0][1], last = list[list.length - 1][1];
    const frac = idx > last ? 1 : idx < first ? 0 : (idx - first + 1) / list.length;
    b.querySelector("i").style.width = `${frac * 100}%`;
    b.setAttribute("aria-current", s.ch === ch ? "true" : "false");
  });
  renderKnobs(s);
  t0 = performance.now();
  if (s.scene === "lab") UI.lab.t0 = 0;
  try { localStorage.setItem("dianismata-theory-slide", String(idx)); } catch (e) {}
  requestAnimationFrame(reportHeight);
}
function go(i) { idx = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); }
prev.addEventListener("click", () => go(idx - 1));
next.addEventListener("click", () => go(idx + 1));
addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") go(idx + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(idx - 1);
});
let sx = null, sy = null;
const stageEl = document.body;
stageEl.addEventListener("touchstart", (e) => { if (e.target.closest("input, .knobs")) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
stageEl.addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1)); sx = null; });
try { const saved = Number(new URLSearchParams(location.search).get("s") || localStorage.getItem("dianismata-theory-slide")); if (saved > 0 && saved < SLIDES.length) idx = saved; } catch (e) {}
render(); resize();

/* Where the scene may draw: right of the text panel and between the bars (desktop), or the whole sticky canvas (phone). */
function computeRegion() {
  const capH = capEl.textContent ? 26 : 4;
  if (!desktop.matches) { RX = 4; RY = capH + 4; W = CW - 8; H = CH - RY - 6; return; }
  const cr = cv.getBoundingClientRect();
  RX = textEl.getBoundingClientRect().right - cr.left + 6;
  RY = barEl.getBoundingClientRect().bottom - cr.top + capH;
  const bottom = (knobsEl.hidden ? ctrlEl.getBoundingClientRect().top - 8 : knobsEl.getBoundingClientRect().top - 12) - cr.top;
  W = CW - RX - 22; H = bottom - RY;
}
function frame(now) {
  const t = reduce ? 6 : Math.max(0, (now - t0) / 1000);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  computeRegion();
  if (W > 40 && H > 40) { ctx.save(); ctx.translate(RX, RY); try { SCENES[SLIDES[idx].scene](t); } catch (err) { console.error(err); } ctx.restore(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Report height to the embedding page so the iframe never scrolls internally. */
let lastH = 0;
function reportHeight() {
  const h = Math.ceil(document.querySelector(".controls").getBoundingClientRect().bottom + window.scrollY + 18);
  if (h !== lastH && window.parent !== window) { lastH = h; window.parent.postMessage({ type: "dianismata-theory-height", height: h }, "*"); }
}
new ResizeObserver(reportHeight).observe(document.body);
addEventListener("load", reportHeight);
document.fonts && document.fonts.ready.then(reportHeight);
addEventListener("message", (e) => { if (e.data === "dianismata-theory-ping") { lastH = 0; reportHeight(); } });
</script>
</body>
</html>

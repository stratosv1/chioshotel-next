<!doctype html>
<html lang="el" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Πρώτη γνωριμία με το ηλεκτρικό πεδίο</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+Mono:wght@500&display=swap">
<style>
/* Layout: one slide at a time — text column beside a live canvas "bench"; stacks on phones. */
:root {
  --bg: #f4f1ea;
  --paper: #fffdf8;
  --ink: #1d2433;
  --muted: #5d6475;
  --line: #ddd6c8;
  --accent: #2257a6;
  --pos: #d6453b;
  --neg: #2f6fcf;
  --field: #148a52;
  --energy: #d9821c;
  --bench: #f7f4ec;
  --grid: #e7e1d4;
  --display: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --paper: #1a1f2a; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2c3343;
    --accent: #7fa8ee; --pos: #ff7a6e; --neg: #6aa6ff; --field: #45cf8c; --energy: #f3a64a;
    --bench: #151a24; --grid: #222a38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --paper: #1a1f2a; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2c3343;
  --accent: #7fa8ee; --pos: #ff7a6e; --neg: #6aa6ff; --field: #45cf8c; --energy: #f3a64a;
  --bench: #151a24; --grid: #222a38; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6;
  padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.top { width: 100%; max-width: none; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; letter-spacing: 0.02em; font-size: 15px; color: var(--accent); }
.brand span { color: var(--muted); font-weight: 500; }
.counter { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage {
  width: 100%; max-width: none;
  display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); min-height: 620px; overflow: hidden;
}
.text { padding: 8px 40px 8px 0; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.kicker { font-family: var(--display); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 4.2vw, 46px); }
h2 { font-size: clamp(24px, 3vw, 34px); }
.text p { margin: 0; max-width: 34em; }
.text p.lead { font-size: 19px; }
.formula {
  align-self: flex-start; font-family: var(--mono); font-size: 18px; padding: 8px 14px; border-radius: 10px;
  border: 1.5px solid var(--accent); color: var(--accent); background: transparent;
}
.note { font-size: 15px; color: var(--muted); border-left: 3px solid var(--energy); padding-left: 12px; }
.q { font-family: var(--display); font-weight: 700; color: var(--energy); }
.bench { border-left: 1px solid var(--line); position: relative; min-width: 0; display: flex; flex-direction: column; }
.cwrap { position: relative; flex: 1; min-height: 480px; }
.cwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption {
  font-family: var(--display); font-size: 13px; font-weight: 700; color: var(--muted); padding: 2px 0 8px 24px;
}
.controls { width: 100%; max-width: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.controls button {
  font-family: var(--display); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 10px 20px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.controls button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.controls button:disabled { opacity: 0.4; cursor: default; }
.controls button:focus-visible, .dots button:focus-visible { outline: 3px solid var(--energy); outline-offset: 2px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.controls .dots button { width: 11px; min-width: 0; font-size: 0; height: 11px; padding: 0; border-radius: 50%; border: none; background: var(--line); cursor: pointer; }
.controls .dots button[aria-current="true"] { background: var(--accent); width: 26px; border-radius: 6px; }
ul.recap { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 8px; }
a { color: var(--accent); }
.vec { position: relative; display: inline-block; }
.vec::after { content: "→"; position: absolute; left: 0; right: 0; top: -0.62em; font-size: 0.62em; text-align: center; line-height: 1; }
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0 0 24px; font-family: var(--display); }
.mbar span { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 6px; }
.mbar button { font-family: var(--display); font-weight: 700; font-size: 13.5px; border-radius: 999px; padding: 6px 13px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.mbar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mbar button.pause { border-color: var(--accent); color: var(--accent); min-width: 108px; }
.mbar button.pause[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.slide[hidden] { display: none !important; }
@media (max-width: 820px) {
  .dots { order: 3; flex-basis: 100%; }
  .controls { justify-content: space-between; }
  .stage { grid-template-columns: 1fr; min-height: 0; }
  .text { padding: 12px 0; }
  .bench { border-left: none; }
  .cwrap { flex: none; height: 62vw; min-height: 260px; max-height: 420px; }
  body { font-size: 16px; }
  .text p.lead { font-size: 17px; }
  .controls button { padding: 9px 14px; }
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">Ηλεκτρικό πεδίο <span>· πρώτη γνωριμία</span></div>
  <div class="counter" id="counter" aria-live="polite">1 / 14</div>
</div>

<main class="stage" id="stage">
  <section class="text" id="text"></section>
  <div class="bench"><div class="caption" id="caption"></div><div class="cwrap"><canvas id="cv" aria-label="Κινούμενο σχέδιο της διαφάνειας"></canvas></div><div class="mbar" id="mbar"><button type="button" class="pause" id="mpause" aria-pressed="false">❚❚ Παύση</button><span>Ταχύτητα:</span><button type="button" data-sp="1" aria-pressed="true">1×</button><button type="button" data-sp="0.5" aria-pressed="false">½×</button><button type="button" data-sp="0.25" aria-pressed="false">¼×</button></div></div>
</main>

<nav class="controls" aria-label="Πλοήγηση διαφανειών">
  <button id="prev" type="button">← Πίσω</button>
  <div class="dots" id="dots"></div>
  <button id="next" type="button" class="primary">Επόμενο →</button>
</nav>

<script>
const SLIDES = [
  { kicker: "Ξεκινάμε", title: "Ηλεκτρικό πεδίο", h1: true, html: `
      <p class="lead">Ένα ηλεκτρικό φορτίο δεν επηρεάζει μόνο τα σώματα που ακουμπά. Αλλάζει τις ιδιότητες του χώρου γύρω του.</p>
      <p>Σε αυτή την παρουσίαση θα δούμε τι σημαίνει αυτό, πώς το περιγράφουμε με αριθμούς και γιατί πάνω του στηρίζεται όλο το κεφάλαιο: ένταση, δυναμικό, πυκνωτής.</p>
      <p class="note">Για να προχωρήσεις, πάτα «Επόμενο» ή τα βέλη του πληκτρολογίου. Με το «Παύση» σταματάς την κίνηση για να τη μελετήσεις.</p>`, caption: "Ένα φορτίο και ο χώρος γύρω του", scene: "intro" },
  { kicker: "Το παράδοξο", title: "Απωθούνται χωρίς να αγγίζονται", html: `
      <p class="lead">Δύο θετικά φορτία απωθούνται. Το μέτρο της δύναμης το δίνει ο νόμος του Coulomb: F = k·|Q·q|/r².</p>
      <p>Τα φορτία όμως δεν έρχονται ποτέ σε επαφή. Πώς ασκεί το ένα δύναμη στο άλλο από απόσταση;</p>
      <p class="note"><span class="q">Σκέψου:</span> αν απομακρύνουμε το ένα φορτίο, έχει μείνει κάτι στον χώρο γύρω από το άλλο;</p>`, caption: "Δύο ίσα θετικά φορτία απωθούνται από απόσταση", scene: "coulomb" },
  { kicker: "Η ιδέα", title: "Το φορτίο αλλάζει τον χώρο", html: `
      <p class="lead">Η απάντηση της Φυσικής είναι ότι το φορτίο Q δημιουργεί γύρω του <b>ηλεκτρικό πεδίο</b>.</p>
      <p>Ηλεκτρικό πεδίο λέμε τον χώρο μέσα στον οποίο, αν βάλουμε ένα φορτίο, αυτό δέχεται δύναμη. Σε κάθε σημείο του πεδίου μπορούμε να πούμε πόσο μεγάλη δύναμη θα δεχτεί ένα φορτίο εκεί και προς ποια κατεύθυνση.</p>
      <p>Τα βελάκια δείχνουν αυτή την πληροφορία σε κάθε σημείο. Το πεδίο υπάρχει ακόμη κι όταν δεν υπάρχει κανένα άλλο φορτίο για να δεχτεί τη δύναμη.</p>`, caption: "Σε κάθε σημείο: κατεύθυνση και μέγεθος της δύναμης ανά φορτίο", scene: "arrows" },
  { kicker: "Κάτι γνωστό", title: "Κάτι που ήδη ξέρεις: το πεδίο βαρύτητας", html: `
      <p class="lead">Γύρω από τη Γη υπάρχει πεδίο βαρύτητας. Δεν το βλέπουμε, αλλά αν αφήσουμε ένα κλειδί ελεύθερο, πέφτει.</p>
      <p>Το g = 10 N/kg σημαίνει ότι σε αυτό το σημείο κάθε κιλό μάζας δέχεται βάρος 10 N. Είναι ιδιότητα του σημείου, όχι του κλειδιού.</p>
      <p>Με το ηλεκτρικό πεδίο συμβαίνει κάτι ανάλογο· μόνο που στη θέση της μάζας έχουμε το <b>φορτίο</b>.</p>
      <div class="formula">g = F/m  ⟷  E = F/q</div>`, caption: "Αριστερά βαρύτητα, δεξιά ηλεκτρικό πεδίο", scene: "gravity" },
  { kicker: "Πώς το ανιχνεύουμε", title: "Το υπόθεμα (δοκιμαστικό φορτίο)", html: `
      <p class="lead">Για να μελετήσουμε το πεδίο, βάζουμε σε ένα σημείο του ένα μικρό θετικό φορτίο q, το <b>υπόθεμα</b>, και μετράμε τη δύναμη που δέχεται.</p>
      <p>Μετακινούμε το υπόθεμα γύρω από το Q. Κοντά στο Q η δύναμη είναι μεγάλη, μακριά μικρή. Επειδή το Q είναι θετικό, η δύναμη έχει πάντα φορά προς τα έξω, μακριά από το Q.</p>
      <p class="note">Το q πρέπει να είναι πολύ μικρό, ώστε να μην αλλάζει το πεδίο που θέλουμε να μετρήσουμε.</p>`, caption: "Το υπόθεμα +q σε διάφορες θέσεις γύρω από το Q", scene: "probe" },
  { kicker: "Ο ορισμός", title: "Ένταση: δύναμη ανά φορτίο", html: `
      <p class="lead">Στο ίδιο σημείο βάζουμε πρώτα φορτίο q και μετά φορτίο 2q. Η δύναμη διπλασιάζεται, αλλά το πηλίκο F/q μένει ίδιο.</p>
      <p>Αυτό το πηλίκο το ονομάζουμε <b>ένταση</b> του πεδίου στο σημείο. Η ένταση είναι διανυσματικό μέγεθος και μετριέται σε N/C.</p>
      <div class="formula">E = F / q</div>
      <p class="note">Η ένταση χαρακτηρίζει το σημείο του πεδίου και δεν εξαρτάται από το φορτίο που βάλαμε εκεί.</p>`, caption: "Η F διπλασιάζεται, η E μένει ίδια", scene: "ratio" },
  { kicker: "Η φορά", title: "Η φορά της δύναμης σε θετικό και σε αρνητικό φορτίο", html: `
      <p class="lead">Η φορά της έντασης είναι ίδια με τη φορά της δύναμης που δέχεται ένα <b>θετικό</b> φορτίο.</p>
      <p>Ένα αρνητικό φορτίο ίδιου μέτρου, στο ίδιο σημείο, δέχεται δύναμη ίδιου μέτρου αλλά αντίθετης φοράς από την ένταση.</p>
      <div class="formula">F = q·E</div>`, caption: "Πράσινο: ένταση E · Κόκκινο: δύναμη F", scene: "sign" },
  { kicker: "Σημειακό φορτίο", title: "Το πεδίο ενός σημειακού φορτίου", html: `
      <p class="lead">Συνδυάζοντας τον νόμο του Coulomb με τον ορισμό E = F/q, βρίσκουμε την ένταση σε απόσταση r από σημειακό φορτίο Q:</p>
      <div class="formula">E = k·|Q| / r²</div>
      <p>Σε διπλάσια απόσταση η ένταση γίνεται 4 φορές μικρότερη· σε τριπλάσια, 9 φορές μικρότερη. Το πεδίο εξασθενεί γρήγορα καθώς απομακρυνόμαστε.</p>
      <p class="note">k = 9·10⁹ N·m²/C²</p>`, caption: "Η ένταση είναι αντιστρόφως ανάλογη του r²", scene: "coulombE" },
  { kicker: "Ο χάρτης", title: "Δυναμικές γραμμές", html: `
      <p class="lead">Οι δυναμικές γραμμές είναι νοητές γραμμές που μας δείχνουν πώς είναι το πεδίο. Σε κάθε σημείο τους η ένταση είναι εφαπτόμενη στη γραμμή.</p>
      <p>Ξεκινούν από τα θετικά φορτία και καταλήγουν στα αρνητικά. Όπου είναι πυκνότερες, εκεί η ένταση είναι μεγαλύτερη.</p>
      <p class="note">Οι δυναμικές γραμμές δεν τέμνονται ποτέ, γιατί σε κάθε σημείο η ένταση έχει μία μόνο κατεύθυνση.</p>`, caption: "Πρώτα ένα θετικό φορτίο, μετά ένα θετικό και ένα αρνητικό", scene: "lines" },
  { kicker: "Πολλά φορτία", title: "Οι εντάσεις προστίθενται διανυσματικά", html: `
      <p class="lead">Όταν υπάρχουν δύο φορτία, σε κάθε σημείο το καθένα δημιουργεί τη δική του ένταση. Η ολική ένταση είναι το διανυσματικό τους άθροισμα.</p>
      <p>Γι' αυτό σε κάποια σημεία οι δύο εντάσεις αλληλοαναιρούνται και η ολική ένταση γίνεται μηδέν. Πρόσεξε στο σχέδιο: το φορτίο που είναι πιο κοντά δίνει μεγαλύτερη ένταση.</p>
      <div class="formula"><span class='vec'>E</span> = <span class='vec'>E</span>₁ + <span class='vec'>E</span>₂</div>`, caption: "Ο κανόνας του παραλληλογράμμου για δύο ίσα θετικά φορτία", scene: "superpose" },
  { kicker: "Το πιο απλό πεδίο", title: "Ομογενές πεδίο", html: `
      <p class="lead">Ανάμεσα σε δύο παράλληλες μεταλλικές πλάκες με αντίθετα φορτία, η ένταση είναι <b>ίδια σε όλα τα σημεία</b>.</p>
      <p>Οι δυναμικές γραμμές είναι παράλληλες και ισαπέχουν. Ένα φορτίο μέσα στο πεδίο δέχεται σταθερή δύναμη F = q·E, άρα, αν ξεκινήσει από την ηρεμία, κάνει ευθύγραμμη ομαλά επιταχυνόμενη κίνηση, όπως ένα σώμα που πέφτει ελεύθερα.</p>
      <div class="formula">α = q·E / m</div>`, caption: "Ένα θετικό φορτίο αφήνεται ελεύθερο κοντά στη θετική πλάκα", scene: "uniform" },
  { kicker: "Ενέργεια", title: "Το δυναμικό μοιάζει με το ύψος", html: `
      <p class="lead">Μια μπάλα κατεβαίνει από ψηλά προς τα χαμηλά και αποκτά ταχύτητα. Με τον ίδιο τρόπο, ένα θετικό φορτίο που αφήνεται ελεύθερο κινείται από σημεία υψηλού προς σημεία χαμηλού <b>δυναμικού</b>.</p>
      <p>Το δυναμικό V είναι μονόμετρο μέγεθος: σε κάθε σημείο είναι η δυναμική ενέργεια ανά μονάδα φορτίου (V = U/q). Καθώς το φορτίο κινείται, η δυναμική του ενέργεια μετατρέπεται σε κινητική.</p>
      <div class="formula">U = q·V   ·   E = V/ℓ</div>`, caption: "Πορτοκαλί: δυναμική ενέργεια U · Μπλε: κινητική ενέργεια K", scene: "energy" },
  { kicker: "Αποθήκευση", title: "Ο πυκνωτής αποθηκεύει ενέργεια", html: `
      <p class="lead">Συνδέουμε δύο παράλληλες μεταλλικές πλάκες (τους οπλισμούς) με μια μπαταρία και φορτίζονται με αντίθετα φορτία. Ανάμεσά τους δημιουργείται ηλεκτρικό πεδίο, στο οποίο αποθηκεύεται ενέργεια.</p>
      <p>Αν μετά συνδέσουμε τους οπλισμούς με ένα λαμπάκι, ο πυκνωτής εκφορτίζεται: η ενέργεια του πεδίου μετατρέπεται σε φως και θερμότητα, και το λαμπάκι ανάβει για λίγο.</p>
      <div class="formula">C = Q/V   ·   U = ½·C·V²</div>`, caption: "Φόρτιση από μπαταρία και εκφόρτιση μέσα από λαμπάκι", scene: "capacitor" },
  { kicker: "Να θυμάσαι", title: "Πέντε φράσεις για όλο το κεφάλαιο", html: `
      <ul class="recap">
        <li>Κάθε φορτίο δημιουργεί γύρω του <b>ηλεκτρικό πεδίο</b>: όποιο φορτίο βρεθεί εκεί, δέχεται δύναμη.</li>
        <li>Η <b>ένταση</b> E = F/q χαρακτηρίζει κάθε σημείο του πεδίου: είναι διάνυσμα και μετριέται σε N/C.</li>
        <li>Ένα θετικό φορτίο δέχεται δύναμη με τη φορά της E, ένα αρνητικό με αντίθετη φορά.</li>
        <li>Οι <b>δυναμικές γραμμές</b> ξεκινούν από τα θετικά και καταλήγουν στα αρνητικά φορτία· είναι πυκνότερες εκεί όπου η ένταση είναι μεγαλύτερη.</li>
        <li>Το <b>δυναμικό</b> μοιάζει με το ύψος στη βαρύτητα, και στο πεδίο μπορεί να αποθηκευτεί <b>ενέργεια</b> (πυκνωτής).</li>
      </ul>
      <p class="note">Επόμενο βήμα: το τυπολόγιο με τις 30 περιπτώσεις και τις ασκήσεις, ακριβώς από κάτω σε αυτή τη σελίδα.</p>`, caption: "Ένα θετικό και ένα αρνητικό φορτίο: γραμμές, ένταση, δύναμη", scene: "recap" },
];

/* ---------- theme colours from CSS tokens ---------- */
let COL = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["ink", "muted", "line", "accent", "pos", "neg", "field", "energy", "bench", "grid", "paper"]) COL[k] = cs.getPropertyValue("--" + k).trim();
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- canvas ---------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(cv);

const FONT = (s, w = 700) => `${w} ${s}px Commissioner, "Segoe UI", system-ui, sans-serif`;
function arrow(x1, y1, x2, y2, color, width = 3, label, head = 10) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  if (L < 2) return;

prev.addEventListener("click", () => go(idx - 1));
next.addEventListener("click", () => go(idx + 1));
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(idx + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(idx - 1);
  if (e.key === " " && !(e.target && e.target.tagName === "BUTTON")) { e.preventDefault(); MOTION.paused = !MOTION.paused; syncMotion(); }
});
const mbar = document.getElementById("mbar"), mpause = document.getElementById("mpause");
function syncMotion() {
  mpause.textContent = MOTION.paused ? "▶ Συνέχεια" : "❚❚ Παύση";
  mpause.setAttribute("aria-pressed", MOTION.paused ? "true" : "false");
  mbar.querySelectorAll("[data-sp]").forEach((b) => b.setAttribute("aria-pressed", Number(b.dataset.sp) === MOTION.speed ? "true" : "false"));
}
mpause.addEventListener("click", () => { MOTION.paused = !MOTION.paused; syncMotion(); });
mbar.querySelectorAll("[data-sp]").forEach((b) => b.addEventListener("click", () => { MOTION.speed = Number(b.dataset.sp); syncMotion(); }));
let sx = null;
document.getElementById("stage").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
document.getElementById("stage").addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(idx + (dx < 0 ? 1 : -1)); sx = null; });
try { const saved = Number(localStorage.getItem("pedio-intro-slide")); if (saved > 0 && saved < SLIDES.length) idx = saved; } catch (e) {}
render(); resize();
function frame(now) {
  const dtReal = Math.max(0, Math.min(100, now - lastReal)); lastReal = Math.max(lastReal, now);
  if (!MOTION.paused) vnow += dtReal * MOTION.speed;
  const t = reduce ? 3.2 : (vnow - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  if (W > 0 && H > 0) SCENES[SLIDES[idx].scene](t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* Report height to the embedding page so the iframe never scrolls internally. */
let lastH = 0;
function reportHeight() {
  const h = Math.ceil(document.querySelector(".controls").getBoundingClientRect().bottom + window.scrollY + 18);
  if (h !== lastH && window.parent !== window) { lastH = h; window.parent.postMessage({ type: "pedio-intro-height", height: h }, "*"); }
}
new ResizeObserver(reportHeight).observe(document.body);
addEventListener("load", reportHeight);
document.fonts && document.fonts.ready.then(reportHeight);
addEventListener("message", (e) => { if (e.data === "pedio-intro-ping") { lastH = 0; reportHeight(); } });
</script>

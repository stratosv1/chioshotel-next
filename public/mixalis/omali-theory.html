<title>Ομαλή κυκλική κίνηση · Διαδραστική θεωρία</title>
<style>
:root{--bg:#f3efe8;--paper:#fffdf9;--ink:#222936;--muted:#616b7c;--line:#dcd6c9;--accent:#196f5c;--blue:#1767c5;--red:#c63d32;--green:#198452;--gold:#ad7120;--bench:#f7f5f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:15px;line-height:1.55;font-size:16px}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #d18f3a;outline-offset:3px}
.wrap{max-width:1120px;margin:auto}.head{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-weight:800;color:var(--accent)}.count{font-size:13px;font-weight:700;color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:13px}.groups button{border:0;background:transparent;text-align:left;padding:5px 3px;color:var(--muted);font-size:12px;font-weight:700;border-radius:6px}.groups button i{display:block;background:var(--line);height:5px;border-radius:5px;margin-bottom:5px}.groups button.active{color:var(--accent)}.groups button.active i{background:var(--accent)}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);min-height:555px}
.lesson{padding:28px 28px 24px;display:flex;flex-direction:column;gap:13px;min-width:0}.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}h1,h2{margin:0;line-height:1.15;letter-spacing:-.025em;font-size:clamp(26px,3vw,37px)}p{margin:0}.lead{font-size:18px}.formula{display:inline-block;align-self:flex-start;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);font-weight:800;font-size:clamp(17px,2.2vw,23px);padding:8px 14px;background:#f3faf5}.note,.trap{font-size:14px;color:var(--muted);border-left:3px solid var(--gold);padding:2px 0 2px 12px}.trap{border-color:var(--red);color:#933529}.bench{min-width:0;display:flex;flex-direction:column;background:var(--bench);border-left:1px solid var(--line)}.caption{font-size:13px;color:var(--muted);font-weight:700;padding:11px 15px;min-height:43px}.canvasbox{height:330px;position:relative;min-width:0}.canvasbox canvas{width:100%;height:100%;display:block}.readout{font-variant-numeric:tabular-nums;padding:9px 15px;font-size:14px;background:#edf5f1;border-block:1px solid var(--line);line-height:1.7}.readout b{color:var(--accent)}.knobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:12px 15px}.knob{display:grid;gap:3px;min-width:0}.knob label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:4px}.knob output{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}.knob input{width:100%;accent-color:var(--accent)}.playbar{padding:10px 15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}.playbar button,.controls button,.quiz button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);font-weight:750;font-size:14px}.playbar button.selected,.controls button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px}.dots{display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap;flex:1}.dots button{width:9px;height:9px;border:0;background:#c8c7be;border-radius:50%;padding:0}.dots button.active{background:var(--accent);width:20px;border-radius:8px}.quiz{display:grid;gap:9px}.quiz button{text-align:left;border-radius:10px;padding:11px}.quiz button.correct{border-color:var(--green);background:#e3f6e8}.quiz button.wrong{border-color:var(--red);background:#f9e9e7}.feedback{font-size:14px;padding:10px 12px;background:#edf5f1;border-radius:10px}.linkline{font-size:13px;color:var(--muted);padding-top:10px}.linkline a{color:var(--accent);font-weight:700}#details{font-size:13px;color:var(--muted)}
@media(max-width:800px){.stage{grid-template-columns:1fr}.lesson{padding:22px 19px}.bench{border-left:0;border-top:1px solid var(--line)}.canvasbox{height:290px}.groups button{font-size:11px}.controls button{padding:9px 12px}h1,h2{font-size:28px}.lead{font-size:17px}}
@media(max-width:390px){body{padding:10px}.knobs{grid-template-columns:1fr}.canvasbox{height:270px}.controls .dots{max-width:130px}.groups button{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<div class="wrap">
<header class="head"><div class="brand">Ομαλή κυκλική κίνηση <span style="font-weight:500;color:var(--muted)">· η θεωρία με κίνηση</span></div><div id="count" class="count" aria-live="polite"></div></header>
<nav class="groups" id="groups" aria-label="Ενότητες"></nav>
<main class="stage">
<section class="lesson" id="lesson" aria-live="polite"></section>
<section class="bench" aria-label="Διαδραστικό εργαστήριο">
<div class="caption" id="caption">Κίνηση και διανύσματα</div>
<div class="canvasbox"><canvas id="canvas" role="img" aria-label="Διαδραστική απεικόνιση περιστρεφόμενου σημείου, ακτίνας και διανυσμάτων"></canvas></div>
<div id="readout" class="readout" aria-live="off"></div>
<div class="knobs" id="knobs"></div>
<div class="playbar"><button type="button" id="play">Παύση</button><button type="button" id="restart">Από την αρχή</button><button type="button" id="slow">¼×</button><span id="details">Άλλαξε τις τιμές και δες τη μεταβολή</span></div>
</section>
</main>
<nav class="controls" aria-label="Πλοήγηση διαφανειών"><button id="prev">← Πίσω</button><div class="dots" id="dots"></div><button class="primary" id="next">Επόμενο →</button></nav>
<p class="linkline">Βάση θεωρίας: μάθημα 1.2 στη Neon (τρέχουσα αναθεώρηση 5). <a href="/mixalis/omali#askiseis" target="_parent">Ασκήσεις</a> · <a href="/mixalis/omali2" target="_parent">34 περιπτώσεις τυπολογίου</a>. Οι προχωρημένες εφαρμογές επισημαίνονται χωριστά.</p>
</div>
<script>
"use strict";
const PI=Math.PI;
const slides=[
{g:0,k:"Εικόνα πριν από τύπους",t:"Γιατί το καρουζέλ επιταχύνεται;",s:"circle",lead:"Στην ομαλή κυκλική κίνηση το σώμα διαγράφει κύκλο με σταθερό μέτρο ταχύτητας. Το βέλος της ταχύτητας όμως στρέφεται αδιάκοπα.",p:"Ακολούθησε το μπλε βέλος: σε κάθε σημείο είναι εφαπτόμενο στον κύκλο. Το πράσινο βέλος δείχνει προς το κέντρο και εξηγεί την αλλαγή κατεύθυνσης.",note:"Μετακίνησε τις μπάρες R και ω. Πάτησε Παύση για να συγκρίνεις τα διανύσματα."},
{g:0,k:"Ορισμός",t:"«Ομαλή» δεν σημαίνει σταθερό διάνυσμα",s:"circle",lead:"Σταθερό είναι μόνο το μέτρο |υ|. Η διεύθυνση και η φορά της στιγμιαίας ταχύτητας μεταβάλλονται διαρκώς.",f:"|υ| = σταθερό,   υ⃗ = μεταβαλλόμενο",p:"Αν το σώμα περνούσε ευθύγραμμα, το βέλος θα κρατούσε την κατεύθυνσή του. Στον κύκλο ο προσανατολισμός αλλάζει, άρα υπάρχει επιτάχυνση.",trap:"Μην γράφεις «η ταχύτητα είναι σταθερή» χωρίς να προσδιορίζεις ότι εννοείς το μέτρο της."},
{g:0,k:"Τροχιά",t:"Γωνία, τόξο και ακτίνιο",s:"arc",lead:"Η γωνία φ μετριέται σε ακτίνια (rad). Η γωνία και το τόξο περιγράφουν την ίδια περιστροφή.",f:"s = R · φ   (φ σε rad)",p:"Για 90° έχουμε φ=π/2 rad. Σε κύκλο μεγαλύτερης ακτίνας η ίδια γωνία αντιστοιχεί σε μεγαλύτερο τόξο. Δοκίμασε τη γωνία και την ακτίνα.",note:"Μία πλήρης περιφορά είναι 360° = 2π rad. Το s είναι μήκος διαδρομής, όχι χορδή."},
{g:0,k:"Γωνιακή θέση",t:"Η γωνία μπορεί να ξεπερνά τις 360°",s:"arc",lead:"Η συνολική γωνιακή μετατόπιση καταγράφει πόσο στράφηκε το σώμα, όχι μόνο πού σταμάτησε.",f:"Δφ = φτελ − φαρχ",p:"Δύο πλήρεις περιφορές είναι 4π rad, παρότι το σώμα επιστρέφει στο αρχικό σημείο. Για τη φορά ορίζουμε θετική την αριστερόστροφη κίνηση.",note:"Η αρχική γωνία έχει σημασία όταν συγκρίνουμε δύο κινητά που ξεκινούν από διαφορετικές θέσεις."},
{g:0,k:"Περιοδικότητα",t:"Περίοδος και συχνότητα",s:"circle",lead:"Περίοδος T είναι ο χρόνος για έναν γύρο. Συχνότητα f είναι πόσοι γύροι γίνονται κάθε δευτερόλεπτο.",f:"T = t/N,   f = N/t = 1/T",p:"Αν γίνονται 5 γύροι σε 10 s, τότε T=2 s και f=0,5 Hz. Μεγαλύτερη συχνότητα σημαίνει μικρότερη περίοδο.",note:"Μονάδες: T σε s, f σε Hz (s⁻¹). Το N εδώ δηλώνει αριθμό γύρων."},
{g:0,k:"Ρυθμός περιστροφής",t:"Γωνιακή ταχύτητα ω",s:"circle",lead:"Η ω δείχνει πόσο γρήγορα περιστρέφεται η επιβατική ακτίνα. Στην ομαλή κυκλική κίνηση παραμένει σταθερή.",f:"ω = Δφ/Δt = 2π/T = 2πf",p:"Δύο περιστροφές το δευτερόλεπτο σημαίνουν ω=4π rad/s. Η ω μετριέται σε rad/s, όχι σε m/s.",note:"Η επιλογή θετικής φοράς επιτρέπει και αλγεβρική ω: αριστερόστροφα θετική, δεξιόστροφα αρνητική."},
{g:1,k:"Γραμμική κίνηση",t:"Γιατί η ταχύτητα εξαρτάται από την ακτίνα;",s:"circle",lead:"Σε έναν γύρο το σώμα διανύει 2πR. Η γραμμική ταχύτητα είναι το διανυθέν τόξο ανά χρόνο.",f:"υ = 2πR/T = ωR",p:"Αν διπλασιάσεις την ακτίνα κρατώντας σταθερή την ω, το σώμα διανύει διπλάσια απόσταση στον ίδιο χρόνο και έχει διπλάσιο μέτρο υ.",note:"Η γραμμική ταχύτητα υ είναι εφαπτόμενη στην τροχιά, ενώ η ω περιγράφει τον ρυθμό στροφής."},
{g:1,k:"Στερεός δίσκος",t:"Δύο σημεία, ίδια ω αλλά διαφορετική υ",s:"disk",lead:"Τα σημεία Α και Β του ίδιου άκαμπτου δίσκου στρέφονται κατά την ίδια γωνία στον ίδιο χρόνο.",f:"ωΑ = ωΒ,   υ = ωr",p:"Το εξωτερικό σημείο Β βρίσκεται σε διπλάσια ακτίνα από το Α: έχει διπλάσια γραμμική ταχύτητα και διπλάσια κεντρομόλο επιτάχυνση.",trap:"Μη συμπεραίνεις «ίδια υ» επειδή ολοκληρώνουν τον γύρο μαζί."},
{g:1,k:"Συγκρίσεις",t:"Τι μένει σταθερό; Αυτό καθορίζει τον τύπο.",s:"compare",lead:"Αν αλλάξει η ακτίνα, η κεντρομόλος μπορεί να αυξηθεί ή να μειωθεί. Εξαρτάται από το τι διατηρείται σταθερό.",f:"σταθερή ω: ακ = ω²R   |   σταθερή υ: ακ = υ²/R",p:"Για ίδια ω, μεγαλύτερη R σημαίνει μεγαλύτερη ακ. Για ίδια υ, μεγαλύτερη R σημαίνει μικρότερη ακ. Πριν επιλέξεις τύπο, διάβασε ποιο μέγεθος είναι κοινό.",note:"Αυτό εξηγεί πολλές παγίδες των θεμάτων σύγκρισης."},
{g:1,k:"Διανύσματα",t:"Μεταβολή ταχύτητας σε μισό κύκλο",s:"delta",lead:"Μετά από μισή περιφορά, το τελικό βέλος ταχύτητας έχει ίδιο μήκος αλλά αντίθετη φορά από το αρχικό.",f:"|Δυ⃗| = |υ⃗τελ − υ⃗αρχ| = 2υ",p:"Δεν έχει διπλασιαστεί το μέτρο της ταχύτητας. Η διαφορά είναι διανυσματική. Το μήκος της διαδρομής είναι πR, όχι 2υ.",note:"Αυτή είναι η γέφυρα από την αλλαγή κατεύθυνσης στην επιτάχυνση."},
{g:1,k:"Κεντρομόλος",t:"Επιτάχυνση προς το κέντρο",s:"circle",lead:"Για να στρέφεται το διάνυσμα της ταχύτητας, απαιτείται επιτάχυνση κάθετη στην υ, με φορά προς το κέντρο.",f:"ακ = υ²/R = ω²R",p:"Αν διπλασιαστεί η υ με σταθερή R, η ακ τετραπλασιάζεται. Αν διπλασιαστεί η R με σταθερή υ, η ακ υποδιπλασιάζεται.",trap:"Η κεντρομόλος δεν δείχνει προς τη φορά της κίνησης. Είναι πάντα ακτινική."},
{g:1,k:"Δυνάμεις · 1.3",t:"Ποια δύναμη στρέφει πραγματικά το σώμα;",s:"force",lead:"Η κεντρομόλος δύναμη δεν είναι πρόσθετη δύναμη. Είναι η συνισταμένη των πραγματικών δυνάμεων κατά την ακτινική διεύθυνση.",f:"ΣFκ = mακ = mυ²/R",p:"Σε λείο οριζόντιο τραπέζι τη δίνει η τάση του νήματος. Σε επίπεδη στροφή μπορεί να τη δίνει η στατική τριβή. Διαλέγουμε θετική φορά προς το κέντρο.",note:"Σύνδεση με το ξεχωριστό μάθημα Neon 1.3 «Κεντρομόλος δύναμη»."},
{g:2,k:"Πείραμα",t:"Τι συμβαίνει όταν κοπεί το νήμα;",s:"cut",lead:"Μόλις παύσει η ακτινική δύναμη που συγκρατούσε το σώμα, δεν υπάρχει πια κυκλική τροχιά.",p:"Το σώμα συνεχίζει αρχικά κατά την εφαπτομένη με τη στιγμιαία ταχύτητα που είχε τη στιγμή της αποδέσμευσης. Το σχήμα δείχνει το ιδανικό οριζόντιο επίπεδο χωρίς άλλες οριζόντιες δυνάμεις.",trap:"Δεν εκτοξεύεται «ακτινικά προς τα έξω»."},
{g:2,k:"Γραφήματα",t:"Γωνιακή θέση θ ως προς χρόνο t",s:"graphs",lead:"Στην ομαλή κυκλική κίνηση η ω είναι σταθερή, άρα η συνολική γωνιακή θέση θ αυξάνεται γραμμικά.",f:"θ(t) = θ₀ + ωt",p:"Στο διάγραμμα θ–t η κλίση ισούται με ω. Αν αυξήσεις την ω, η ευθεία γίνεται πιο απότομη. Στο διάγραμμα ω–t θα δεις οριζόντια γραμμή.",note:"Η θ εδώ είναι η συνολική γωνιακή θέση και δεν μηδενίζεται μετά από έναν γύρο."},
{g:2,k:"Εμβαδόν γραφήματος",t:"Το εμβαδόν κάτω από την ω–t",s:"graphs",lead:"Σε σταθερή ω η γωνιακή μετατόπιση στο χρονικό διάστημα Δt είναι το εμβαδόν του ορθογωνίου κάτω από την ω–t.",f:"Δθ = ω·Δt",p:"Μην μπερδεύεις τις έννοιες: στην θ–t υπολογίζεις κλίση για να βρεις ω. Στην ω–t υπολογίζεις αλγεβρικό εμβαδόν για να βρεις Δθ.",note:"Για μεταβαλλόμενη ω το εμβαδόν είναι η ολοκλήρωση, που ανήκει στην προχωρημένη επέκταση."},
{g:2,k:"Φάση και συνάντηση",t:"Δύο σώματα στον ίδιο κυκλικό στίβο",s:"runners",lead:"Ο γρήγορος δρομέας «κερδίζει» γωνία από τον αργό. Η πρώτη επόμενη συνάντηση από κοινή αφετηρία απαιτεί διαφορά ενός γύρου.",f:"(ωΑ − ωΒ)t = 2π   (ομόρροπα)",p:"Για αντίρροπα κινούμενα σώματα από κοινή αφετηρία προσθέτουμε τα μέτρα των ω. Αν ξεκινούν από διαφορετικές θέσεις, χρησιμοποιούμε την πραγματική αρχική διαφορά φάσης.",note:"Η σκηνή δείχνει τους δύο δρομείς και πού έχουν φτάσει."},
{g:2,k:"Μεταδόσεις κίνησης",t:"Δύο τροχοί με ιμάντα χωρίς ολίσθηση",s:"belt",lead:"Ο ιμάντας επιβάλλει την ίδια εφαπτομενική ταχύτητα στην περιφέρεια των δύο τροχών.",f:"υ₁ = υ₂  ⟹  ω₁R₁ = ω₂R₂",p:"Ο μικρότερος τροχός πρέπει να περιστρέφεται γρηγορότερα. Αυτό ΔΕΝ είναι ίδιο με δύο σημεία στον ίδιο στερεό δίσκο, όπου η κοινή ποσότητα είναι η ω.",note:"Εφαρμογή επέκτασης από το τρέχον μάθημα Neon 1.2."},
{g:2,k:"Προαιρετική επέκταση",t:"Αν το μέτρο της υ αλλάζει;",s:"nonuniform",lead:"Τότε η κίνηση δεν είναι πλέον ομαλή κυκλική. Εκτός από την κεντρομόλο εμφανίζεται και επιτρόχια επιτάχυνση.",f:"αε = Rα,   αολ = √(ακ² + αε²)",p:"Η αε είναι εφαπτομενική και αλλάζει το μέτρο της ταχύτητας. Η ακ είναι προς το κέντρο και αλλάζει την κατεύθυνσή της. Η γωνιακή επιτάχυνση α μετριέται σε rad/s².",trap:"Το πρόσημο της α ΔΕΝ καθορίζει μόνο του τη φορά περιστροφής. Αυτό το καθορίζει το πρόσημο της ω."},
{g:2,k:"Λυμένο παράδειγμα",t:"30 περιφορές σε 12 δευτερόλεπτα",s:"circle",lead:"Τροχός ακτίνας 0,40 m κάνει 30 πλήρεις περιφορές σε 12 s. Πρώτα βρίσκουμε f, έπειτα T και ω, τέλος υ και ακ.",f:"f=2,5 Hz → T=0,40 s → ω=5π rad/s",p:"υ=ωR=2π≈6,28 m/s. αₖ=ω²R=10π²≈98,7 m/s². Οι αριθμοί είναι από τη λυμένη εφαρμογή του υπάρχοντος μαθήματος Neon.",note:"Πρώτα γράψε τα δεδομένα και τις μονάδες. Μετά ακολούθησε την αλυσίδα τύπων."},
{g:3,k:"Έλεγχος κατανόησης",t:"Ποιο μέγεθος παραμένει σταθερό;",s:"circle",quiz:["Το διάνυσμα της ταχύτητας","Το μέτρο της ταχύτητας","Το διάνυσμα της επιτάχυνσης"],answer:1,why:"Η διεύθυνση της υ και της ακ αλλάζει συνεχώς. Μόνο τα μέτρα είναι σταθερά για δεδομένα R και ω."},
{g:3,k:"Έλεγχος κατανόησης",t:"Διπλασιάζουμε την ω με σταθερή R",s:"disk",quiz:["Η ακ διπλασιάζεται","Η ακ τετραπλασιάζεται","Η ακ μένει ίδια"],answer:1,why:"ακ=ω²R. Αν ω→2ω τότε ακ→4ακ. Η γραμμική υ διπλασιάζεται."},
{g:3,k:"Έλεγχος κατανόησης",t:"Κόβεται το νήμα στη δεξιά πλευρά",s:"cut",quiz:["Το σώμα φεύγει ακτινικά προς τα έξω","Το σώμα συνεχίζει εφαπτομενικά","Το σώμα σταματά ακαριαία"],answer:1,why:"Ακριβώς μετά την κοπή διατηρεί τη στιγμιαία εφαπτομενική ταχύτητα. Δεν υπάρχει δύναμη που να το σπρώχνει ακτινικά προς τα έξω."},
{g:3,k:"Έλεγχος κατανόησης",t:"Δύο σημεία του ίδιου δίσκου",s:"disk",quiz:["Έχουν κοινή ω και διαφορετική υ","Έχουν κοινή υ και διαφορετική ω","Έχουν και τα δύο ίσες υ ανεξαρτήτως ακτίνας"],answer:0,why:"Σε άκαμπτο δίσκο κοινά είναι ω, T και f. Η υ=ωr μεγαλώνει με την απόσταση από τον άξονα."},
{g:3,k:"Η κεντρική εικόνα",t:"Αναγνώρισε τη φυσική πριν από τον τύπο",s:"circle",lead:"1. Βρες το κέντρο και την πραγματική ακτίνα. 2. Σχεδίασε την εφαπτομένη υ. 3. Σχεδίασε την ακ προς το κέντρο. 4. Έλεγξε τι μένει σταθερό. 5. Χρησιμοποίησε τον κατάλληλο τύπο.",f:"s=Rφ · ω=2π/T · υ=ωR · ακ=υ²/R",p:"Η ομαλή κυκλική κίνηση σημαίνει σταθερό μέτρο υ και διαρκώς μεταβαλλόμενη κατεύθυνση. Από αυτό προκύπτει όλη η θεωρία.",note:"Συνέχισε στις 34 περιπτώσεις του τυπολογίου, όπου η ίδια λογική εφαρμόζεται σε πραγματικά προβλήματα."}
];
const groups=[{name:"Α. Έννοιες",start:0},{name:"Β. Ταχύτητα και δύναμη",start:6},{name:"Γ. Εφαρμογές",start:12},{name:"Δ. Τεστ",start:19}];
let idx=0,paused=window.matchMedia("(prefers-reduced-motion: reduce)").matches,slow=false,t=0,last=0,sel={R:2,w:2,m:1,phi:90,alpha:0},answered={};
const cv=document.getElementById("canvas"),cx=cv.getContext("2d"),$=id=>document.getElementById(id);
function fmt(x,n=2){return Number(x).toLocaleString("el-GR",{maximumFractionDigits:n})}
const spec={R:{label:"Ακτίνα R",min:.5,max:5,step:.1,unit:"m"},w:{label:"Γωνιακή ταχύτητα ω",min:.5,max:6,step:.1,unit:"rad/s"},m:{label:"Μάζα m",min:.2,max:3,step:.2,unit:"kg"},phi:{label:"Γωνία φ",min:15,max:330,step:15,unit:"°"},alpha:{label:"Γωνιακή επιτάχυνση α",min:-2,max:2,step:.2,unit:"rad/s²"}};
function knobsFor(s){if(s==="arc")return["R","phi"];if(s==="force")return["R","w","m"];if(s==="nonuniform")return["R","w","alpha"];if(s==="graphs")return["w"];if(s==="runners")return["w"];if(s==="cut")return["R","w"];return["R","w"]}
function renderUI(){
 const d=slides[idx];$("count").textContent=(idx+1)+" / "+slides.length;
 $("groups").innerHTML=groups.map((g,i)=>'<button type="button" data-group="'+i+'" class="'+(d.g===i?'active':'')+'" aria-current="'+(d.g===i?'true':'false')+'"><i></i>'+g.name+'</button>').join("");
 $("groups").querySelectorAll("button").forEach(b=>b.onclick=()=>go(groups[+b.dataset.group].start));
 const quiz=d.quiz?'<div class="quiz" aria-label="Ερώτηση πολλαπλής επιλογής">'+d.quiz.map((q,j)=>'<button type="button" data-answer="'+j+'" '+(answered[idx]!==undefined?'disabled':'')+' class="'+(answered[idx]===j?(j===d.answer?'correct':'wrong'):'')+'">'+String.fromCharCode(913+j)+'. '+q+'</button>').join("")+'</div>'+(answered[idx]!==undefined?'<p class="feedback">'+(answered[idx]===d.answer?'Σωστά. ':'Ξανασκέψου: ')+d.why+'</p>':''):'' ;
 $("lesson").innerHTML='<div class="kicker">'+d.k+'</div><h2>'+d.t+'</h2>'+(d.lead?'<p class="lead">'+d.lead+'</p>':'')+(d.f?'<div class="formula">'+d.f+'</div>':'')+(d.p?'<p>'+d.p+'</p>':'')+(d.note?'<p class="note">'+d.note+'</p>':'')+(d.trap?'<p class="trap"><strong>Προσοχή:</strong> '+d.trap+'</p>':'')+quiz;
 $("lesson").querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{answered[idx]=+b.dataset.answer;renderUI()});
 $("caption").textContent=({arc:"Πείραξε γωνία και ακτίνα",disk:"Ίδια ω σε δύο διαφορετικές ακτίνες",graphs:"Ζωντανά γραφήματα θ–t και ω–t",cut:"Εφαπτομενική πορεία μετά την αποδέσμευση",nonuniform:"Σύγκριση ακτινικής και επιτρόχιας επιτάχυνσης",runners:"Δύο δρομείς με διαφορετικές ω",belt:"Ίδια εφαπτομενική ταχύτητα στον ιμάντα",delta:"Αρχική και τελική ταχύτητα αντίθετες",compare:"Τι μένει σταθερό;",force:"Ακτινική συνισταμένη πραγματικών δυνάμεων"})[d.s]||"Παρατήρησε τα περιστρεφόμενα διανύσματα";
 $("knobs").innerHTML=knobsFor(d.s).map(k=>'<div class="knob"><label for="kn_'+k+'">'+spec[k].label+' <output id="out_'+k+'">'+fmt(sel[k],1)+' '+spec[k].unit+'</output></label><input id="kn_'+k+'" type="range" min="'+spec[k].min+'" max="'+spec[k].max+'" step="'+spec[k].step+'" value="'+sel[k]+'" aria-label="'+spec[k].label+'"></div>').join("");
 knobsFor(d.s).forEach(k=>$("kn_"+k).oninput=e=>{sel[k]=Number(e.target.value);$("out_"+k).textContent=fmt(sel[k],1)+" "+spec[k].unit;draw()});
 $("prev").disabled=idx===0;$("next").disabled=idx===slides.length-1;
 $("dots").innerHTML=slides.map((v,i)=>'<button data-i="'+i+'" class="'+(i===idx?'active':'')+'" aria-label="Διαφάνεια '+(i+1)+'" aria-current="'+(i===idx?'true':'false')+'"></button>').join("");
 $("dots").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $("play").textContent=paused?"Συνέχεια":"Παύση";$("play").classList.toggle("selected",paused);$("slow").classList.toggle("selected",slow);
 draw();sizePing();
}
function go(n){idx=Math.min(slides.length-1,Math.max(0,n));t=0;renderUI();if(window.self!==window.top)window.scrollTo({top:0,behavior:"instant"})}
$("prev").onclick=()=>go(idx-1);$("next").onclick=()=>go(idx+1);
$("play").onclick=()=>{paused=!paused;renderUI()};$("restart").onclick=()=>{t=0;draw()};$("slow").onclick=()=>{slow=!slow;renderUI()};
document.addEventListener("keydown",e=>{if(["INPUT","BUTTON"].includes(document.activeElement.tagName))return;if(e.key==="ArrowRight")go(idx+1);if(e.key==="ArrowLeft")go(idx-1)});
const c={blue:"#1767c5",red:"#c63d32",green:"#198452",ink:"#263448",muted:"#66778c",grid:"#deded6",gold:"#ad7120"};
function line(x1,y1,x2,y2,col=c.ink,w=2,dash=[]){cx.beginPath();cx.setLineDash(dash);cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.strokeStyle=col;cx.lineWidth=w;cx.stroke();cx.setLineDash([])}
function text(str,x,y,col=c.ink,size=13,align="center"){cx.fillStyle=col;cx.font="600 "+size+"px system-ui";cx.textAlign=align;cx.fillText(str,x,y)}
function circ(x,y,r,col=c.ink,w=2,dash=[]){cx.beginPath();cx.setLineDash(dash);cx.arc(x,y,Math.abs(r),0,2*PI);cx.strokeStyle=col;cx.lineWidth=w;cx.stroke();cx.setLineDash([])}
function dot(x,y,r,col){cx.beginPath();cx.arc(x,y,r,0,2*PI);cx.fillStyle=col;cx.fill()}
function arrow(x,y,dx,dy,col,label){const ex=x+dx,ey=y+dy;line(x,y,ex,ey,col,3);const a=Math.atan2(dy,dx);line(ex,ey,ex-10*Math.cos(a-.5),ey-10*Math.sin(a-.5),col,3);line(ex,ey,ex-10*Math.cos(a+.5),ey-10*Math.sin(a+.5),col,3);if(label)text(label,ex+12,ey-9,col,13,"left")}
function circlePoint(x,y,r,th){return[x+r*Math.cos(th),y-r*Math.sin(th)]}
function setup(){const b=cv.getBoundingClientRect();const w=Math.max(260,b.width),h=Math.max(240,b.height),dpi=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpi)||cv.height!==Math.round(h*dpi)){cv.width=Math.round(w*dpi);cv.height=Math.round(h*dpi)}cx.setTransform(dpi,0,0,dpi,0,0);cx.clearRect(0,0,w,h);return[w,h]}
function draw(){
 const d=slides[idx],[W,H]=setup(),X=W/2,Y=H*.52,r=Math.min(W*.28,H*.32),th=t*sel.w,sc=d.s;
 const vel=sel.R*sel.w,acc=sel.R*sel.w*sel.w,theta=th,ang=sel.phi*PI/180;
 $("readout").innerHTML='<b>R = '+fmt(sel.R,1)+' m</b> · ω = '+fmt(sel.w,1)+' rad/s · <b>υ = '+fmt(vel)+' m/s</b> · ακ = '+fmt(acc)+' m/s² · T = '+fmt(2*PI/sel.w)+' s';
 // Coordinate grid
 for(let q=22;q<W;q+=34)line(q,0,q,H,c.grid,.6);for(let q=20;q<H;q+=34)line(0,q,W,q,c.grid,.6);
 if(sc==="graphs"){const x0=54,x1=W-24,yt=34,ym=H*.48,yb=H-31,span=x1-x0;line(x0,ym,x1,ym,c.ink);line(x0,ym,x0,yt,c.ink);line(x0,yb,x1,yb,c.ink);line(x0,yb,x0,ym+25,c.ink);text("θ (rad)",x0+6,25,c.blue,12,"left");text("ω (rad/s)",x0+6,ym+18,c.green,12,"left");text("t (s)",x1-7,ym-8,c.muted,11);const duration=4;const maxTheta=sel.w*duration*1.15;line(x0,ym,x1,ym-(sel.w*duration/maxTheta)*(ym-yt-10),c.blue,3);line(x0,ym+0.37*(yb-ym),x1,ym+0.37*(yb-ym),c.green,3);const u=((t%duration)/duration);line(x0+u*span,yt,x0+u*span,yb,c.gold,1.5,[4,4]);text("κλίση = ω",x0+span*.50,ym-(ym-yt)*.52,c.blue,12);text("σταθερή ω",x0+span*.65,ym+(yb-ym)*.26,c.green,12);$("readout").innerHTML='<b>θ(t) = ωt</b> · t = '+fmt(t%duration,1)+' s · Δθ = '+fmt(sel.w*(t%duration))+' rad · κλίση θ–t = '+fmt(sel.w)+' rad/s';return}
 if(sc==="belt"){const a=W*.32,b=W*.7,rr=Math.min(r*.65,56);circ(a,Y,rr,c.ink,3);circ(b,Y,rr*.52,c.ink,3);line(a,Y-rr,b,Y-rr*.52,c.ink,3);line(a,Y+rr,b,Y+rr*.52,c.ink,3);let p1=circlePoint(a,Y,rr,th),p2=circlePoint(b,Y,rr*.52,-2*th);dot(p1[0],p1[1],8,c.blue);dot(p2[0],p2[1],7,c.red);text("R₁ = 2R₂",W/2,38,c.ink);text("ω₂ = 2ω₁",W/2,H-18,c.green);return}
 if(sc==="runners"){circ(X,Y,r,c.ink,3);let p=circlePoint(X,Y,r,th),p2=circlePoint(X,Y,r,th*.63);dot(p[0],p[1],8,c.blue);dot(p2[0],p2[1],8,c.red);text("A",p[0]+12,p[1]-12,c.blue);text("B",p2[0]+12,p2[1]-12,c.red);text("ωΑ > ωΒ",X,34,c.ink);$("readout").innerHTML="ωΑ = "+fmt(sel.w)+" rad/s · ωΒ = "+fmt(sel.w*.63)+" rad/s · <b>Δω = "+fmt(sel.w*.37)+" rad/s</b> · πρώτη επόμενη συνάντηση: "+fmt(2*PI/(sel.w*.37))+" s";return}
 if(sc==="compare"){const rr=Math.min(r*.60,69),xl=W*.28,xr=W*.74;circ(xl,Y,rr,c.ink,2);circ(xr,Y,rr*1.5,c.ink,2);const p1=circlePoint(xl,Y,rr,th),p2=circlePoint(xr,Y,rr*1.5,th);dot(p1[0],p1[1],7,c.blue);dot(p2[0],p2[1],7,c.red);text("R",xl,Y+rr+24,c.blue);text("1,5R",xr,Y+rr*1.5+23,c.red);text("Κοινή ω ⇒ ακ ∝ R",W/2,28,c.ink);return}
 if(sc==="arc"){circ(X,Y,r,c.ink,2);const n=80;cx.beginPath();for(let i=0;i<=n;i++){const a=ang*i/n,[px,py]=circlePoint(X,Y,r,a);if(!i)cx.moveTo(px,py);else cx.lineTo(px,py)}cx.strokeStyle=c.gold;cx.lineWidth=6;cx.stroke();let p=circlePoint(X,Y,r,ang);line(X,Y,X+r,Y,c.muted,1.5,[4,4]);line(X,Y,p[0],p[1],c.blue,2.5);dot(p[0],p[1],8,c.blue);text("φ = "+sel.phi+"°",X,Y-14,c.blue);text("s = "+fmt(sel.R*ang)+" m",X,Y+r+28,c.gold);$("readout").innerHTML='<b>φ = '+fmt(ang)+' rad</b> · R = '+fmt(sel.R,1)+' m · τόξο s = Rφ = '+fmt(sel.R*ang)+' m';return}
 if(sc==="disk"){circ(X,Y,r,c.ink,2.5);const pa=circlePoint(X,Y,r*.46,th),pb=circlePoint(X,Y,r,th);line(X,Y,pb[0],pb[1],c.muted,1.5);dot(pa[0],pa[1],8,c.green);dot(pb[0],pb[1],8,c.blue);text("Α",pa[0]+11,pa[1]-9,c.green);text("Β",pb[0]+11,pb[1]-9,c.blue);const tangent=[-Math.sin(th),-Math.cos(th)];arrow(pb[0],pb[1],tangent[0]*45,tangent[1]*45,c.blue,"υΒ");arrow(pa[0],pa[1],tangent[0]*22,tangent[1]*22,c.green,"υΑ");$("readout").innerHTML='<b>ωΑ = ωΒ = '+fmt(sel.w)+' rad/s</b> · υΒ = '+fmt(vel)+' m/s · υΑ = '+fmt(vel*.46)+' m/s';return}
 if(sc==="delta"){circ(X,Y,r,c.muted,2);let p1=circlePoint(X,Y,r,0),p2=circlePoint(X,Y,r,PI);dot(p1[0],p1[1],7,c.blue);dot(p2[0],p2[1],7,c.red);arrow(p1[0],p1[1],0,-45,c.blue,"υαρχ");arrow(p2[0],p2[1],0,45,c.red,"υτελ");text("|Δυ| = 2υ",X,Y,c.green,18);return}
 const effectiveTheta=sc==="nonuniform"?sel.w*t+.5*sel.alpha*t*t:th;
 const p=circlePoint(X,Y,r,effectiveTheta),u=[-Math.sin(effectiveTheta),-Math.cos(effectiveTheta)],inside=[-Math.cos(effectiveTheta),Math.sin(effectiveTheta)];
 circ(X,Y,r,c.muted,2,[6,4]);dot(X,Y,3,c.ink);line(X,Y,p[0],p[1],c.muted,1.5,[4,4]);dot(p[0],p[1],9,c.blue);
 if(sc==="cut"){const fixed=PI*0,point=circlePoint(X,Y,r,fixed);dot(point[0],point[1],7,c.blue);line(point[0],point[1],point[0],point[1]-90,c.red,3,[6,5]);dot(point[0],point[1]-((t*sel.R*sel.w*10)%94),7,c.red);arrow(point[0],point[1],0,-50,c.blue,"υ");text("Το νήμα κόβεται εδώ",X,Y-6,c.red);return}
 arrow(p[0],p[1],u[0]*Math.min(70,vel*8+18),u[1]*Math.min(70,vel*8+18),c.blue,"υ");
 arrow(p[0],p[1],inside[0]*Math.min(72,acc*2.5+20),inside[1]*Math.min(72,acc*2.5+20),sc==="force"?c.red:c.green,sc==="force"?"ΣFκ":"ακ");
 if(sc==="nonuniform"){const av=sel.alpha*sel.R;arrow(p[0],p[1],u[0]*av*16,u[1]*av*16,c.gold,"αε");const omegaNow=sel.w+sel.alpha*t;$("readout").innerHTML="<b>ω(t) = "+fmt(omegaNow)+" rad/s</b> · α = "+fmt(sel.alpha,1)+" rad/s² · αε = "+fmt(sel.R*sel.alpha)+" m/s² · ακ = "+fmt(sel.R*omegaNow*omegaNow)+" m/s²"}
 if(sc==="force")$("readout").innerHTML="<b>ΣFκ = mω²R = "+fmt(sel.m*acc)+" N</b> · αₖ = "+fmt(acc)+" m/s² · Δεν προσθέτουμε επιπλέον δύναμη.";
}
function animate(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!paused){t+=dt*(slow?.25:1);draw()}requestAnimationFrame(animate)}
function sizePing(){const height=Math.ceil(document.body.scrollHeight);parent.postMessage({type:"omali-theory-height",height:height},"*")}
window.addEventListener("resize",()=>{draw();sizePing()});window.addEventListener("message",e=>{if(e.data==="omali-theory-ping")sizePing()});if(typeof ResizeObserver!=="undefined")new ResizeObserver(sizePing).observe(document.body);
renderUI();requestAnimationFrame(animate);setTimeout(sizePing,200);
</script>
